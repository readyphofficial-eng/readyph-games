<!DOCTYPE html><html><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>V92 - V91 + 72 Plots Perfect</title>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
<style>
html,body{margin:0;padding:0;background:#0a2e5c;overflow:hidden;height:100%;touch-action:none;font-family:Arial}
#game{position:fixed;inset:0}
#top{position:fixed;top:0;left:0;right:0;background:#000;color:#fff;padding:8px 10px;font-size:11px;font-weight:900;z-index:40;display:flex;justify-content:space-between}
#iconBar{position:fixed;top:42px;left:6px;z-index:70;display:flex;gap:12px;align-items:center}
.iconPlain{width:44px;height:44px;display:none;align-items:center;justify-content:center;font-size:26px;cursor:pointer;filter:drop-shadow(0 2px 4px rgba(0,0,0,.8));user-select:none}
.iconPlain.show{display:flex}
#shopWrap{position:fixed;bottom:0;left:0;right:0;height:165px;background:#0f0f0f;border-top:3px solid #4ade80;z-index:60;transition:transform.35s ease}
#shopWrap.closed{transform:translateY(100%)}
#shop{height:100%;display:flex;gap:8px;padding:38px 10px 10px 10px;overflow-x:auto}
#shopClose{position:absolute;top:6px;right:10px;width:32px;height:32px;background:rgba(255,255,255,.15);color:#fff;border:none;border-radius:8px;font-size:16px;font-weight:900;z-index:5}
#shopHandle{position:absolute;top:-2px;left:50%;transform:translateX(-50%);width:60px;height:18px;background:#4ade80;border:none;border-radius:0 0 10px 10px;font-size:10px;font-weight:900}
.card{width:82px;min-width:82px;height:118px;background:#222;border:2px solid #444;border-radius:10px;display:flex;flex-direction:column;align-items:center;padding:6px;flex-shrink:0}
.card img{width:48px;height:48px;object-fit:contain;background:#1a1a1a;border-radius:8px}
.card b{font-size:7px;color:#fff;margin:4px 0;text-align:center}
.card button{background:#4ade80;color:#000;border:none;border-radius:6px;padding:5px;font-size:8px;font-weight:900;width:100%}
#buildShop{position:fixed;bottom:0;left:0;right:0;height:220px;background:#0f172a;border-top:3px solid #22c55e;border-radius:20px 20px 0 0;z-index:80;transition:transform.35s ease;transform:translateY(110%);padding:14px}
#buildShop.open{transform:translateY(0)}
.buildGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px}
.buildCard{background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.15);border-radius:14px;padding:10px;text-align:center;cursor:pointer}
.buildCard:hover{background:rgba(34,197,94,0.25);border-color:#22c55e}
.buildCard b{color:white;font-size:11px;display:block}
.buildCard span{color:#86efac;font-size:10px}
#ownedTab{position:fixed;top:92px;left:0;bottom:175px;width:70px;background:rgba(0,0,0,.92);border-right:2px solid #4ade80;border-top:2px solid #4ade80;border-radius:0 12px 0 0;z-index:55;display:flex;flex-direction:column;align-items:center;padding:6px 0;transition:transform.35s ease}
#ownedTab.minimized{transform:translateX(-100%)}
#ownedList{flex:1;width:100%;overflow-y:auto;display:flex;flex-direction:column;gap:6px;padding:0 5px;align-items:center}
.ownedItem{width:48px;height:48px;background:#222;border:2px solid #555;border-radius:12px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.ownedItem img{width:36px;height:36px;object-fit:contain}
#questWin{position:fixed;top:92px;right:0;width:195px;background:rgba(0,0,0,.95);border-left:3px solid #fbbf24;border-bottom:3px solid #fbbf24;border-top:3px solid #fbbf24;border-radius:16px 0 0 16px;z-index:55;padding:10px;max-height:50vh;overflow-y:auto;transition:transform.35s ease}
#questWin.minQ{transform:translateX(100%)}
.qRow{background:#2a2a2a;margin:4px 0;padding:6px;border-radius:6px;font-size:9px;color:#fff;border-left:3px solid #fbbf24}
.qRow.done{border-left-color:#4ade80;opacity:0.6}
.minBtnInside{position:absolute;top:6px;width:26px;height:26px;border:none;border-radius:8px;font-size:12px;font-weight:900;background:rgba(255,255,255,.15);color:#fff}
#ownedMin{right:6px}
#questMin{left:6px}
#zoomCtrl{position:fixed;bottom:235px;right:10px;z-index:70;display:flex;flex-direction:column;gap:8px}
#zoomCtrl button{width:44px;height:44px;background:rgba(0,0,0,.9);color:#fff;border:2px solid #4ade80;border-radius:12px;font-size:20px;font-weight:900;box-shadow:0 2px 8px rgba(0,0,0,.6)}
#statWin{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) scale(0);background:#1e1e1e;border:3px solid #4ade80;border-radius:16px;padding:12px;width:310px;z-index:90;transition:transform.2s;max-height:85vh;overflow-y:auto}
#statWin.open{transform:translate(-50%,-50%) scale(1)}
#familyWin{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) scale(0);background:#1e1e1e;border:3px solid #f472b6;border-radius:16px;padding:12px;width:320px;z-index:95;transition:transform.2s;max-height:85vh;overflow-y:auto}
#familyWin.open{transform:translate(-50%,-50%) scale(1)}
.animGrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:5px;margin:8px 0}
.animGrid button{padding:7px 2px;border:none;border-radius:8px;font-size:9px;font-weight:900;color:#000}
.statRow{display:flex;justify-content:space-between;background:#2a2a2a;margin:3px 0;padding:5px 8px;border-radius:6px;font-size:10px;color:#ddd}
.statRow b{color:#4ade80}
#msg{position:fixed;top:50px;left:50%;transform:translateX(-50%) scale(0);background:linear-gradient(90deg,#22c55e,#16a34a);color:#fff;padding:9px 18px;border-radius:20px;font-weight:900;font-size:11px;z-index:70;transition:transform.3s;pointer-events:none}
#msg.show{transform:translateX(-50%) scale(1)}
.editBtn{background:#fbbf24;color:#000;border:none;border-radius:4px;padding:2px 6px;font-size:9px;font-weight:900;margin-left:6px}
</style>
</head><body>
<div id="game"></div>
<div id="top"><span>🏝️ V92 - 72 Plots Perfect</span><span>🪙 <span id="coins">500</span> | <span id="cnt">0</span> | ❤️ <span id="fCount">0</span></span></div>
<div id="iconBar">
<div id="icoOwned" class="iconPlain show" onclick="toggleOwned()">👥</div>
<div id="icoQuest" class="iconPlain show" onclick="toggleQuest()">📜</div>
<div id="icoShop" class="iconPlain show" onclick="toggleShop()">🛒</div>
</div>
<div id="ownedTab" class="minimized"><button id="ownedMin" class="minBtnInside" onclick="toggleOwned()">✖</button><b style="font-size:9px;margin-top:28px">OWNED</b><div id="ownedList"></div></div>
<div id="questWin" class="minQ"><button id="questMin" class="minBtnInside" onclick="toggleQuest()">✖</button><div style="margin-left:24px"><b style="font-size:10px;color:#fbbf24">📜 QUESTS</b></div><div id="questList"></div><div style="display:flex;gap:4px;margin-top:6px"><button onclick="saveGame()" style="flex:1;background:#4ade80;border:none;border-radius:6px;padding:6px;font-size:8px;font-weight:900">💾 SAVE</button><button onclick="clearSave()" style="flex:1;background:#fb7185;border:none;border-radius:6px;padding:6px;font-size:8px;font-weight:900">🗑️ RESET</button></div></div>
<div id="zoomCtrl"><button onclick="zoomIn()">+</button><button onclick="zoomOut()">−</button><button onclick="resetZoom()" style="font-size:12px">⌖</button></div>
<div id="msg"></div>
<div id="familyWin"><div id="familyContent"></div><button onclick="closeFamily()" style="width:100%;margin-top:8px;padding:8px;background:#333;color:#fff;border:none;border-radius:8px;font-weight:900">CLOSE</button></div>
<div id="statWin"><div style="display:flex;gap:10px;align-items:center"><img id="sImg" style="width:52px;height:52px;background:#111;border-radius:10px;object-fit:contain"><div><h3 id="sName" style="margin:0;color:#fff;font-size:13px">Name</h3><div id="sType" style="color:#aaa;font-size:9px"></div><div id="sAnim" style="color:#4ade80;font-size:10px;font-weight:900"></div></div></div><div class="animGrid"><button style="background:#60a5fa" onclick="playAnim('walk')">WALK</button><button style="background:#fb7185" onclick="playAnim('run')">RUN</button><button style="background:#a7f3d0" onclick="playAnim('idle')">IDLE</button><button style="background:#fde68a" onclick="playAnim('jump')">JUMP</button><button style="background:#fbbf24" onclick="playAnim('eat')">EAT</button><button style="background:#c4b5fd" onclick="playAnim('sleep')">SLEEP</button><button style="background:#f472b6" onclick="playAnim('dance')">DANCE</button><button style="background:#6ee7b7" onclick="playAnim('sit')">SIT</button><button style="background:#93c5fd" onclick="playAnim('wave')">WAVE</button><button style="background:#facc15" onclick="playAnim('cheer')">CHEER</button><button style="background:#a5b4fc" onclick="playAnim('spin')">SPIN</button><button style="background:#fdba74" onclick="playAnim('bounce')">BOUNCE</button></div><div id="sStats"></div><button id="familyBtn" style="width:100%;margin-top:8px;padding:10px;background:linear-gradient(90deg,#f472b6,#a78bfa);color:#fff;border:none;border-radius:8px;font-weight:900;display:none">👨‍👩‍👧 FAMILY</button><button onclick="closeStat()" style="width:100%;margin-top:8px;padding:8px;background:#333;color:#fff;border:none;border-radius:8px;font-weight:900">CLOSE</button></div><div id="shopWrap" class="closed"><button id="shopHandle" onclick="toggleShop()">▼</button><button id="shopClose" onclick="toggleShop()">✖</button><div id="shop"></div></div>
<div id="buildShop"><div style="display:flex;justify-content:space-between;color:white"><b>🏗️ Build - Plot <span id="plotId">-</span> - 72 Plots Perfect Open Space</b><button onclick="closeBuildShop()" style="width:32px;height:32px;background:rgba(255,255,255,.15);border:none;border-radius:8px;color:#fff;font-weight:900">✕</button></div><div class="buildGrid" id="buildGrid"></div></div>
<script>
const ANIMALS=['beaver','bee','bunny','cat','caterpillar','chick','cow','crab','deer','dog','elephant','fox','giraffe','hog','koala','lion','monkey','panda','parrot','penguin','pig','polar','tiger'];
const HUMANS=['female-a','female-b','female-c','female-d','female-e','female-f','male-a','male-b','male-c','male-d','male-e','male-f'];
const NAMES=['Luna','Milo','Kiko','Bilog','Kulit','Ganda','Bebe','Momo','Juan','Maria'];
const DIALOGUES={walk:["Lakad muna!"],run:["Bilisan!"],idle:["Chill lang"],jump:["Wheee!"],eat:["Yum!"],sleep:["Zzz..."],dance:["Party!"],sit:["Pahinga"],wave:["Hi!"],cheer:["Yay!"],spin:["Woo!"],bounce:["Boing!"]};
const EMOJIS={walk:"🚶",run:"🏃",idle:"💭",jump:"🤾",eat:"😋",sleep:"💤",dance:"🪩",sit:"😌",wave:"👋",cheer:"🎉",spin:"🌀",bounce:"⚽"};
const BUILDINGS=[{icon:'🏥',name:'Hospital',price:120,income:8},{icon:'🏫',name:'School',price:90,income:6},{icon:'🏪',name:'Market',price:60,income:4},{icon:'🏠',name:'House',price:40,income:2},{icon:'🌳',name:'Park',price:30,income:1},{icon:'🏭',name:'Factory',price:150,income:12},];
let coins=500,selected=null,isShopOpen=false,selectedEnt=null,totalFriends=0,isOwnedMin=true,isQuestMin=true,curZoom=0.40;
let selectedPlot=null;
let quests=[{id:'spawn3',txt:'Mag spawn ng 3',target:3,prog:0,done:false,reward:30,icon:'🌱'},{id:'friends3',txt:'3 friends',target:3,prog:0,done:false,reward:50,icon:'🤝'},{id:'pet1',txt:'Magka pet',target:1,prog:0,done:false,reward:40,icon:'🐾'},{id:'lvl2',txt:'Mag LVL2',target:1,prog:0,done:false,reward:60,icon:'⬆️'},{id:'lover',txt:'Magka lover',target:1,prog:0,done:false,reward:100,icon:'💕'},{id:'baby',txt:'Magka baby',target:1,prog:0,done:false,reward:150,icon:'👶'},{id:'build3',txt:'Mag build ng 3 plots',target:3,prog:0,done:false,reward:80,icon:'🏗️'}];
function toggleOwned(){isOwnedMin=!isOwnedMin;document.getElementById('ownedTab').classList.toggle('minimized',isOwnedMin);document.getElementById('icoOwned').classList.toggle('show',isOwnedMin);}
function toggleQuest(){isQuestMin=!isQuestMin;document.getElementById('questWin').classList.toggle('minQ',isQuestMin);document.getElementById('icoQuest').classList.toggle('show',isQuestMin);}
function toggleShop(){isShopOpen=!isShopOpen;document.getElementById('shopWrap').className=isShopOpen?'':'closed';let ico=document.getElementById('icoShop');ico.classList.toggle('show',!isShopOpen);}
function openBuildShop(plot){selectedPlot=plot;document.getElementById('plotId').textContent=plot.plotId;document.getElementById('buildShop').classList.add('open');renderBuildShop();}
function closeBuildShop(){document.getElementById('buildShop').classList.remove('open');}
function renderBuildShop(){const grid=document.getElementById('buildGrid');grid.innerHTML='';BUILDINGS.forEach(b=>{const can=coins>=b.price;const el=document.createElement('div');el.className='buildCard';el.style.opacity=can?'1':'0.4';el.innerHTML=`<div style="font-size:26px">${b.icon}</div><b>${b.name}</b><span>${b.price}🪙 +${b.income}/s</span>`;el.onclick=()=>{if(!can) return; buyBuilding(b);};grid.appendChild(el);});}
function buyBuilding(b){if(coins<b.price||!selectedPlot) return;coins-=b.price;document.getElementById('coins').innerText=coins;selectedPlot.building=b;selectedPlot.plotBox.setVisible(false);let scene=window.game.scene.scenes[0];let icon=scene.add.text(selectedPlot.x, selectedPlot.y-10, b.icon, {fontSize:'32px'}).setOrigin(0.5).setDepth(15);scene.tweens.add({targets:icon, scale:{from:0,to:1}, duration:300, ease:'Back'});selectedPlot.buildingIcon=icon;closeBuildShop();updateQuest('build3',1);saveGame(true);setInterval(()=>{coins+=b.income;document.getElementById('coins').innerText=coins;},1000);}
function zoomIn(){curZoom=Math.min(1.5,curZoom+0.12);if(window.game) window.game.scene.scenes[0].cameras.main.setZoom(curZoom);}
function zoomOut(){curZoom=Math.max(0.18,curZoom-0.12);if(window.game) window.game.scene.scenes[0].cameras.main.setZoom(curZoom);}
function resetZoom(){curZoom=0.40;if(window.game){let s=window.game.scene.scenes[0];s.cameras.main.setZoom(curZoom);s.cameras.main.centerOn(2048,2048);}}
function getGender(id){return id.includes('female')?'female':id.includes('male')?'male':'animal';}
function isHumanId(id){return id.includes('female')||id.includes('male');}
function saveGame(silent=false){if(!window.game) return;let scene=window.game.scene.scenes[0];let data={coins:coins,totalFriends:totalFriends,ents:scene.ents.map(e=>({x:e.x,y:e.y,id:e.stats.id,stats:e.stats})),quests:quests,buildings:scene.plots.filter(p=>p.building).map(p=>({plotId:p.plotId,b:p.building}))};localStorage.setItem('triV92',JSON.stringify(data));if(!silent) scene.showMsg('💾 Saved!');}
function clearSave(){if(confirm('Reset?')){localStorage.removeItem('triV92');location.reload();}}
function loadGameData(){try{let d=localStorage.getItem('triV92');if(d) return JSON.parse(d);}catch(e){}return null;}
function editName(){if(!selectedEnt) return;let newName=prompt('Bagong name:',selectedEnt.stats.name);if(newName&&newName.trim()!=''){selectedEnt.stats.name=newName.trim().substring(0,18);document.getElementById('sName').innerHTML=`${selectedEnt.stats.name} <button class="editBtn" onclick="editName()">✏️</button>`;if(window.game) window.game.scene.scenes[0].showMsg('✏️ '+selectedEnt.stats.name);saveGame(true);}}
function updateQuest(id,add=1){let q=quests.find(x=>x.id==id);if(!q||q.done) return;q.prog+=add;if(q.prog>=q.target){q.done=true;coins+=q.reward;document.getElementById('coins').innerText=coins;if(window.game) window.game.scene.scenes[0].showMsg('🎉 '+q.txt+' +'+q.reward+'!');}renderQuests();}
function renderQuests(){let list=document.getElementById('questList');list.innerHTML='';quests.forEach(q=>{let div=document.createElement('div');div.className='qRow'+(q.done?' done':'');div.innerHTML=`<div style="display:flex;justify-content:space-between"><span>${q.icon} ${q.txt}</span><b>${q.done?'✅':q.prog+'/'+q.target}</b></div><div style="font-size:7px;color:#aaa">+${q.reward} coins</div>`;list.appendChild(div);});}
const MAP_CX=2048, MAP_CY=2048;
function isWater(x,y){
 let dx=x-MAP_CX, dy=y-MAP_CY; let dist=Math.sqrt(dx*dx+dy*dy);
 if(dist>1480) return true;
 if(dist>580 && dist<820){ let isBridgeH=Math.abs(dy)<70; let isBridgeV=Math.abs(dx)<70; if(isBridgeH||isBridgeV) return false; return true; }
 if(Math.abs(dx)<110 && y>MAP_CY+800 && y<MAP_CY+1450) return true;
 if(Math.abs(dx)<110 && y<MAP_CY-800 && y>MAP_CY-1450) return true;
 if(Math.abs(dy)<110 && x>MAP_CX+800 && x<MAP_CX+1450) return true;
 if(Math.abs(dy)<110 && x<MAP_CX-800 && x>MAP_CX-1450) return true;
 if(Math.abs(dx)<55 && y>MAP_CY+800 && y<MAP_CY+1450) return false;
 if(Math.abs(dx)<55 && y<MAP_CY-800 && y>MAP_CY-1450) return false;
 if(Math.abs(dy)<55 && x>MAP_CX+800 && x<MAP_CX+1450) return false;
 if(Math.abs(dy)<55 && x<MAP_CX-800 && x>MAP_CX-1450) return false;
 return false;
}
function isWalkable(x,y){ return!isWater(x,y); }
function getNearestWalkable(x,y){
 if(isWalkable(x,y)) return {x,y};
 for(let r=20;r<300;r+=20){ for(let a=0;a<Math.PI*2;a+=Math.PI/6){ let nx=x+Math.cos(a)*r, ny=y+Math.sin(a)*r; if(isWalkable(nx,ny)) return {x:nx,y:ny}; } }
 return {x:MAP_CX,y:MAP_CY};
}
</script>
<script>
class WorldV92 extends Phaser.Scene{
constructor(){super('WorldV92');this.ents=[];this.plots=[]}
preload(){
this.load.image('map','new/newmap.webp'); // 3840*2560 MO
ANIMALS.forEach(n=>{this.load.image('a-'+n,'new/animal-'+n+'.png');});
HUMANS.forEach(n=>{this.load.image('h-'+n,'new/character-'+n+'.png');});
}
create(){
let W=3840, H=2560;
if(this.textures.exists('map')){
try{
let img=this.textures.get('map').getSourceImage();
W=img.width; H=img.height;
}catch(e){}
}
const islandCX=W/2, islandCY=H/2;

if(this.textures.exists('map')){
try{
this.island=this.add.image(W/2,H/2,'map').setDepth(1);
this.island.setDisplaySize(W, H);
this.island.setOrigin(0.5);
}catch(e){this.createFallback(W,H);}
}else{this.createFallback(W,H);}

// --- BOXES ADJUSTED SA BAGONG 3840*2560 SCREEN! ---
// Ngayon W=3840, H=2560 na basehan - mas malaki open area kaya mas malaki boxes!
// Full occupy open grass, curved, border only, glow grow, hindi umaapaw!

const plotFields=[
// NW - white side - TOP
{ox:-0.29, oy:-0.31, bw:0.19, bh:0.16, curve:0.02}, // mas malaki bw/bh para full occupy!
{ox:-0.40, oy:-0.09, bw:0.18, bh:0.16, curve:-0.01},

// NE - pink side - TOP
{ox:0.29, oy:-0.31, bw:0.19, bh:0.16, curve:-0.02},
{ox:0.40, oy:-0.07, bw:0.18, bh:0.17, curve:0.01},

// SW - orange side - BOTTOM
{ox:-0.40, oy:0.13, bw:0.18, bh:0.16, curve:0.01},
{ox:-0.29, oy:0.36, bw:0.20, bh:0.18, curve:0.03}, // mas malaki para puno southwest!

// SE - green side - BOTTOM
{ox:0.40, oy:0.15, bw:0.18, bh:0.17, curve:-0.01},
{ox:0.29, oy:0.37, bw:0.20, bh:0.18, curve:-0.03}, // mas malaki para puno southeast!
];

let plotId=0;
plotFields.forEach(f=>{
 const fieldCX=islandCX + f.ox * W;
 const fieldCY=islandCY + f.oy * H;
 const fieldBW=f.bw * W;
 const fieldBH=f.bh * H;
 const boxW=fieldBW/3, boxH=fieldBH/3;
 for(let r=0;r<3;r++){
  for(let c=0;c<3;c++){
   plotId++;
   // CURVED EFFECT - konting offset per row para curved tingnan!
   let curveOffset = (r-1) * f.curve * W * 0.08;
   const x=fieldCX - fieldBW/2 + boxW*c + boxW*0.5 + curveOffset;
   const y=fieldCY - fieldBH/2 + boxH*r + boxH*0.5;
   // MAS MALAKI NA BOXES - FULL OCCUPY OPEN AREA!
   const w=boxW*0.92, h=boxH*0.90; // dati 0.90/0.88, ngayon 0.92/0.90 - mas puno!
   const box=this.add.rectangle(x,y,w,h,0x000000,0).setDepth(5).setStrokeStyle(3.2,0x22ff66,1);
   box.setInteractive({useHandCursor:true});
   box.plotId=plotId;
   if(box.preFX){ let fx=box.preFX.addGlow(0x22ff66,7,0,false,0.26,16); box.glowFX=fx; }
   // BORDER LANG NAG-GROW!
   box.on('pointerover',()=>{
    if(!box.parentPlot.building) {
     this.tweens.add({targets:box, scale:1.25, duration:160, ease:'Back.Out'});
     if(box.glowFX) box.glowFX.outerStrength=10;
    }
   });
   box.on('pointerout',()=>{
    if(!box.parentPlot.building) {
     this.tweens.add({targets:box, scale:1, duration:160, ease:'Back.In'});
     if(box.glowFX) box.glowFX.outerStrength=6;
    }
   });
   box.on('pointerdown',()=>{ selectedPlot=box.parentPlot; openBuildShop(box.parentPlot); });
   const plot={x,y,plotId,plotBox:box,building:null,buildingIcon:null};
   box.parentPlot=plot;
   this.plots.push(plot);
  }
 }
});

this.cameras.main.setBounds(0,0,W,H);
this.cameras.main.centerOn(W/2,H/2);
let screenW=window.innerWidth, screenH=window.innerHeight;
let zoomX=screenW / W, zoomY=screenH / H;
curZoom=Math.min(zoomX, zoomY) * 1.15;
if(curZoom>0.65) curZoom=0.65;
if(curZoom<0.20) curZoom=0.20;
this.cameras.main.setZoom(curZoom);

this.isDragging=false;
this.input.on('pointerdown',p=>{
if(document.getElementById('buildShop').classList.contains('open')){if(p.y>innerHeight-220) return; closeBuildShop();}
if(isShopOpen){if(p.y < innerHeight-165){if(selected){let wp=this.cameras.main.getWorldPoint(p.x,p.y);if(!isWalkable(wp.x,wp.y)){ this.showMsg('🚫 Bawal sa tubig!'); return; }this.spawn(wp.x,wp.y,selected,false);selected=null;updateQuest('spawn3',1);return;}if(p.y < innerHeight-200) toggleShop();return;}}
if(p.x<70&&!isOwnedMin&&p.y>92&&p.y<innerHeight-165) return;
if(p.x>innerWidth-195&&!isQuestMin&&p.y>92&&p.y<320) return;
if(document.getElementById('statWin').classList.contains('open')||document.getElementById('familyWin').classList.contains('open')) return;
if(!isShopOpen){this.isDragging=true;this.dragStart={x:p.x,y:p.y,sx:this.cameras.main.scrollX,sy:this.cameras.main.scrollY};}
});
this.input.on('pointermove',p=>{if(this.isDragging&&this.dragStart&&!isShopOpen){this.cameras.main.scrollX=this.dragStart.sx-(p.x-this.dragStart.x)/curZoom;this.cameras.main.scrollY=this.dragStart.sy-(p.y-this.dragStart.y)/curZoom;}});
this.input.on('pointerup',()=>this.isDragging=false);
this.input.on('wheel',(p,dx,dy)=>{if(dy>0) zoomOut(); else zoomIn();});
this.buildShop();document.getElementById('familyBtn').onclick=()=>{this.showFamilyTree();};renderQuests();
let saved=loadGameData();if(saved){coins=saved.coins||500;totalFriends=saved.totalFriends||0;document.getElementById('coins').innerText=coins;document.getElementById('fCount').innerText=totalFriends;if(saved.quests) quests=saved.quests;renderQuests();if(saved.ents){saved.ents.forEach(ed=>{this.spawn(ed.x,ed.y,ed.id,false,true,ed.stats);});}if(saved.buildings){saved.buildings.forEach(bd=>{let plot=this.plots.find(p=>p.plotId==bd.plotId);if(plot){plot.building=bd.b;plot.plotBox.setVisible(false);let icon=this.add.text(plot.x,plot.y-10,bd.b.icon,{fontSize:'32px'}).setOrigin(0.5).setDepth(15);plot.buildingIcon=icon;}});}}
this.time.addEvent({delay:15000,callback:()=>saveGame(true),loop:true});
}
createFallback(W,H){let g=this.add.graphics().setDepth(1);g.fillStyle(0x1a4d2e,1);g.fillCircle(W/2,H/2,Math.min(W,H)/2.5);}
buildShop(){const shop=document.getElementById('shop');shop.innerHTML='';[...HUMANS.map(n=>({id:'h-'+n,name:n,price:20,t:'human'})),...ANIMALS.map(n=>({id:'a-'+n,name:n,price:10,t:'animal'}))].forEach(it=>{let key=it.id;let c=document.createElement('div');c.className='card';c.innerHTML=`<img src="new/${it.t=='human'?'character':'animal'}-${it.name}.png"><b>${it.name.toUpperCase()}</b><button>🪙${it.price}</button>`;c.querySelector('button').onclick=()=>{if(coins<it.price) return;if(!this.textures.exists(key)) return;coins-=it.price;document.getElementById('coins').innerText=coins;selected=key;document.querySelectorAll('.card').forEach(x=>x.style.borderColor='#444');c.style.borderColor='#4ade80';this.showMsg('Tap sa land para mag spawn!');};shop.appendChild(c);});}
spawn(x,y,id,isBaby=false,isLoad=false,loadStats=null){
if(!this.textures.exists(id)) return;
if(!isLoad &&!isWalkable(x,y)){ let near=getNearestWalkable(x,y); x=near.x; y=near.y; }
let human=isHumanId(id);
let spr=this.add.image(x,y,id).setDepth(10).setInteractive();
if(human){ spr.setDisplaySize(42,56); } else { spr.setDisplaySize(36,36); }
spr.baseW=spr.displayWidth; spr.baseH=spr.displayHeight;
if(spr.preFX){let glowColor = human? 0x4ade80 : 0xfbbf24; let fx = spr.preFX.addGlow(glowColor, 4, 0, false, 0.15, 12);}
let shadow=this.add.ellipse(x,y+20, human?26:20, 8, 0x000000, 0.28).setDepth(9);
if(isLoad&&loadStats){spr.stats=loadStats;}else{spr.stats={name:(isBaby?'Baby ':'')+NAMES[Math.floor(Math.random()*NAMES.length)]+' #'+Math.floor(Math.random()*99),type:id.replace('a-','').replace('h-','').toUpperCase(),gender:getGender(id),isHuman:human,lvl:1,happiness:60+Math.floor(Math.random()*15),friends:0,friendsList:[],lover:null,loverName:null,familyTime:0,togetherTime:0,children:[],isBaby:isBaby,owner:null,ownerRef:null,pet:null,petName:null,id:id};}
spr.animState='idle'; spr.baseSpeed=human?0.55:0.65; spr.moveTimer=2500+Math.random()*1500; spr.lastMeet=0; spr.vx=0; spr.vy=0; spr.lastChat=0;
spr.shadowRef = shadow;
this.ents.push(spr);
document.getElementById('cnt').innerText=this.ents.length;
this.addOwned(spr);
this.playAnimOn(spr,'idle');
spr.on('pointerdown',()=>this.showStats(spr));
if(!isLoad) saveGame(true);
return spr;
}
addOwned(ent){const list=document.getElementById('ownedList');let div=document.createElement('div');div.className='ownedItem';div.innerHTML=`<img src="new/${ent.stats.isHuman?'character':'animal'}-${ent.stats.type.toLowerCase()}.png">`;div.onclick=()=>{selectedEnt=ent;this.focusOn(ent);this.showStats(ent);};list.appendChild(div);}
focusOn(ent){this.cameras.main.pan(ent.x,ent.y,400,'Power2');}
showStats(ent){selectedEnt=ent;document.getElementById('sImg').src='new/'+(ent.stats.isHuman?'character':'animal')+'-'+ent.stats.type.toLowerCase()+'.png';document.getElementById('sName').innerHTML=`${ent.stats.name} <button class="editBtn" onclick="editName()">✏️</button>`;document.getElementById('sType').innerText=ent.stats.type+' • '+ent.stats.gender.toUpperCase();document.getElementById('sAnim').innerText='LVL'+ent.stats.lvl+' | '+ent.animState.toUpperCase();let loverTxt=ent.stats.lover?'💕 '+ent.stats.loverName:'Single';let petTxt=ent.stats.pet?'🐾 '+ent.stats.petName:'Wala pa';let ownerTxt=ent.stats.owner?'🐾 '+ent.stats.owner:'Wild';document.getElementById('sStats').innerHTML=`<div class="statRow"><span>LEVEL</span><b>${ent.stats.lvl}</b></div><div class="statRow"><span>FRIENDS</span><b>${ent.stats.friends}</b></div>${ent.stats.isHuman?`<div class="statRow"><span>LOVER</span><b>${loverTxt}</b></div><div class="statRow"><span>PET</span><b>${petTxt}</b></div>`: `<div class="statRow"><span>OWNER</span><b>${ownerTxt}</b></div>`}`;document.getElementById('familyBtn').style.display=(ent.stats.isHuman&&(ent.stats.lover||ent.stats.children.length>0))?'block':'none';document.getElementById('statWin').classList.add('open');}
showFamilyTree(){if(!selectedEnt) return;let s=selectedEnt.stats;let html=`<h3 style="color:#fff;margin:0">${s.name} Family</h3>`;if(s.lover) html+=`<div class="statRow"><span>PARTNER</span><b>${s.loverName}</b></div>`;if(s.children.length>0) s.children.forEach(ch=>{html+=`<div class="statRow"><span>KID</span><b>${ch}</b></div>`;});document.getElementById('familyContent').innerHTML=html;document.getElementById('familyWin').classList.add('open');}
checkLevelUp(ent){if(ent.stats.lvl>=5) return;let f=ent.stats.friends;if(ent.stats.lvl==1&&f>=3){ent.stats.lvl++;if(ent.stats.lvl==2) updateQuest('lvl2',1);this.showMsg('⬆️ LVL2 '+ent.stats.name);saveGame(true);}}
makeFriends(a,b){if(a==b||Date.now()-a.lastMeet<4000) return;if(!a.stats.isHuman && b.stats.isHuman){if(b.stats.pet) return;if(!a.stats.owner){a.stats.owner=b.stats.name;a.stats.ownerRef=b;b.stats.pet=a;b.stats.petName=a.stats.name;updateQuest('pet1',1);}}if(!b.stats.isHuman && a.stats.isHuman){if(a.stats.pet) return;if(!b.stats.owner){b.stats.owner=a.stats.name;b.stats.ownerRef=a;a.stats.pet=b;a.stats.petName=b.stats.name;updateQuest('pet1',1);}}if(a.stats.isHuman&&b.stats.isHuman){if(a.stats.friendsList.includes(b.stats.name)){if(a.stats.lover==b){let dist=Phaser.Math.Distance.Between(a.x,a.y,b.x,b.y);if(dist<110){a.stats.familyTime+=200;b.stats.familyTime+=200;if(a.stats.familyTime>60000){this.makeBaby(a,b);a.stats.familyTime=0;b.stats.familyTime=0;}}}return;}a.stats.friendsList.push(b.stats.name);b.stats.friendsList.push(a.stats.name);a.stats.friends++;b.stats.friends++;totalFriends++;document.getElementById('fCount').innerText=totalFriends;updateQuest('friends3',1);a.lastMeet=Date.now();b.lastMeet=Date.now();this.checkLevelUp(a);this.checkLovers(a,b);saveGame(true);}}
checkLovers(a,b){if(!a.stats.isHuman||!b.stats.isHuman||a.stats.lover||b.stats.lover||a.stats.gender==b.stats.gender) return;if(a.stats.lvl<2||b.stats.lvl<2) return;if(Phaser.Math.Distance.Between(a.x,a.y,b.x,b.y)>85) return;if(Math.random()<0.02){a.stats.lover=b;a.stats.loverName=b.stats.name;b.stats.lover=a;b.stats.loverName=a.stats.name;this.showMsg('💕 '+a.stats.name+' + '+b.stats.name);updateQuest('lover',1);saveGame(true);}}
makeBaby(a,b){let babyId=Math.random()<0.5?a.stats.id:b.stats.id;let pos=getNearestWalkable((a.x+b.x)/2,(a.y+b.y)/2);this.spawn(pos.x,pos.y+20,babyId,true);let last=this.ents[this.ents.length-1];if(last){last.stats.name='Baby '+NAMES[Math.floor(Math.random()*NAMES.length)];}a.stats.children.push(last.stats.name);b.stats.children.push(last.stats.name);this.showMsg('👶 Baby!');updateQuest('baby',1);saveGame(true);}
showMsg(t){let el=document.getElementById('msg');el.innerText=t;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),2500);}
showBubble(ent,anim){if(Math.random()>0.5) return;if(Date.now()-ent.lastChat<5000) return;ent.lastChat=Date.now();if(ent._bubble) ent._bubble.destroy();if(ent._bubbleBg) ent._bubbleBg.destroy();let emoji=EMOJIS[anim]||"💬";let list=DIALOGUES[anim]||["..."];let txt=list[Math.floor(Math.random()*list.length)];let full=`${emoji} ${txt}`;let bubble=this.add.text(ent.x,ent.y-50,full,{fontSize:'14px',color:'#000',fontFamily:'Arial Black',stroke:'#fff',strokeThickness:4}).setOrigin(0.5).setDepth(61);let bg=this.add.rectangle(ent.x,ent.y-50,bubble.width+12,bubble.height+8,0xffffff,1).setDepth(60).setStrokeStyle(2,0x000000);ent._bubble=bubble;ent._bubbleBg=bg;this.tweens.add({targets:[bubble,bg],y:bubble.y-12,alpha:0,duration:2500,delay:1000,onComplete:()=>{bubble.destroy();bg.destroy();}});}
playAnimOn(ent,anim){if(!ent.active) return;ent.animState=anim;if(selectedEnt==ent) document.getElementById('sAnim').innerText='LVL'+ent.stats.lvl+' | '+anim.toUpperCase();this.showBubble(ent,anim);if(ent.currentTween) ent.currentTween.stop();this.tweens.killTweensOf(ent);ent.setAngle(0); ent.setAlpha(1);ent.setDisplaySize(ent.baseW,ent.baseH);if(anim=='walk'||anim=='run'){ent.currentTween=this.tweens.add({targets:ent,y:ent.y-1.5,duration:250,yoyo:true,repeat:-1});}}
update(t,d){
if(isShopOpen) return;
for(let i=0;i<this.ents.length;i++) for(let j=i+1;j<this.ents.length;j++){let a=this.ents[i],b=this.ents[j];if(Phaser.Math.Distance.Between(a.x,a.y,b.x,b.y)<55) this.makeFriends(a,b);}
this.ents.forEach(e=>{
if(e.shadowRef) { e.shadowRef.x=e.x; e.shadowRef.y=e.y+20; }
if(e._bubble&&e._bubble.active){e._bubble.x=e.x;e._bubbleBg.x=e.x;e._bubble.y=e.y-50;e._bubbleBg.y=e.y-50;}
if(e.stats.ownerRef&&e.stats.ownerRef.active){
let dist=Phaser.Math.Distance.Between(e.x,e.y,e.stats.ownerRef.x,e.stats.ownerRef.y);
if(dist>100){
let ang=Math.atan2(e.stats.ownerRef.y-e.y,e.stats.ownerRef.x-e.x);
let nx=e.x+Math.cos(ang)*e.baseSpeed*1.2, ny=e.y+Math.sin(ang)*e.baseSpeed*1.2;
if(isWalkable(nx,ny)){ e.x=nx; e.y=ny; }
return;
}
}
e.moveTimer-=d;
if(e.moveTimer<=0){
let tries=0, found=false;
while(tries<12 &&!found){
let ang=Math.random()*Math.PI*2;
let dist=120+Math.random()*180;
let tx=e.x+Math.cos(ang)*dist, ty=e.y+Math.sin(ang)*dist;
if(isWalkable(tx,ty)){
this.playAnimOn(e,'walk');
e.moveTimer=2500+Math.random()*1500;
e.targetX=tx; e.targetY=ty;
let a2=Math.atan2(e.targetY-e.y,e.targetX-e.x);
e.vx=Math.cos(a2)*e.baseSpeed; e.vy=Math.sin(a2)*e.baseSpeed;
found=true;
}
tries++;
}
if(!found){ this.playAnimOn(e,'idle'); e.moveTimer=1500; e.vx=0; e.vy=0; }
}
if(e.animState=='walk'||e.animState=='run'){
let nx=e.x+e.vx, ny=e.y+e.vy;
if(isWalkable(nx,ny)){ e.x=nx; e.y=ny; } else { e.moveTimer=0; }
}
});
}
}
function closeStat(){document.getElementById('statWin').classList.remove('open');}
function closeFamily(){document.getElementById('familyWin').classList.remove('open');}
function playAnim(a){if(selectedEnt) window.game.scene.scenes[0].playAnimOn(selectedEnt,a);}
let game=new Phaser.Game({type:Phaser.AUTO,parent:'game',width:innerWidth,height:innerHeight,backgroundColor:'#0a2e5c',scene:WorldV92,scale:{mode:Phaser.Scale.RESIZE},render:{antialias:true,roundPixels:false,powerPreference:'high-performance'}});
window.game=game;
</script></body></html>
