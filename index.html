<!DOCTYPE html><html><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>V81 - Names + Save + Quests</title>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
<style>
html,body{margin:0;padding:0;background:#12351f;overflow:hidden;height:100%;touch-action:none;font-family:Arial}
#game{position:fixed;inset:0}
#top{position:fixed;top:0;left:0;right:0;background:#000;color:#fff;padding:8px 10px;font-size:11px;font-weight:900;z-index:40;display:flex;justify-content:space-between}
#toggle{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);background:#4ade80;color:#000;border:none;border-radius:22px;padding:14px 28px;font-weight:900;font-size:14px;z-index:80}
#shopWrap{position:fixed;bottom:0;left:0;right:0;height:155px;background:#111;border-top:3px solid #333;z-index:60;transition:transform.3s}
#shopWrap.closed{transform:translateY(100%)}
#shop{height:100%;display:flex;gap:8px;padding:10px;overflow-x:auto}
.card{width:82px;min-width:82px;height:132px;background:#222;border:2px solid #444;border-radius:10px;display:flex;flex-direction:column;align-items:center;padding:6px;flex-shrink:0}
.card img{width:48px;height:48px;object-fit:contain;background:#1a1a1a;border-radius:8px}
.card b{font-size:7px;color:#fff;margin:4px 0;text-align:center}
.card button{background:#4ade80;color:#000;border:none;border-radius:6px;padding:5px;font-size:8px;font-weight:900;width:100%}
#ownedTab{position:fixed;top:42px;left:0;bottom:165px;width:62px;background:rgba(0,0,0,.92);border-right:2px solid #333;z-index:55;display:flex;flex-direction:column;align-items:center;padding:6px 0}
#ownedTab.minimized{transform:translateX(-52px)}
#ownedList{flex:1;width:100%;overflow-y:auto;display:flex;flex-direction:column;gap:6px;padding:0 5px;align-items:center}
.ownedItem{width:46px;height:46px;background:#222;border:2px solid #555;border-radius:10px;display:flex;align-items:center;justify-content:center;position:relative;cursor:pointer}
.ownedItem img{width:34px;height:34px;object-fit:contain}
#minBtn{position:absolute;top:50%;right:-16px;width:16px;height:50px;background:#4ade80;border:none;border-radius:0 10px 10px 0;font-weight:900}
#statWin{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) scale(0);background:#1e1e1e;border:3px solid #4ade80;border-radius:16px;padding:12px;width:310px;z-index:90;transition:transform.2s;max-height:85vh;overflow-y:auto}
#statWin.open{transform:translate(-50%,-50%) scale(1)}
#familyWin{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) scale(0);background:#1e1e1e;border:3px solid #f472b6;border-radius:16px;padding:12px;width:320px;z-index:95;transition:transform.2s;max-height:85vh;overflow-y:auto}
#familyWin.open{transform:translate(-50%,-50%) scale(1)}
#questWin{position:fixed;top:42px;right:0;width:180px;background:rgba(0,0,0,.92);border-left:2px solid #fbbf24;border-bottom:2px solid #fbbf24;border-radius:0 0 0 12px;z-index:55;padding:8px;max-height:40vh;overflow-y:auto}
#questWin.minQ{transform:translateX(150px)}
.animGrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:5px;margin:8px 0}
.animGrid button{padding:7px 2px;border:none;border-radius:8px;font-size:9px;font-weight:900;color:#000}
.statRow{display:flex;justify-content:space-between;background:#2a2a2a;margin:3px 0;padding:5px 8px;border-radius:6px;font-size:10px;color:#ddd}
.statRow b{color:#4ade80}
.qRow{background:#2a2a2a;margin:4px 0;padding:6px;border-radius:6px;font-size:9px;color:#fff;border-left:3px solid #fbbf24}
.qRow.done{border-left-color:#4ade80;opacity:0.6}
.qRow b{color:#fbbf24}
#msg{position:fixed;top:50px;left:50%;transform:translateX(-50%) scale(0);background:linear-gradient(90deg,#f472b6,#a78bfa);color:#fff;padding:9px 18px;border-radius:20px;font-weight:900;font-size:11px;z-index:70;transition:transform.3s;pointer-events:none;max-width:90vw;text-align:center}
#msg.show{transform:translateX(-50%) scale(1)}
.editBtn{background:#fbbf24;color:#000;border:none;border-radius:4px;padding:2px 6px;font-size:9px;font-weight:900;margin-left:6px}
</style>
</head><body>
<div id="game"></div>
<div id="top"><span>🏝️ V81</span><span>🪙 <span id="coins">500</span> | <span id="cnt">0</span> | ❤️ <span id="fCount">0</span></span></div>
<div id="ownedTab"><b>OWNED</b><div id="ownedList"></div><button id="minBtn" onclick="toggleTab()">◀</button></div>
<div id="questWin"><div style="display:flex;justify-content:space-between;align-items:center"><b style="font-size:10px;color:#fbbf24">📜 QUESTS</b><button onclick="toggleQuest()" style="background:#fbbf24;border:none;border-radius:6px;padding:2px 6px;font-weight:900;font-size:10px">◀</button></div><div id="questList"></div><div style="display:flex;gap:4px;margin-top:6px"><button onclick="saveGame()" style="flex:1;background:#4ade80;border:none;border-radius:6px;padding:5px;font-size:8px;font-weight:900">💾 SAVE</button><button onclick="clearSave()" style="flex:1;background:#fb7185;border:none;border-radius:6px;padding:5px;font-size:8px;font-weight:900">🗑️ RESET</button></div></div>
<div id="msg"></div>
<div id="familyWin"><div id="familyContent"></div><button onclick="closeFamily()" style="width:100%;margin-top:8px;padding:8px;background:#333;color:#fff;border:none;border-radius:8px;font-weight:900">CLOSE</button></div>
<div id="statWin">
<div style="display:flex;gap:10px;align-items:center"><img id="sImg" style="width:52px;height:52px;background:#111;border-radius:10px;object-fit:contain"><div><h3 id="sName" style="margin:0;color:#fff;font-size:13px">Name <button class="editBtn" onclick="editName()">✏️</button></h3><div id="sType" style="color:#aaa;font-size:9px"></div><div id="sAnim" style="color:#4ade80;font-size:10px;font-weight:900"></div></div></div>
<div class="animGrid">
<button style="background:#60a5fa" onclick="playAnim('walk')">WALK</button><button style="background:#fb7185" onclick="playAnim('run')">RUN</button><button style="background:#a7f3d0" onclick="playAnim('idle')">IDLE</button><button style="background:#fde68a" onclick="playAnim('jump')">JUMP</button><button style="background:#fbbf24" onclick="playAnim('eat')">EAT</button><button style="background:#c4b5fd" onclick="playAnim('sleep')">SLEEP</button><button style="background:#f472b6" onclick="playAnim('dance')">DANCE</button><button style="background:#6ee7b7" onclick="playAnim('sit')">SIT</button><button style="background:#93c5fd" onclick="playAnim('wave')">WAVE</button><button style="background:#facc15" onclick="playAnim('cheer')">CHEER</button><button style="background:#a5b4fc" onclick="playAnim('spin')">SPIN</button><button style="background:#fdba74" onclick="playAnim('bounce')">BOUNCE</button>
</div><div id="sStats"></div><button id="familyBtn" style="width:100%;margin-top:8px;padding:10px;background:linear-gradient(90deg,#f472b6,#a78bfa);color:#fff;border:none;border-radius:8px;font-weight:900;display:none">👨‍👩‍👧 FAMILY TREE</button><button onclick="closeStat()" style="width:100%;margin-top:8px;padding:8px;background:#333;color:#fff;border:none;border-radius:8px;font-weight:900">CLOSE</button>
</div><div id="shopWrap" class="closed"><div id="shop"></div></div><button id="toggle">🛒 SHOP</button>
<script>
const ANIMALS=['beaver','bee','bunny','cat','caterpillar','chick','cow','crab','deer','dog','elephant','fox','giraffe','hog','koala','lion','monkey','panda','parrot','penguin','pig','polar','tiger'];
const HUMANS=['female-a','female-b','female-c','female-d','female-e','female-f','male-a','male-b','male-c','male-d','male-e','male-f'];
const NAMES=['Luna','Milo','Kiko','Bilog','Kulit','Ganda','Bebe','Momo','Juan','Maria'];
const DIALOGUES={walk:["Lakad muna!","Going somewhere"],run:["Bilisan!","Takbo!"],idle:["Chill lang","Hay..."],jump:["Wheee!","Lundag!"],eat:["Yum! Sarap!","Kain!"],sleep:["Zzz... tulog","Pagod ako"],dance:["Party! Saya!","Groove!"],sit:["Pahinga","Upo muna"],wave:["Hi! Hello!","Hey!"],cheer:["Yay! Yehey!","Galing!"],spin:["Woo! Ikot!","Dizzy haha"],bounce:["Boing! Talbog!","Fun!"]};
const EMOJIS={walk:"🚶",run:"🏃",idle:"💭",jump:"🤾",eat:"😋",sleep:"💤",dance:"🪩",sit:"😌",wave:"👋",cheer:"🎉",spin:"🌀",bounce:"⚽"};
let coins=500, selected=null, isShopOpen=false, selectedEnt=null, totalFriends=0, isTabMin=false, isQuestMin=false;
let quests=[
 {id:'spawn3',txt:'Mag spawn ng 3',target:3,prog:0,done:false,reward:30,icon:'🌱'},
 {id:'friends3',txt:'3 friends',target:3,prog:0,done:false,reward:50,icon:'🤝'},
 {id:'pet1',txt:'Magka pet',target:1,prog:0,done:false,reward:40,icon:'🐾'},
 {id:'lvl2',txt:'Mag LVL2',target:1,prog:0,done:false,reward:60,icon:'⬆️'},
 {id:'lover',txt:'Magka lover',target:1,prog:0,done:false,reward:100,icon:'💕'},
 {id:'baby',txt:'Magka baby',target:1,prog:0,done:false,reward:150,icon:'👶'}
];
function toggleTab(){ isTabMin=!isTabMin; document.getElementById('ownedTab').classList.toggle('minimized',isTabMin); document.getElementById('minBtn').innerHTML=isTabMin?'▶':'◀'; }
function toggleQuest(){ isQuestMin=!isQuestMin; document.getElementById('questWin').classList.toggle('minQ',isQuestMin); }
function getGender(id){ return id.includes('female')?'female':id.includes('male')?'male':'animal'; }
function isHumanId(id){ return id.includes('female')||id.includes('male'); }
function saveGame(){
 if(!window.game) return;
 let scene=window.game.scene.scenes[0];
 let data={coins:coins,totalFriends:totalFriends,ents:scene.ents.map(e=>({x:e.x,y:e.y,id:e.stats.id,stats:e.stats})),quests:quests};
 localStorage.setItem('triV81',JSON.stringify(data));
 scene.showMsg('💾 Saved!');
}
function clearSave(){ if(confirm('Reset lahat? Mawawala lahat ng pets!')){ localStorage.removeItem('triV81'); location.reload(); } }
function loadGameData(){ try{ let d=localStorage.getItem('triV81'); if(d) return JSON.parse(d); }catch(e){} return null; }
function editName(){
 if(!selectedEnt) return;
 let newName=prompt('Bagong name kay '+selectedEnt.stats.name+':',selectedEnt.stats.name);
 if(newName&&newName.trim()!=''){ selectedEnt.stats.name=newName.trim().substring(0,18); document.getElementById('sName').childNodes[0].textContent=selectedEnt.stats.name+' '; if(window.game) window.game.scene.scenes[0].showMsg('✏️ Renamed to '+selectedEnt.stats.name); saveGame(); }
}
function updateQuest(id,add=1){
 let q=quests.find(x=>x.id==id); if(!q||q.done) return;
 q.prog+=add; if(q.prog>=q.target){ q.done=true; coins+=q.reward; document.getElementById('coins').innerText=coins; if(window.game) window.game.scene.scenes[0].showMsg('🎉 Quest done: '+q.txt+' +'+q.reward+' coins!'); }
 renderQuests();
}
function renderQuests(){
 let list=document.getElementById('questList'); list.innerHTML='';
 quests.forEach(q=>{
  let div=document.createElement('div'); div.className='qRow'+(q.done?' done':'');
  div.innerHTML=`<div style="display:flex;justify-content:space-between"><span>${q.icon} ${q.txt}</span><b>${q.done?'✅':q.prog+'/'+q.target}</b></div><div style="font-size:7px;color:#aaa">+${q.reward} coins</div>`;
  list.appendChild(div);
 });
}
 class WorldV81 extends Phaser.Scene{
 constructor(){super('WorldV81'); this.ents=[]}
 preload(){
  this.load.on('loaderror', (file)=>{ console.log('FAIL LOAD:', file.key); });
  this.load.image('map','new/map-triangle-4k.png');
  ANIMALS.forEach(n=>{ this.load.image('a-'+n,'new/animal-'+n+'.png'); });
  HUMANS.forEach(n=>{ this.load.image('h-'+n,'new/character-'+n+'.png'); });
 }
 create(){
  const W=3500,H=3500;
  this.add.rectangle(W/2,H/2,W,H,0x12351f).setDepth(0);
  if(this.textures.exists('map')){ try{ this.island=this.add.image(W/2,H/2,'map').setDepth(1); this.island.setDisplaySize(2100,2100);}catch(e){ this.createFallback(W,H);} }else{ this.createFallback(W,H); }
  this.bounds={x:W/2-1000,y:H/2-700,w:2000,h:1400};
  this.cameras.main.setBounds(0,0,W,H); this.cameras.main.centerOn(W/2,H/2); this.cameras.main.setZoom(0.40);
  this.isDragging=false;
  this.input.on('pointerdown',p=>{ if(isShopOpen&&p.y<innerHeight-155&&selected){ let wp=this.cameras.main.getWorldPoint(p.x,p.y); this.spawn(wp.x,wp.y,selected,false); selected=null; updateQuest('spawn3',1); return; } if(p.x<62&&p.y>42&&p.y<innerHeight-165) return; if(p.x>innerWidth-180&&p.y>42&&p.y<300) return; if(document.getElementById('statWin').classList.contains('open')||document.getElementById('familyWin').classList.contains('open')) return; if(!isShopOpen){ this.isDragging=true; this.dragStart={x:p.x,y:p.y,sx:this.cameras.main.scrollX,sy:this.cameras.main.scrollY}; } });
  this.input.on('pointermove',p=>{ if(this.isDragging&&this.dragStart&&!isShopOpen){ this.cameras.main.scrollX=this.dragStart.sx-(p.x-this.dragStart.x)/0.40; this.cameras.main.scrollY=this.dragStart.sy-(p.y-this.dragStart.y)/0.40; } });
  this.input.on('pointerup',()=>this.isDragging=false);
  this.buildShop();
  document.getElementById('toggle').onclick=()=>{ isShopOpen=!isShopOpen; document.getElementById('shopWrap').className=isShopOpen?'':'closed'; document.getElementById('toggle').innerHTML=isShopOpen?'❌ CLOSE':'🛒 SHOP'; };
  document.getElementById('familyBtn').onclick=()=>{ this.showFamilyTree(); };
  renderQuests();
  let saved=loadGameData();
  if(saved){
   coins=saved.coins||500; totalFriends=saved.totalFriends||0;
   document.getElementById('coins').innerText=coins; document.getElementById('fCount').innerText=totalFriends;
   if(saved.quests) quests=saved.quests;
   renderQuests();
   if(saved.ents){ saved.ents.forEach(ed=>{ this.spawn(ed.x,ed.y,ed.id,false,true,ed.stats); }); this.showMsg('💾 Loaded! '+saved.ents.length+' pets'); }
  }else{ this.showMsg('V81 - Editable names + Save + Quests!'); }
  this.time.addEvent({delay:10000,callback:()=>saveGame(),loop:true});
 }
 createFallback(W,H){ let g=this.add.graphics().setDepth(1); g.fillStyle(0x2d6a4f,1); g.fillTriangle(W/2,H/2-900,W/2-1000,H/2+700,W/2+1000,H/2+700); g.lineStyle(8,0xffffff,0.3); g.strokeTriangle(W/2,H/2-900,W/2-1000,H/2+700,W/2+1000,H/2+700); this.add.text(W/2,H/2-800,'TRIANGLE ISLAND',{fontSize:'42px',color:'#fff',fontStyle:'bold'}).setOrigin(0.5).setDepth(2); }
 buildShop(){
  const shop=document.getElementById('shop'); shop.innerHTML='';
  [...HUMANS.map(n=>({id:'h-'+n,name:n,price:20,t:'human'})),...ANIMALS.map(n=>({id:'a-'+n,name:n,price:10,t:'animal'}))].forEach(it=>{
   let key=it.id; let c=document.createElement('div'); c.className='card';
   c.innerHTML=`<img src="new/${it.t=='human'?'character':'animal'}-${it.name}.png"><b>${it.name.toUpperCase()}</b><button>🪙${it.price}</button>`;
   c.querySelector('button').onclick=()=>{ if(coins<it.price) return; if(!this.textures.exists(key)) return; coins-=it.price; document.getElementById('coins').innerText=coins; selected=key; document.querySelectorAll('.card').forEach(x=>x.style.borderColor='#444'); c.style.borderColor='#4ade80'; };
   shop.appendChild(c);
  });
 }
 spawn(x,y,id,isBaby=false,isLoad=false,loadStats=null){
  if(!this.textures.exists(id)) return;
  let human=isHumanId(id);
  let spr=this.add.image(x,y,id).setDepth(10).setInteractive();
  if(human){ spr.setDisplaySize(95,125); } else { spr.setDisplaySize(90,90); }
  spr.baseW=spr.displayWidth; spr.baseH=spr.displayHeight;
  if(isLoad&&loadStats){ spr.stats=loadStats; }else{
   spr.stats={name:(isBaby?'Baby ':'')+NAMES[Math.floor(Math.random()*NAMES.length)]+' #'+Math.floor(Math.random()*99),type:id.replace('a-','').replace('h-','').toUpperCase(),gender:getGender(id),isHuman:human,lvl:1,happiness:60+Math.floor(Math.random()*15),friends:0,friendsList:[],lover:null,loverName:null,familyTime:0,togetherTime:0,children:[],isBaby:isBaby,owner:null,ownerRef:null,pet:null,petName:null,id:id};
  }
  spr.animState='idle'; spr.baseSpeed=human?0.9:1.1; spr.moveTimer=3000+Math.random()*2000; spr.lastMeet=0; spr.vx=0; spr.vy=0; spr.lastChat=0;
  this.ents.push(spr); document.getElementById('cnt').innerText=this.ents.length; this.addOwned(spr); this.playAnimOn(spr,'idle');
  spr.on('pointerdown',()=>this.showStats(spr));
  if(!isLoad) saveGame();
 }
 addOwned(spr){ const list=document.getElementById('ownedList'); let div=document.createElement('div'); div.className='ownedItem'; div.innerHTML=`<img src="new/${spr.stats.isHuman?'character':'animal'}-${spr.stats.type.toLowerCase()}.png"><span style="position:absolute;bottom:-4px;right:-4px;background:#4ade80;color:#000;font-size:6px;font-weight:900;padding:1px 3px;border-radius:5px">LV${spr.stats.lvl}</span>`; div.onclick=()=>{ selectedEnt=spr; this.focusOn(spr); this.showStats(spr); }; spr._tab=div; list.appendChild(div); }
 focusOn(spr){ this.cameras.main.pan(spr.x,spr.y,400,'Power2'); }
 showStats(spr){
  selectedEnt=spr;
  document.getElementById('sImg').src='new/'+(spr.stats.isHuman?'character':'animal')+'-'+spr.stats.type.toLowerCase()+'.png';
  document.getElementById('sName').innerHTML=`${spr.stats.name} <button class="editBtn" onclick="editName()">✏️</button>`;
  document.getElementById('sType').innerText=spr.stats.type+' • '+spr.stats.gender.toUpperCase()+(spr.stats.isBaby?' • BABY':'');
  document.getElementById('sAnim').innerText='LVL'+spr.stats.lvl+' | '+spr.animState.toUpperCase();
  let loverTxt=spr.stats.lover?'💕 '+spr.stats.loverName:'Single';
  let petTxt=spr.stats.pet? '🐾 '+spr.stats.petName : 'Wala pa (1 lang pwede)';
  let ownerTxt=spr.stats.owner?'🐾 '+spr.stats.owner:'Wild';
  let reqTxt='';
  if(spr.stats.lvl==1) reqTxt='Need: 3 friends & 80% → LVL2';
  else if(spr.stats.lvl==2) reqTxt='Need: 6 friends & 85% → LVL3';
  else if(spr.stats.lvl==3) reqTxt='Need: 10 friends & 90% → LVL4';
  else if(spr.stats.lvl==4) reqTxt='Need: 15 friends & 95% → LVL5';
  else reqTxt='MAX LEVEL';
  document.getElementById('sStats').innerHTML=`<div class="statRow"><span>LEVEL</span><b>${spr.stats.lvl}</b></div><div class="statRow"><span>HAPPY</span><b>${spr.stats.happiness}%</b></div><div class="statRow"><span>FRIENDS</span><b>${spr.stats.friends}/15</b></div>${spr.stats.isHuman?`<div class="statRow"><span>LOVER</span><b style="font-size:9px">${loverTxt}</b></div><div class="statRow"><span>PET</span><b style="font-size:8px">${petTxt}</b></div><div class="statRow"><span>KIDS</span><b>${spr.stats.children.length}</b></div>`: `<div class="statRow"><span>OWNER</span><b style="font-size:8px">${ownerTxt}</b></div>`}<div style="margin-top:6px;background:#1a1a1a;padding:6px;border-radius:6px;font-size:8px;color:#aaa">${reqTxt}</div>`;
  document.getElementById('familyBtn').style.display=(spr.stats.isHuman&&(spr.stats.lover||spr.stats.children.length>0))?'block':'none';
  document.getElementById('statWin').classList.add('open');
 }
 showFamilyTree(){
  if(!selectedEnt||!selectedEnt.stats.isHuman) return;
  let s=selectedEnt.stats;
  let html=`<div style="text-align:center"><h3 style="color:#fff;margin:0">👨‍👩‍👧 FAMILY TREE</h3><div style="color:#aaa;font-size:10px">${s.name}</div></div><div style="margin-top:10px">`;
  if(s.lover){ html+=`<div class="statRow"><span>💕 PARTNER</span><b>${s.loverName}</b></div>`; }else{ html+=`<div class="statRow"><span>💔 PARTNER</span><b>Single pa</b></div>`; }
  if(s.children.length>0){ html+=`<div style="margin-top:8px;color:#4ade80;font-weight:900;font-size:11px">👶 CHILDREN (${s.children.length}):</div>`; s.children.forEach((ch,i)=>{ html+=`<div class="statRow"><span>#${i+1}</span><b>${ch}</b></div>`; }); }
  if(s.pet){ html+=`<div style="margin-top:8px"><div style="color:#fbbf24;font-weight:900;font-size:11px">🐾 PET:</div><div class="statRow"><span>PET</span><b>${s.petName}</b></div></div>`; }
  html+=`</div>`;
  document.getElementById('familyContent').innerHTML=html;
  document.getElementById('familyWin').classList.add('open');
 }
   checkLevelUp(spr){
  if(spr.stats.lvl>=5) return;
  let f=spr.stats.friends,h=spr.stats.happiness,can=false;
  if(spr.stats.lvl==1&&f>=3&&h>=80) can=true;
  if(spr.stats.lvl==2&&f>=6&&h>=85) can=true;
  if(spr.stats.lvl==3&&f>=10&&h>=90) can=true;
  if(spr.stats.lvl==4&&f>=15&&h>=95) can=true;
  if(can){ spr.stats.lvl++; spr.stats.happiness=Math.min(100,spr.stats.happiness+5); this.showMsg('⬆️ '+spr.stats.name+' LVL '+spr.stats.lvl+'!'); if(spr.stats.lvl==2) updateQuest('lvl2',1); if(selectedEnt==spr) this.showStats(spr); saveGame(); }
 }
 makeFriends(a,b){
  if(a==b||Date.now()-a.lastMeet<4000) return;
  if(!a.stats.isHuman && b.stats.isHuman){ if(b.stats.pet){ return; } if(!a.stats.owner){ a.stats.owner=b.stats.name; a.stats.ownerRef=b; b.stats.pet=a; b.stats.petName=a.stats.name; updateQuest('pet1',1); } }
  if(!b.stats.isHuman && a.stats.isHuman){ if(a.stats.pet){ return; } if(!b.stats.owner){ b.stats.owner=a.stats.name; b.stats.ownerRef=a; a.stats.pet=b; a.stats.petName=b.stats.name; b.stats.owner=a.stats.name; updateQuest('pet1',1); } }
  if(a.stats.isHuman&&b.stats.isHuman){
   if(a.stats.friendsList.includes(b.stats.name)){ if(a.stats.lover==b){ let dist=Phaser.Math.Distance.Between(a.x,a.y,b.x,b.y); if(dist<110){ a.stats.familyTime+=200; b.stats.familyTime+=200; a.stats.togetherTime+=200; b.stats.togetherTime+=200; if(a.stats.familyTime>60000){ this.makeBaby(a,b); a.stats.familyTime=0; b.stats.familyTime=0; } } } return; }
   a.stats.friendsList.push(b.stats.name); b.stats.friendsList.push(a.stats.name);
   a.stats.friends++; b.stats.friends++; totalFriends++; document.getElementById('fCount').innerText=totalFriends;
   updateQuest('friends3',1);
   a.lastMeet=Date.now(); b.lastMeet=Date.now();
   this.showHeart(a); this.checkLevelUp(a); this.checkLovers(a,b); saveGame();
  }else{ if(!a.stats.friendsList.includes(b.stats.name)){ a.stats.friendsList.push(b.stats.name); b.stats.friendsList.push(a.stats.name); a.stats.friends++; b.stats.friends++; } }
 }
 checkLovers(a,b){
  if(!a.stats.isHuman||!b.stats.isHuman||a.stats.lover||b.stats.lover||a.stats.gender==b.stats.gender) return;
  if(a.stats.lvl<3||b.stats.lvl<3) return; if(a.stats.friends<5||b.stats.friends<5) return; if(a.stats.happiness<90||b.stats.happiness<90) return;
  if(Phaser.Math.Distance.Between(a.x,a.y,b.x,b.y)>85) return;
  if(Math.random()<0.015){ a.stats.lover=b; a.stats.loverName=b.stats.name; b.stats.lover=a; b.stats.loverName=a.stats.name; a.stats.togetherTime=0; b.stats.togetherTime=0; this.showMsg('💕 LOVERS! '+a.stats.name+' + '+b.stats.name); updateQuest('lover',1); this.playAnimOn(a,'cheer'); this.playAnimOn(b,'cheer'); saveGame(); }
 }
 makeBaby(a,b){
  let babyId=Math.random()<0.5?a.stats.id:b.stats.id;
  let babyName=NAMES[Math.floor(Math.random()*NAMES.length)];
  this.spawn((a.x+b.x)/2,(a.y+b.y)/2+30,babyId,true);
  let last=this.ents[this.ents.length-1]; if(last){ last.stats.name='Baby '+babyName+' #'+Math.floor(Math.random()*99); }
  a.stats.children.push('Baby '+babyName); b.stats.children.push('Baby '+babyName);
  this.showMsg('👶 Baby! '+a.stats.name+' & '+b.stats.name); updateQuest('baby',1); saveGame();
 }
 showHeart(spr){ let h=this.add.text(spr.x,spr.y-60,spr.stats.lover?'💕':'❤️',{fontSize:'20px'}).setDepth(50).setOrigin(0.5); this.tweens.add({targets:h,y:h.y-45,alpha:0,duration:1200,onComplete:()=>h.destroy()}); }
 showMsg(t){ let el=document.getElementById('msg'); el.innerText=t; el.classList.add('show'); setTimeout(()=>el.classList.remove('show'),3000); }
 showBubble(spr,anim){
  if(Math.random()>0.40 && anim!='sleep' && anim!='dance') return;
  if(Date.now()-spr.lastChat<6000) return;
  spr.lastChat=Date.now();
  if(spr._bubble) spr._bubble.destroy(); if(spr._bubbleBg) spr._bubbleBg.destroy();
  let emoji=EMOJIS[anim]||"💬"; let txt=""; if(anim=='sleep'||anim=='dance'||Math.random()<0.45){ let list=DIALOGUES[anim]||["..."]; txt=list[Math.floor(Math.random()*list.length)]; }
  let fullText=txt? `${emoji} ${txt}` : `${emoji}`;
  let bubble=this.add.text(spr.x,spr.y-110,fullText,{fontSize:'26px',color:'#000000',fontFamily:'Arial Black, Arial',stroke:'#ffffff',strokeThickness:6}).setOrigin(0.5).setDepth(61);
  let bg=this.add.rectangle(spr.x,spr.y-110,bubble.width+20,bubble.height+12,0xffffff,1).setDepth(60).setStrokeStyle(3,0x000000);
  spr._bubble=bubble; spr._bubbleBg=bg;
  this.tweens.add({targets:[bubble,bg],y:bubble.y-25,alpha:0,duration:3000,delay:1300,onComplete:()=>{ bubble.destroy(); bg.destroy(); }});
 }
 playAnimOn(spr,anim){
  if(!spr.active) return; if(spr.currentTween) spr.currentTween.stop(); this.tweens.killTweensOf(spr);
  spr.setAngle(0); spr.setAlpha(1); spr.setDisplaySize(spr.baseW,spr.baseH);
  spr.animState=anim; if(selectedEnt==spr) document.getElementById('sAnim').innerText='LVL'+spr.stats.lvl+' | '+anim.toUpperCase();
  this.showBubble(spr,anim);
  if(anim=='idle'){ spr.currentTween=this.tweens.add({targets:spr,y:spr.y-2,duration:900,yoyo:true,repeat:-1}); }
  else if(anim=='walk'){ spr.currentTween=this.tweens.add({targets:spr,y:spr.y-2,duration:350,yoyo:true,repeat:-1}); }
  else if(anim=='run'){ spr.currentTween=this.tweens.add({targets:spr,y:spr.y-3,duration:200,yoyo:true,repeat:-1}); }
  else if(anim=='jump'){ spr.currentTween=this.tweens.add({targets:spr,y:spr.y-35,duration:250,yoyo:true,onComplete:()=>{ if(spr.active) this.playAnimOn(spr,'idle'); }}); }
  else if(anim=='eat'){ spr.currentTween=this.tweens.add({targets:spr,angle:4,duration:220,yoyo:true,repeat:2,onComplete:()=>{ if(spr.active){ spr.setAngle(0); this.playAnimOn(spr,'idle'); }}}); }
  else if(anim=='sleep'){ spr.vx=0; spr.vy=0; spr.currentTween=this.tweens.add({targets:spr,y:spr.y+10,alpha:0.7,duration:600}); }
  else if(anim=='dance'){ spr.currentTween=this.tweens.add({targets:spr,angle:5,duration:220,yoyo:true,repeat:5,onComplete:()=>{ if(spr.active){ spr.setAngle(0); this.playAnimOn(spr,'idle'); }}}); }
  else if(anim=='sit'){ spr.currentTween=this.tweens.add({targets:spr,y:spr.y+10,duration:350,onComplete:()=>{ if(spr.active) this.time.delayedCall(2500,()=>{ if(spr.active) this.playAnimOn(spr,'idle'); }); }}); }
  else if(anim=='wave'){ spr.currentTween=this.tweens.add({targets:spr,angle:8,duration:130,yoyo:true,repeat:3,onComplete:()=>{ if(spr.active){ spr.setAngle(0); this.playAnimOn(spr,'idle'); }}}); }
  else if(anim=='cheer'){ spr.currentTween=this.tweens.add({targets:spr,y:spr.y-14,duration:160,yoyo:true,repeat:3,onComplete:()=>{ if(spr.active) this.playAnimOn(spr,'idle'); }}); }
  else if(anim=='spin'){ spr.currentTween=this.tweens.add({targets:spr,angle:360,duration:700,onComplete:()=>{ if(spr.active){ spr.setAngle(0); this.playAnimOn(spr,'idle'); }}}); }
  else if(anim=='bounce'){ spr.currentTween=this.tweens.add({targets:spr,y:spr.y-22,duration:200,yoyo:true,repeat:1,onComplete:()=>{ if(spr.active) this.playAnimOn(spr,'idle'); }}); }
 }
 update(t,d){
  if(isShopOpen) return;
  for(let i=0;i<this.ents.length;i++) for(let j=i+1;j<this.ents.length;j++){ let a=this.ents[i],b=this.ents[j]; if(Phaser.Math.Distance.Between(a.x,a.y,b.x,b.y)<75) this.makeFriends(a,b); }
  this.ents.forEach(e=>{
   if(e._bubble && e._bubble.active){ e._bubble.x=e.x; e._bubbleBg.x=e.x; }
   if(e.stats.ownerRef && e.stats.ownerRef.active){ let dist=Phaser.Math.Distance.Between(e.x,e.y,e.stats.ownerRef.x,e.stats.ownerRef.y); if(dist>130){ let ang=Math.atan2(e.stats.ownerRef.y-e.y,e.stats.ownerRef.x-e.x); e.vx=Math.cos(ang)*e.baseSpeed*1.4; e.vy=Math.sin(ang)*e.baseSpeed*1.4; e.setFlipX(e.vx<0); if(e.animState!='run') this.playAnimOn(e,'run'); e.x+=e.vx; e.y+=e.vy; return; } }
   if(e.animState=='sleep'){ e.vx=0; e.vy=0; e.moveTimer-=d; if(e.moveTimer<=0) this.playAnimOn(e,'idle'); return; }
   e.moveTimer-=d;
   if(e.moveTimer<=0){
    let r=Math.random();
    if(r<0.35){ this.playAnimOn(e,'walk'); e.moveTimer=3500+Math.random()*2500; }
    else if(r<0.45){ this.playAnimOn(e,'run'); e.moveTimer=3000+Math.random()*2000; }
    else if(r<0.65){ this.playAnimOn(e,'idle'); e.moveTimer=4000+Math.random()*3000; e.vx=0; e.vy=0; }
    else if(r<0.72){ this.playAnimOn(e,'dance'); e.moveTimer=3500; e.vx=0; e.vy=0; }
    else if(r<0.79){ this.playAnimOn(e,'eat'); e.moveTimer=3500; e.vx=0; e.vy=0; }
    else if(r<0.84){ this.playAnimOn(e,'wave'); e.moveTimer=2500; e.vx=0; e.vy=0; }
    else if(r<0.89){ this.playAnimOn(e,'sit'); e.moveTimer=5000; e.vx=0; e.vy=0; }
    else if(r<0.94){ this.playAnimOn(e,'bounce'); e.moveTimer=2000; e.vx=0; e.vy=0; }
    else if(r<0.97){ this.playAnimOn(e,'jump'); e.moveTimer=2000; e.vx=0; e.vy=0; }
    else { this.playAnimOn(e,'sleep'); e.moveTimer=6000; e.vx=0; e.vy=0; }
    if(e.animState=='walk'||e.animState=='run'){ e.targetX=this.bounds.x+Math.random()*this.bounds.w; e.targetY=this.bounds.y+Math.random()*this.bounds.h; let ang=Math.atan2(e.targetY-e.y,e.targetX-e.x); let sp=e.animState=='run'?e.baseSpeed*1.6:e.baseSpeed; e.vx=Math.cos(ang)*sp; e.vy=Math.sin(ang)*sp; e.setFlipX(e.vx<0); } else { e.vx=0; e.vy=0; }
   }
   if(e.animState=='walk'||e.animState=='run'){ e.x+=e.vx; e.y+=e.vy; if(e.x<this.bounds.x||e.x>this.bounds.x+this.bounds.w) e.vx*=-1; if(e.y<this.bounds.y||e.y>this.bounds.y+this.bounds.h) e.vy*=-1; if(e.vx) e.setFlipX(e.vx<0); }
  });
 }
}
function closeStat(){document.getElementById('statWin').classList.remove('open');}
function closeFamily(){document.getElementById('familyWin').classList.remove('open');}
function playAnim(a){ if(selectedEnt) window.game.scene.scenes[0].playAnimOn(selectedEnt,a); }
let game=new Phaser.Game({type:Phaser.AUTO,parent:'game',width:innerWidth,height:innerHeight,backgroundColor:'#12351f',scene:WorldV81,scale:{mode:Phaser.Scale.RESIZE}});
window.game=game;
</script></body></html>
