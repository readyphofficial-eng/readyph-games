<!DOCTYPE html><html><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>READYPH BIG MAP - ALL CLEAN ASSETS</title>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/nipplejs@0.9.0/dist/nipplejs.min.js"></script>
<style>
html,body{margin:0;padding:0;background:#7ab86f;overflow:hidden;height:100%;touch-action:none;font-family:Arial}
#game{position:fixed;inset:0}
#joy{position:fixed;left:12px;bottom:18px;width:120px;height:120px;background:rgba(255,255,255,.35);border-radius:50%;border:2px solid #fff;z-index:50}
#btnA{position:fixed;right:14px;bottom:22px;width:86px;height:86px;background:#22c55e;border-radius:50%;border:3px solid #fff;color:#fff;font-weight:900;font-size:12px;z-index:50}
#hud{position:fixed;top:0;left:0;right:0;background:rgba(0,0,0,0.85);color:#fff;padding:10px 14px;display:flex;justify-content:space-between;z-index:40;font-size:11px;font-weight:800}
#dialog{position:fixed;bottom:0;left:0;right:0;background:#0f172aee;border-top:4px solid #22c55e;padding:14px;color:#fff;display:none;z-index:60;max-height:55vh;overflow:auto}
#loader{position:fixed;inset:0;background:#0f172a;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;z-index:100;font-weight:800}
</style>
</head><body>
<div id="loader"><div style="font-size:28px">🏗️ READYPH CITY BUILDER</div><div id="loadText" style="margin-top:10px;color:#4ade80">Loading 100+ assets from clean/...</div><div id="loadCount" style="margin-top:6px;font-size:12px;opacity:.7"></div></div>
<div id="game"></div>
<div id="hud"><span id="hudTitle">READYPH BIG MAP V39</span><span id="info">Scanning clean/...</span></div>
<div id="joy"></div><button id="btnA">TALK</button>
<div id="dialog"><b id="dN" style="color:#4ade80;font-size:16px"></b><p id="dT" style="white-space:pre-line;line-height:1.5"></p><div id="dBtns"></div></div>
<script>
let joy={x:0,y:0}, game;
let ALL_FILES=[]; // lahat ng nasa clean/
let BUILDING_FILES=[]; // wall-*.png etc
let DECOR_FILES=[];

class BigMap extends Phaser.Scene{
 constructor(){super('BigMap')}
 async preload(){
  // 1. KUNIN LAHAT NG FILES SA clean/ GAMIT GITHUB API!
  try{
   let res=await fetch('https://api.github.com/repos/readyphofficial-eng/readyph-games/contents/assets/clean');
   let files=await res.json();
   ALL_FILES=files.filter(f=>f.name.endsWith('.png')).map(f=>f.name);
   BUILDING_FILES=ALL_FILES.filter(n=> n.startsWith('wall-') || n.startsWith('wall') || n.includes('building') || n.includes('house'));
   DECOR_FILES=ALL_FILES.filter(n=>!BUILDING_FILES.includes(n) &&!n.includes('MAP') &&!n.toLowerCase().includes('player'));
   console.log('Found:',ALL_FILES.length,'buildings:',BUILDING_FILES.length);
   document.getElementById('loadCount').innerText=ALL_FILES.length+' PNGs found | '+BUILDING_FILES.length+' buildings';
  }catch(e){
   // fallback kung di gumana API
   ALL_FILES=['wall-wood.png','wall-wood-door.png','wall-wood-window-glass.png','wall.png','watermill.png','windmill.png'];
   BUILDING_FILES=ALL_FILES;
  }

  let b='assets/clean/';
  // Load lahat!
  ALL_FILES.forEach(name=>{
   this.load.image(name.replace('.png',''), b+name);
  });
  // Load MAP at player kung meron
  if(ALL_FILES.includes('MAP.png')) this.load.image('MAP', b+'MAP.png');
  else this.load.image('MAP', 'assets/kenney/MAP.png');
  if(ALL_FILES.includes('player.png')) this.load.image('player', b+'player.png');
 }

 create(){
  const W=6000,H=6000; // SUPER BIG MAP!
  document.getElementById('loader').style.display='none';

  // Background - green base + MAP
  this.add.rectangle(W/2,H/2,W,H,0x7ab86f).setDepth(0);
  if(this.textures.exists('MAP')){
   this.add.image(W/2,H/2,'MAP').setDisplaySize(W,H).setDepth(1).setAlpha(0.35);
  }

  // Auto clean function
  const cleanKey=(orig)=>{
   try{
    let tex=this.textures.get(orig).getSourceImage();
    let c=document.createElement('canvas'); c.width=tex.width; c.height=tex.height;
    let ctx=c.getContext('2d'); ctx.drawImage(tex,0,0);
    let d=ctx.getImageData(0,0,c.width,c.height);
    for(let i=0;i<d.data.length;i+=4){
     let r=d.data[i],g=d.data[i+1],b=d.data[i+2];
     if((r<15&&g<15&&b<15)||(r>250&&g>250&&b>250&&d.data[i+3]>200)){
      // huwag burahin kung mukhang wall na puti talaga, check lang sobrang pure
      if(r<15) d.data[i+3]=0;
     }
    }
    ctx.putImageData(d,0,0);
    let nk=orig+'_clean';
    if(this.textures.exists(nk)) this.textures.remove(nk);
    this.textures.addCanvas(nk,c);
    return nk;
   }catch(e){return orig;}
  };

  this.builds=[];
  let usedKeys=BUILDING_FILES.map(n=>n.replace('.png',''));

  // Gumawa ng city blocks gamit lahat ng wall- assets!
  // 150+ buildings!
  let spots=[];
  for(let y=400;y<H-400;y+=280){
   for(let x=400;x<W-400;x+=300){
    if(Math.random()>0.2) spots.push([x+Phaser.Math.Between(-60,60), y+Phaser.Math.Between(-60,60)]);
   }
  }
  spots=spots.sort(()=>Math.random()-0.5);

  spots.forEach((s,i)=>{
   if(i>=180) return; // limit 180 buildings para di lag
   let key=usedKeys[i % usedKeys.length];
   if(!this.textures.exists(key)) return;
   let ck=cleanKey(key);
   let img=this.add.image(s[0],s[1],ck).setDepth(5);
   // Tama size - 80-110px
   let scale=Phaser.Math.Between(80,110)/Math.max(img.width,img.height);
   // yung wall pieces maliit, palakihan konti
   if(key.includes('wall-')) scale*=2.2;
   if(key.includes('window')||key.includes('door')) scale*=1.5;
   img.setScale(scale);
   img.setOrigin(0.5,0.8);
   this.builds.push({x:s[0],y:s[1],r:35*scale+28,img});
  });

  // Player - gitna ng map
  try{
   if(this.textures.exists('player')){
    let ck=cleanKey('player');
    this.player=this.add.image(W/2,H/2,ck).setDepth(20).setScale(0.6).setOrigin(0.5,0.85);
   } else throw 'no player';
  }catch(e){
   this.player=this.add.circle(W/2,H/2,16,0x22c55e).setDepth(20).setStrokeStyle(3,0xffffff);
  }

  this.cameras.main.setBounds(0,0,W,H);
  this.cameras.main.startFollow(this.player,true,0.12,0.12);
  this.cameras.main.setZoom(1.15);

  this.keys=this.input.keyboard.addKeys('W,A,S,D');
  document.getElementById('info').innerText='Map:6000x6000 | Buildings:'+this.builds.length+' | Assets:'+ALL_FILES.length;
  document.getElementById('hudTitle').innerText='BIG MAP V39 - '+ALL_FILES.length+' ASSETS LOADED';
 }

 isBlocked(x,y){
  for(let b of this.builds){ if(Phaser.Math.Distance.Between(x,y,b.x,b.y)<b.r) return true; }
  return false;
 }

 update(){
  if(document.getElementById('dialog').style.display==='block') return;
  let sp=6,mx=joy.x,my=joy.y;
  if(this.keys.A.isDown) mx=-1; if(this.keys.D.isDown) mx=1; if(this.keys.W.isDown) my=-1; if(this.keys.S.isDown) my=1;
  if(Math.abs(mx)<0.12) mx=0; if(Math.abs(my)<0.12) my=0;
  if(mx||my){
   let nx=this.player.x+mx*sp, ny=this.player.y+my*sp;
   if(!this.isBlocked(nx,ny)&&nx>50&&nx<5950&&ny>50&&ny<5950){
    this.player.x=nx; this.player.y=ny;
    if(this.player.setFlipX && mx!==0) this.player.setFlipX(mx<0);
   }
  }
 }
}

game=new Phaser.Game({type:Phaser.AUTO,parent:'game',width:innerWidth,height:innerHeight,backgroundColor:'#7ab86f',scene:BigMap,scale:{mode:Phaser.Scale.RESIZE}});

let stick=nipplejs.create({zone:document.getElementById('joy'),mode:'static',position:{left:'60px',top:'60px'},color:'white',size:90});
stick.on('move',(e,d)=>{if(d&&d.vector){joy.x=d.vector.x;joy.y=-d.vector.y;}});
stick.on('end',()=>{joy.x=0;joy.y=0;});

document.getElementById('btnA').onclick=()=>{
 let dlg=document.getElementById('dialog');
 let sc=game.scene.getScene('BigMap');
 document.getElementById('dN').innerText='READYPH BIG MAP V39';
 document.getElementById('dT').innerText=
   '✅ LAHAT NG ASSETS GAMIT! ('+ALL_FILES.length+' files)\n'+
   '🏢 Buildings: '+sc.builds.length+' (mula sa wall-*.png mo)\n'+
   '🗺️ Map: 6000x6000 - pinakamalaki!\n'+
   '📁 Folder: assets/clean/\n\n'+
   'Mga nakita ko sa screenshot mo:\n'+
   '- wall-wood-*.png = ginawang buildings\n'+
   '- watermill, windmill = special buildings\n'+
   '- Lahat auto-place sa vacant lots\n\n'+
   'Kung gusto mo mas maayos yung city (hindi random), sabihin mo lang layout!';
 document.getElementById('dBtns').innerHTML='<button onclick="document.getElementById(\'dialog\').style.display=\'none\'" style="padding:12px 22px;background:#22c55e;color:#fff;border-radius:12px;border:3px solid #fff;font-weight:900">OK</button>';
 dlg.style.display='block';
};
</script></body></html>
