<!DOCTYPE html><html><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>V52 TRIANGLE ISLAND GAME</title>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/nipplejs@0.9.0/dist/nipplejs.min.js"></script>
<style>
html,body{margin:0;padding:0;background:#3d3d3d;overflow:hidden;height:100%;touch-action:none}
#game{position:fixed;inset:0}
#joy{position:fixed;left:12px;bottom:18px;width:110px;height:110px;background:rgba(255,255,255,.25);border-radius:50%;border:2px solid #fff;z-index:50}
#hud{position:fixed;top:0;left:0;right:0;background:rgba(0,0,0,.85);color:#fff;padding:8px 12px;font-size:11px;font-weight:800;z-index:40;display:flex;justify-content:space-between}
#load{position:fixed;inset:0;background:#0f172a;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:99;font-weight:800}
#areas{position:fixed;top:40px;left:10px;background:rgba(0,0,0,.7);color:#fff;padding:6px 8px;font-size:9px;font-weight:800;border-radius:6px;z-index:30}
</style>
</head><body>
<div id="load"><div>🏝️ LOADING TRIANGLE ISLAND</div><div id="l1" style="color:#4ade80;margin-top:8px">Triangle: Medieval | Castle | City | Grassland</div></div>
<div id="game"></div>
<div id="hud"><span>TRIANGLE ISLAND - 3 AREAS + GRASSLAND</span><span id="info">Loading...</span></div>
<div id="areas">
🔺 TOP: Medieval Village<br>
🏰 BOTTOM-LEFT: Large Castle<br>
🏙️ BOTTOM-RIGHT: City<br>
🌿 ALL AROUND: Grassland + Paths
</div>
<div id="joy"></div>
<script>
let joy={x:0,y:0};

class TriangleGame extends Phaser.Scene{
 constructor(){super('TriangleGame')}
 preload(){
  // Load yung triangle map mo - upload mo yung image as map-triangle.png
  this.load.image('island', 'clean/map-triangle.png');
  // Fallback - kung wala pa yung image, gagamit ng placeholder
  this.load.image('ground', 'clean/ground-grass.png');
 }
 create(){
  const W=2200,H=2200;
  this.W=W; this.H=H;

  // Background
  this.add.rectangle(W/2,H/2,W,H,0x3d3d3d).setDepth(0);

  // Try to show island map
  if(this.textures.exists('island')){
   let island=this.add.image(W/2,H/2,'island').setDepth(1);
   island.setDisplaySize(W-100,H-100);
   island.setOrigin(0.5,0.5);
   document.getElementById('l1').innerText='Triangle map loaded! HQ';
  }else{
   // Fallback: simple 3 areas with colors
   this.add.rectangle(1100,500,2000,800,0x6a8a4a).setDepth(1).setAlpha(0.3); // medieval
   this.add.rectangle(600,1650,900,900,0x7a7a8a).setDepth(1).setAlpha(0.3); // castle
   this.add.rectangle(1650,1650,900,900,0x8a8a9a).setDepth(1).setAlpha(0.3); // city
   this.add.text(W/2,100,'UPLOAD map-triangle.png TO clean/', {font:'bold 20px Arial',color:'#ff0000'}).setDepth(10).setOrigin(0.5);
   document.getElementById('l1').innerText='Upload map-triangle.png first!';
  }

  // Player - small red dot sa gitna
  this.player=this.add.rectangle(W/2,H/2,14,14,0xff4444).setDepth(20);
  this.player.setStrokeStyle(2,0xffffff);

  // Camera
  this.cameras.main.setBounds(0,0,W,H);
  this.cameras.main.startFollow(this.player,true,0.1,0.1);
  this.cameras.main.setZoom(1.3);
  this.cameras.main.centerOn(W/2,H/2);

  document.getElementById('load').style.display='none';
  document.getElementById('info').innerText='Triangle Island | Use joystick or WASD | Zoom: mouse wheel';

  this.keys=this.input.keyboard.addKeys('W,A,S,D');
  
  // Mouse wheel zoom
  this.input.on('wheel',(p,dx,dy,dz)=>{
   let cam=this.cameras.main;
   let nz=Phaser.Math.Clamp(cam.zoom - dy*0.001, 0.5, 2.5);
   cam.setZoom(nz);
  });

  // Drag to pan
  this.input.on('pointermove', p=>{
   if(p.isDown&&!this.playerMoving){
    this.cameras.main.scrollX-=(p.x-p.prevPosition.x)/this.cameras.main.zoom;
    this.cameras.main.scrollY-=(p.y-p.prevPosition.y)/this.cameras.main.zoom;
   }
  });
 }

 update(){
  let sp=5, mx=joy.x, my=joy.y;
  if(this.keys.A.isDown) mx=-1;
  if(this.keys.D.isDown) mx=1;
  if(this.keys.W.isDown) my=-1;
  if(this.keys.S.isDown) my=1;
  if(Math.abs(mx)<0.1) mx=0;
  if(Math.abs(my)<0.1) my=0;
  
  if(mx||my){
   this.playerMoving=true;
   this.player.x+=mx*sp;
   this.player.y+=my*sp;
   // Keep inside map
   this.player.x=Phaser.Math.Clamp(this.player.x, 50, this.W-50);
   this.player.y=Phaser.Math.Clamp(this.player.y, 50, this.H-50);
  }else{
   this.playerMoving=false;
  }
 }
}

new Phaser.Game({
 type:Phaser.AUTO,
 parent:'game',
 width:innerWidth,
 height:innerHeight,
 backgroundColor:'#3d3d3d',
 scene:TriangleGame,
 scale:{mode:Phaser.Scale.RESIZE}
});

let s=nipplejs.create({zone:document.getElementById('joy'),mode:'static',position:{left:'60px',top:'60px'},color:'white',size:90});
s.on('move',(e,d)=>{if(d&&d.vector){joy.x=d.vector.x; joy.y=-d.vector.y;}});
s.on('end',()=>{joy.x=0;joy.y=0;});
</script></body></html>
