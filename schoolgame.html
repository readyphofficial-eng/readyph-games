<!DOCTYPE html><html><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>V55 STEADY WORLDBOX SHOP</title>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
<style>
html,body{margin:0;padding:0;background:#2e2e2e;overflow:hidden;height:100%;touch-action:none;font-family:Arial}
#game{position:fixed;top:0;left:0;right:0;bottom:140px;image-rendering:crisp-edges}
#top{position:fixed;top:0;left:0;right:0;background:rgba(0,0,0,.75);color:#fff;padding:6px 12px;font-size:11px;font-weight:800;z-index:40;display:flex;justify-content:space-between}
#shop{position:fixed;bottom:0;left:0;right:0;height:140px;background:#121212;border-top:3px solid #333;display:flex;gap:8px;padding:8px;overflow-x:auto;z-index:50;align-items:flex-start}
.shop-card{width:80px;min-width:80px;height:120px;background:#222;border:2px solid #444;border-radius:10px;display:flex;flex-direction:column;align-items:center;padding:4px;flex-shrink:0}
.shop-card img{width:48px;height:48px;object-fit:contain;background:#1a1a1a;border-radius:6px}
.shop-card b{font-size:8px;color:#fff;margin:3px 0;text-align:center;line-height:9px;height:18px;display:flex;align-items:center}
.shop-card button{background:#4ade80;color:#000;border:none;border-radius:6px;padding:4px 6px;font-size:9px;font-weight:900;cursor:pointer;width:100%}
.shop-card button:disabled{background:#555;color:#777}
#coins{color:#facc15}
#placed{position:fixed;bottom:145px;left:8px;background:rgba(0,0,0,.6);color:#fff;padding:4px 8px;border-radius:12px;font-size:9px;font-weight:800;z-index:45}
</style>
</head><body>
<div id="game"></div>
<div id="top"><span>🏝️ TRIANGLE ISLAND - STEADY ZOOM OUT - WORLDBOX</span><span>🪙 <span id="coins">500</span> | <span id="cnt">0 placed</span></span></div>
<div id="placed">Tap shop to purchase → tap map to place | Drag placed to move</div>
<div id="shop"></div>
<script>
const ANIMALS=[
'beaver','bee','bunny','cat','caterpillar','chick','cow','crab','deer','dog','elephant','fox','giraffe','hog','koala','lion','monkey','panda','parrot','penguin','pig','polar','tiger'
];
const HUMANS=[
'female-a','female-b','female-c','female-d','female-e','female-f','male-a','male-b','male-c','male-d','male-e','male-f'
];

let coins=500;
let selectedToPlace=null;
let entities=[];

class SteadyShop extends Phaser.Scene{
 constructor(){super('SteadyShop')}
 preload(){
  this.load.image('island4k','clean/map-triangle-4k.png');
  this.load.image('island','clean/map-triangle.png');
  ANIMALS.forEach(n=>this.load.image('animal-'+n,'clean/animal-'+n+'.png'));
  HUMANS.forEach(n=>this.load.image('char-'+n,'clean/character-'+n+'.png'));
 }
 create(){
  const W=3000,H=3000; this.W=W; this.H=H;
  this.add.rectangle(W/2,H/2,W,H,0x2e2e2e).setDepth(0);
  
  let key=this.textures.exists('island4k')?'island4k':(this.textures.exists('island')?'island':null);
  if(key){
   let tex=this.textures.get(key).getSourceImage();
   let island=this.add.image(W/2,H/2,key).setDepth(1);
   let ratio=Math.min(2600/tex.width, 2600/tex.height);
   island.setDisplaySize(tex.width*ratio, tex.height*ratio);
  }

  // STEADY - FIXED CAMERA, NO MOVEMENT, NO ZOOM
  this.cameras.main.setBounds(0,0,W,H);
  this.cameras.main.centerOn(W/2,H/2);
  this.cameras.main.setZoom(0.75); // steady zoom out - kita buo
  
  // Walang drag, walang wheel zoom - steady lang!
  
  // Tap map to place purchased
  this.input.on('pointerdown', p=>{
   if(p.y > window.innerHeight-140) return; // nasa shop
   if(selectedToPlace){
    let world=this.cameras.main.getWorldPoint(p.x,p.y);
    this.placeEntity(world.x, world.y, selectedToPlace);
    selectedToPlace=null;
    document.getElementById('placed').innerText='Tap shop to purchase → tap map to place';
   }
  });

  this.buildShop();
 }

 buildShop(){
  const shop=document.getElementById('shop');
  shop.innerHTML='';
  const all=[...HUMANS.map(n=>({id:'char-'+n, file:'clean/character-'+n+'.png', name:n, price:20, type:'human'})), 
             ...ANIMALS.map(n=>({id:'animal-'+n, file:'clean/animal-'+n+'.png', name:n, price:10, type:'animal'}))];
  
  all.forEach(item=>{
   let card=document.createElement('div');
   card.className='shop-card';
   card.innerHTML=`
    <img src="${item.file}" onerror="this.style.background='#333'">
    <b>${item.name.toUpperCase()}</b>
    <button>🪙${item.price} BUY</button>
   `;
   let btn=card.querySelector('button');
   btn.onclick=()=>{
    if(coins < item.price){
     btn.innerText='NO COINS'; setTimeout(()=>btn.innerText='🪙'+item.price+' BUY',800); return;
    }
    coins-=item.price;
    document.getElementById('coins').innerText=coins;
    selectedToPlace=item.id;
    document.getElementById('placed').innerText='✅ Purchased '+item.name+' → TAP MAP TO PLACE!';
    // highlight
    document.querySelectorAll('.shop-card').forEach(c=>c.style.borderColor='#444');
    card.style.borderColor='#4ade80';
   };
   shop.appendChild(card);
  });
 }

 placeEntity(x,y,id){
  if(!this.textures.exists(id)) return;
  let spr=this.add.image(x,y,id).setDepth(10).setInteractive({draggable:true});
  let isAnimal=id.startsWith('animal-');
  spr.setDisplaySize(isAnimal?26:32, isAnimal?26:32);
  entities.push(spr);
  document.getElementById('cnt').innerText=entities.length+' placed';
  
  // Drag to move placed entity - map steady pa rin
  spr.on('drag', (p,dx,dy)=>{
   spr.x+=dx/this.cameras.main.zoom;
   spr.y+=dy/this.cameras.main.zoom;
  });
  spr.on('pointerdown', (p)=>{
   // Right click / long press to delete
   if(p.rightButtonDown()){
    spr.destroy();
    entities=entities.filter(e=>e!==spr);
    document.getElementById('cnt').innerText=entities.length+' placed';
   }
  });
 }
}

new Phaser.Game({
 type:Phaser.AUTO,
 parent:'game',
 width:innerWidth,
 height:window.innerHeight-140,
 backgroundColor:'#2e2e2e',
 scene:SteadyShop,
 scale:{mode:Phaser.Scale.RESIZE},
 render:{antialias:true}
});
</script></body></html>
