<!DOCTYPE html><html><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>READYPH V47 - SMALL 4 AREAS MAP</title>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/nipplejs@0.9.0/dist/nipplejs.min.js"></script>
<style>
html,body{margin:0;padding:0;background:#2f2f2f;overflow:hidden;height:100%;touch-action:none;font-family:Arial}
#game{position:fixed;inset:0}
#joy{position:fixed;left:12px;bottom:18px;width:110px;height:110px;background:rgba(255,255,255,.3);border-radius:50%;border:2px solid #fff;z-index:50}
#hud{position:fixed;top:0;left:0;right:0;background:rgba(0,0,0,.9);color:#fff;padding:8px 12px;display:flex;justify-content:space-between;z-index:40;font-size:11px;font-weight:800}
#load{position:fixed;inset:0;background:#0f172a;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:99;font-weight:800}
#labels{position:fixed;top:44px;left:0;right:0;display:flex;justify-content:space-around;color:#fff;font-size:9px;font-weight:800;z-index:30;pointer-events:none}
</style>
</head><body>
<div id="load"><div style="font-size:22px">🏗️ BUILDING SMALL MAP</div><div id="l1" style="color:#4ade80;margin-top:8px">Loading 284 building assets...</div><div id="l2" style="font-size:10px;opacity:.6;margin-top:4px"></div></div>
<div id="game"></div>
<div id="hud"><span>V47 - 4 AREAS | CITY | MEDIEVAL | CASTLE | GRASS</span><span id="info">Loading...</span></div>
<div id="joy"></div>
<script>
let joy={x:0,y:0}, ALL=[];
async function getAssets(){
 let list=[];
 try{
  for(let p=1;p<=3;p++){
   let r=await fetch(`https://api.github.com/repos/social-eng/readyph-games/contents/clean?per_page=100&page=${p}`);
   if(!r.ok) break;
   let d=await r.json();
   if(!Array.isArray(d)||d.length==0) break;
   let f=d.filter(x=>x.name.endsWith('.png')&&!x.name.toLowerCase().includes('character')&&!x.name.toLowerCase().includes('animal')).map(x=>x.name);
   list.push(...f);
   document.getElementById('l2').innerText=`${list.length} assets...`;
   if(d.length<100) break;
  }
 }catch(e){}
 if(list.length<40){
  try{
   let r=await fetch(`https://api.github.com/repos/readyphofficial-eng/readyph-games/contents/clean?per_page=100&page=1`);
   let d=await r.json();
   list=d.filter(x=>x.name.endsWith('.png')&&!x.name.toLowerCase().includes('character')).map(x=>x.name);
  }catch(e){}
 }
 if(list.length<40){
  list=["low-detail-building-a.png","low-detail-building-b.png","low-detail-building-c.png","low-detail-building-d.png","low-detail-building-e.png","low-detail-building-f.png","low-detail-building-g.png","low-detail-building-h.png","building-a.png","building-b.png","building-c.png","building-d.png","building-e.png","building-f.png","windmill.png","watermill.png","castle-wall.png","castle-tower.png","tower.png","wall-wood.png","tree.png","tree-small.png","tree-large.png","tree-pine.png","rock.png","rock-small.png","ground.png","ground-grass.png","road.png","fence.png","bush.png"];
 }
 ALL=list; return list;
}

class SmallMap extends Phaser.Scene{
 constructor(){super('SmallMap')}
 preload(){
  let b='clean/';
  ALL.forEach(f=>{ this.load.image(f.replace('.png',''), b+f); });
 }
 create(){
  const W=2400,H=2400;
  this.W=W; this.H=H;
  // Base ground - dark like Kenney samples
  this.add.rectangle(W/2,H/2,W,H,0x3a3a3a).setDepth(0);
  // Grass tiles sa buong map
  if(this.textures.exists('ground-grass')){
   for(let y=0;y<H;y+=256){ for(let x=0;x<W;x+=256){ this.add.image(x,y,'ground-grass').setDepth(0).setScale(0.7).setAlpha(0.4); }}
  }

  const size=(n)=>{
   n=n.toLowerCase();
   if(n.includes('windmill')||n.includes('watermill')) return 0.75;
   if(n.includes('castle-tower')||n.includes('skyscraper')) return 0.68;
   if(n.includes('wide')) return 0.58;
   if(n.includes('low-detail')||n.includes('building-')) return 0.52;
   if(n.includes('house')||n.includes('barn')) return 0.48;
   if(n.includes('wall')||n.includes('fence')) return 0.5;
   if(n.includes('tree-large')) return 0.42;
   if(n.includes('tree')) return 0.36;
   if(n.includes('rock')) return 0.28;
   return 0.4;
  };

  let placed=0;

  // === AREA 1: MEDIEVAL (Top-Left 0,0 to 1200,1200) - gaya ng sample windmill village ===
  this.add.rectangle(600,600,1200,1200,0x5a4a3a).setDepth(0).setAlpha(0.25);
  this.add.text(20,20,'MEDIEVAL', {font:'bold 14px Arial', color:'#ffcc88'}).setDepth(100).setScrollFactor(0);

  let wind=ALL.find(f=>f.includes('windmill'))?.replace('.png','');
  if(wind&&this.textures.exists(wind)){
   let img=this.add.image(350,350,wind).setDepth(350);
   img.setScale(size(wind)); img.setOrigin(0.5,0.8); placed++;
  }
  let water=ALL.find(f=>f.includes('watermill'))?.replace('.png','');
  if(water&&this.textures.exists(water)){
   let img=this.add.image(850,450,water).setDepth(450);
   img.setScale(size(water)); img.setOrigin(0.5,0.8); placed++;
  }
  // 6 medieval houses - maayos, hindi dikit
  let medHouses=ALL.filter(f=> f.includes('house')||f.includes('barn')||f.includes('building-a')||f.includes('building-b')||f.includes('building-c')).slice(0,8).map(f=>f.replace('.png',''));
  if(medHouses.length<4) medHouses=ALL.filter(f=>f.includes('building')).slice(0,6).map(f=>f.replace('.png',''));
  let medPos=[[200,800],[500,850],[800,800],[300,1000],[650,1050],[900,1000]];
  medPos.forEach((p,i)=>{
   let key=medHouses[i%medHouses.length];
   if(!this.textures.exists(key)) return;
   let img=this.add.image(p[0],p[1],key).setDepth(p[1]);
   img.setScale(size(key)); img.setOrigin(0.5,0.82); placed++;
  });
  // Trees sa medieval
  let treeKeys=ALL.filter(f=>f.includes('tree')).map(f=>f.replace('.png','')).slice(0,4);
  for(let i=0;i<8;i++){
   let key=treeKeys[i%Math.max(1,treeKeys.length)];
   if(!key||!this.textures.exists(key)) continue;
   let x=100+Phaser.Math.Between(0,1000), y=Phaser.Math.Between(200,1100);
   let img=this.add.image(x,y,key).setDepth(y);
   img.setScale(size(key)*0.9); img.setOrigin(0.5,0.9); placed++;
  }

  // === AREA 2: CITY (Top-Right 1200,0 to 2400,1200) - gaya ng sample city mo ===
  this.add.rectangle(1800,600,1200,1200,0x4a4a5a).setDepth(0).setAlpha(0.25);
  // Roads - simple 2 roads lang
  this.add.rectangle(1800,600,1200,50,0x2a2a2a).setDepth(1);
  this.add.rectangle(1800,600,50,1200,0x2a2a2a).setDepth(1);
  if(this.textures.exists('road')){
   for(let x=1200;x<2400;x+=100){ this.add.image(x,600,'road').setDepth(2).setScale(0.7).setAngle(90).setAlpha(0.9); }
   for(let y=0;y<1200;y+=100){ this.add.image(1800,y,'road').setDepth(2).setScale(0.7).setAlpha(0.9); }
  }
  let cityBuildings=ALL.filter(f=> f.includes('low-detail-building')).map(f=>f.replace('.png',''));
  if(cityBuildings.length<6) cityBuildings=ALL.filter(f=>f.includes('building')).map(f=>f.replace('.png',''));
  let cityPos=[[1350,200],[1600,200],[1950,200],[2100,200],[1350,400],[1600,400],[1950,400],[2100,400],[1350,900],[1600,900],[1950,900],[2100,900]];
  cityPos.forEach((p,i)=>{
   let key=cityBuildings[i%cityBuildings.length];
   if(!this.textures.exists(key)) return;
   let img=this.add.image(p[0],p[1],key).setDepth(p[1]);
   img.setScale(size(key)); img.setOrigin(0.5,0.82); placed++;
  });

  // === AREA 3: CASTLE (Bottom-Left 0,1200 to 1200,2400) - gaya ng sample castle mo ===
  this.add.rectangle(600,1800,1200,1200,0x5a5a4a).setDepth(0).setAlpha(0.25);
  let wallKey=ALL.find(f=>f.includes('castle-wall')||f.includes('wall-wood'))?.replace('.png','');
  let towerKey=ALL.find(f=>f.includes('castle-tower')||f.includes('tower'))?.replace('.png','');
  // S-shaped wall gaya ng Kenney sample!
  if(wallKey&&this.textures.exists(wallKey)){
   let walls=[[300,1500],[470,1500],[640,1500],[810,1500],[810,1670],[810,1840],[640,1840],[470,1840],[300,1840]];
   walls.forEach(p=>{
    let img=this.add.image(p[0],p[1],wallKey).setDepth(p[1]);
    img.setScale(size(wallKey)); img.setOrigin(0.5,0.82); placed++;
   });
  }
  if(towerKey&&this.textures.exists(towerKey)){
   [[300,1500],[810,1500],[810,1840],[300,1840]].forEach(p=>{
    let img=this.add.image(p[0],p[1],towerKey).setDepth(p[1]+5);
    img.setScale(size(towerKey)); img.setOrigin(0.5,0.85); placed++;
   });
  }
  // Rocks at trees sa castle
  let rockKeys=ALL.filter(f=>f.includes('rock')).map(f=>f.replace('.png','')).slice(0,3);
  for(let i=0;i<6;i++){
   let key=rockKeys[i%Math.max(1,rockKeys.length)];
   if(!key||!this.textures.exists(key)) continue;
   let img=this.add.image(200+Phaser.Math.Between(0,800),1400+Phaser.Math.Between(0,600),key).setDepth(1400+i*20);
   img.setScale(size(key)); img.setOrigin(0.5,0.85); placed++;
  }

  // === AREA 4: GRASSLAND (Bottom-Right 1200,1200 to 2400,2400) - open grass lang ===
  this.add.rectangle(1800,1800,1200,1200,0x4a6a4a).setDepth(0).setAlpha(0.2);
  // Maraming puno at rocks lang
  for(let i=0;i<12;i++){
   let key=treeKeys[i%Math.max(1,treeKeys.length)];
   if(!key||!this.textures.exists(key)) continue;
   let x=1300+Phaser.Math.Between(0,1000), y=1300+Phaser.Math.Between(0,1000);
   let img=this.add.image(x,y,key).setDepth(y);
   img.setScale(size(key)*0.8); img.setOrigin(0.5,0.9); placed++;
  }
  for(let i=0;i<8;i++){
   let key=rockKeys[i%Math.max(1,rockKeys.length)];
   if(!key||!this.textures.exists(key)) continue;
   let x=1300+Phaser.Math.Between(0,1000), y=1300+Phaser.Math.Between(0,1000);
   let img=this.add.image(x,y,key).setDepth(y);
   img.setScale(size(key)); img.setOrigin(0.5,0.85); placed++;
  }

  document.getElementById('load').style.display='none';
  this.cameras.main.setBounds(0,0,W,H);
  this.cameras.main.centerOn(1200,1200);
  this.cameras.main.setZoom(0.75);

  this.keys=this.input.keyboard.addKeys('W,A,S,D');
  document.getElementById('info').innerText=`${ALL.length} assets | Placed: ${placed} | ${W}x${H} | 4 AREAS`;

  this.input.on('pointermove', p=>{
   if(p.isDown&&p.prevPosition){
    this.cameras.main.scrollX-=(p.x-p.prevPosition.x)/this.cameras.main.zoom;
    this.cameras.main.scrollY-=(p.y-p.prevPosition.y)/this.cameras.main.zoom;
   }
  });
 }

 update(){
  let sp=20, mx=joy.x, my=joy.y;
  if(this.keys.A.isDown) mx=-1; if(this.keys.D.isDown) mx=1;
  if(this.keys.W.isDown) my=-1; if(this.keys.S.isDown) my=1;
  if(Math.abs(mx)<0.1) mx=0; if(Math.abs(my)<0.1) my=0;
  if(mx||my){ this.cameras.main.scrollX+=mx*sp; this.cameras.main.scrollY+=my*sp; }
 }
}

(async()=>{
 await getAssets();
 new Phaser.Game({type:Phaser.AUTO,parent:'game',width:innerWidth,height:innerHeight,backgroundColor:'#2f2f2f',scene:SmallMap,scale:{mode:Phaser.Scale.RESIZE}});
 let s=nipplejs.create({zone:document.getElementById('joy'),mode:'static',position:{left:'60px',top:'60px'},color:'white',size:90});
 s.on('move',(e,d)=>{if(d&&d.vector){joy.x=d.vector.x; joy.y=-d.vector.y;}});
 s.on('end',()=>{joy.x=0;joy.y=0;});
})();
</script></body></html>
