<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>READYPH V6 CAMPUS UPGRADE</title>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/nipplejs@0.9.0/dist/nipplejs.min.js"></script>
<style>
 body{margin:0;background:#000;overflow:hidden;font-family:Arial;touch-action:none}
 #joy{position:fixed;left:10px;bottom:10px;width:130px;height:130px;z-index:20;background:rgba(255,255,255,0.1);border-radius:50%;border:2px solid rgba(255,255,255,0.5)}
 #btnA{position:fixed;right:20px;bottom:85px;width:82px;height:82px;background:#22c55e;border-radius:50%;border:3px solid #fff;color:#fff;font-weight:900;font-size:22px;z-index:20;box-shadow:0 4px 12px rgba(0,0,0,.5)}
 #btnB{position:fixed;right:110px;bottom:15px;width:64px;height:64px;background:#f59e0b;border-radius:50%;border:3px solid #fff;color:#fff;font-weight:bold;z-index:20}
 #hud{position:fixed;top:0;left:0;right:0;background:#000000ee;color:#fff;padding:10px 12px;display:flex;justify-content:space-between;z-index:10;font-size:12px;font-weight:bold}
 #dialog{position:fixed;bottom:0;left:0;right:0;background:#0f172a;border-top:4px solid #22c55e;padding:16px;color:#fff;display:none;z-index:30;border-radius:12px 12px 0 0}
 #quiz{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:#fff;padding:20px;border-radius:16px;width:88%;max-width:380px;display:none;z-index:40;color:#000}
 #cert{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:#fffbeb;padding:24px;border-radius:16px;width:88%;max-width:380px;display:none;z-index:50;text-align:center;border:4px solid #f59e0b}
 #exitBtn{position:fixed;bottom:120px;left:50%;transform:translateX(-50%);background:#ef4444;color:#fff;padding:12px 24px;border-radius:20px;border:2px solid #fff;font-weight:900;display:none;z-index:25}
</style>
</head>
<body>
<div id="hud"><span id="hudLeft">Day 1 | Score:0</span><span id="hudMid">⚡100</span><span id="hudRight">Campus</span></div>
<div id="joy"></div><button id="btnA">A</button><button id="btnB">RUN</button>
<button id="exitBtn">🚪 EXIT</button>
<div id="dialog"><b id="dName" style="color:#22c55e"></b><p id="dText" style="white-space:pre-line;margin:8px 0"></p><small>Tap to close</small></div>
<div id="quiz"><div style="display:flex;justify-content:space-between"><b id="qProg">Q1</b><b id="qScore">0</b></div><h3 id="qText" style="margin:12px 0"></h3><div id="qOpts"></div></div>
<div id="cert"><h2>🏆 CERTIFICATE</h2><p id="certScore"></p><button onclick="localStorage.clear(); location.reload()" style="margin-top:12px;padding:12px;width:100%;border-radius:10px;border:0;background:#22c55e;color:#fff;font-weight:900">PLAY AGAIN</button></div>

<script>
let joy={x:0,y:0}, score=0, day=1, energy=100, isIndoor=false;
let saved=JSON.parse(localStorage.getItem('readyph_v5')||'{"score":0,"day":1}'); score=saved.score||0; day=saved.day||1;
const qBank=[
 {q:"She ___ to school every day.", opts:["go","goes","going"], ans:1},{q:"I have ___ finished.", opts:["already","yet","ever"], ans:0},{q:"Could you ___ me?", opts:["help","helps","helped"], ans:0},{q:"Synonym of happy?", opts:["sad","joyful","angry"], ans:1},{q:"Antonym of difficult?", opts:["hard","easy","tough"], ans:1},{q:"Past of 'go'?", opts:["goed","went","gone"], ans:1},{q:"___ are you from?", opts:["Where","What","Who"], ans:0},{q:"Article: ___ apple", opts:["A","An","The"], ans:1},{q:"I ___ studying for 2 hrs.", opts:["have been","has been","am"], ans:0},{q:"'The graph shows' is used in?", opts:["Task 1","Task 2","Speaking"], ans:0}
];
let qIdx=0;
function save(){localStorage.setItem('readyph_v5',JSON.stringify({score,day}));}
function updateHUD(){document.getElementById('hudLeft').innerText=`Day ${day} | Score:${score}`; document.getElementById('hudMid').innerText=`⚡${Math.floor(energy)}`; document.getElementById('qScore').innerText=`Score:${score}`; if(score>=500){document.getElementById('cert').style.display='block'; document.getElementById('certScore').innerText=`Final: ${score}/1000 PASSED!`;}}
function showDialog(n,t){document.getElementById('dName').innerText=n; document.getElementById('dText').innerText=t; document.getElementById('dialog').style.display='block';}
function hideDialog(){document.getElementById('dialog').style.display='none';}
function exitClassroom(){
 let sc=game.scene.getScene('Game'); sc.isIndoor=false; isIndoor=false;
 sc.player.x=1250; sc.player.y=1050;
 sc.buildings.forEach(b=>{b.rect.setVisible(true); b.label.setVisible(true);});
 sc.classItems.forEach(o=>o.setVisible(false)); sc.teacher.setVisible(false);
 sc.cameras.main.setBounds(0,0,2500,2500); sc.cameras.main.setBackgroundColor(0x6dbf5a);
 document.getElementById('exitBtn').style.display='none'; hideDialog();
}

class Game extends Phaser.Scene{
 constructor(){super('Game')} 
 create(){
  // MAP
  this.add.rectangle(1250,1250,2500,2500,0x6dbf5a);
  this.add.rectangle(1250,1250,2500,160,0xe8dcc3); this.add.rectangle(1250,1250,160,2500,0xe8dcc3);
  // grid
  for(let i=0;i<2500;i+=200){this.add.rectangle(i,1250,2,2500,0x000000,0.03); this.add.rectangle(1250,i,2500,2,0x000000,0.03);}
  // trees
  for(let i=0;i<25;i++){let x=Phaser.Math.Between(100,2400), y=Phaser.Math.Between(100,2400); if(Phaser.Math.Distance.Between(x,y,1250,800)<400) continue; this.add.circle(x,y,12,0x2d6a2e).setDepth(0); this.add.rectangle(x,y+10,6,18,0x5d4037).setDepth(0);}

  this.buildings=[];
  let addBuilding=(x,y,w,h,color,name,emoji)=>{
   let rect=this.add.rectangle(x,y,w,h,color).setStrokeStyle(4,0x000000); rect.setDepth(2);
   let label=this.add.text(x,y,`${emoji}\n${name}`,{fontSize:'12px',align:'center',fontStyle:'bold'}).setOrigin(0.5); label.setDepth(3);
   this.buildings.push({x,y,w,h,name,rect,label});
   return {rect,label};
  };
  // OLD
  let main=addBuilding(1250,800,360,250,0x9c7c62,'MAIN','🏫');
  main.label.setText('🏫\nREADYPH MAIN\nPRESS A'); 
  addBuilding(750,1250,220,220,0xffd99a,'CANTEEN','🍛');
  addBuilding(1250,1800,280,200,0x90caf9,'DORM','🛏️');
  // NEW V6
  addBuilding(1750,1250,240,200,0xc8e6c9,'LIBRARY','📚');
  addBuilding(750,600,220,180,0xffccbc,'GYM','🏀');
  addBuilding(1750,600,200,180,0xd1c4e9,'OFFICE','🏢');

  // PLAYER - UPGRADED UNIFORM
  this.player = this.add.container(1250,1100); this.player.setDepth(10);
  let shadow=this.add.ellipse(0,14,18,7,0x000000,0.35);
  let pants=this.add.rectangle(0,8,16,18,0x1e3a8a).setStrokeStyle(1.5,0x000); // blue pants
  let polo=this.add.rectangle(0,-6,20,20,0xffffff).setStrokeStyle(1.5,0x000); // white polo
  let collar=this.add.rectangle(0,-14,12,6,0x1e3a8a);
  let backpack=this.add.rectangle(0,-2,22,14,0x3b82f6).setStrokeStyle(1,0x000); backpack.x=10;
  let head=this.add.circle(0,-22,10,0xffdbac).setStrokeStyle(1.5,0x000);
  let hair=this.add.rectangle(0,-30,20,8,0x2c1810);
  let eye1=this.add.circle(-3,-22,1.5,0x000); let eye2=this.add.circle(3,-22,1.5,0x000);
  this.player.add([shadow,pants,backpack,polo,collar,head,hair,eye1,eye2]);

  // NPC STUDENTS
  this.npcs=[];
  let npcData=[
   {x:900,y:1000,color:0xff8a65,name:'Ana',msg:'Hi! Punta ka Library para mag review! 📚'},
   {x:1600,y:1000,color:0x81c784,name:'Mark',msg:'Gym tayo! Energy +20 pag nag gym ka! 🏀'},
   {x:1250,y:600,color:0xba68c8,name:'Sofia',msg:'Office muna, may scholarship info! 🏢'},
   {x:1000,y:1400,color:0x4db6ac,name:'Jake',msg:'Canteen? Sarap ng adobo dun! 🍛'},
   {x:1500,y:1500,color:0xffd54f,name:'Mia',msg:'Dorm para magpahinga, Day +1! 🛏️'}
  ];
  npcData.forEach(d=>{
   let npc=this.add.container(d.x,d.y); npc.setDepth(5);
   let s=this.add.ellipse(0,10,14,5,0x000000,0.25);
   let b=this.add.rectangle(0,0,16,20,d.color).setStrokeStyle(1,0x000);
   let h=this.add.circle(0,-16,8,0xffdbac).setStrokeStyle(1,0x000);
   npc.add([s,b,h]); npc.name=d.name; npc.msg=d.msg; npc.origX=d.x; npc.origY=d.y; npc.dir=Math.random()*6.28;
   this.npcs.push(npc);
  });

  // TEACHER - FIXED
  this.teacher = this.add.container(400,220); this.teacher.setVisible(false); this.teacher.setDepth(20);
  let tShadow=this.add.ellipse(0,14,18,7,0x000000,0.3); let tBody=this.add.rectangle(0,0,26,34,0x16a34a).setStrokeStyle(2,0x000); let tHead=this.add.circle(0,-22,12,0xffdbac).setStrokeStyle(1.5,0x000);
  this.teacher.add([tShadow,tBody,tHead]); this.teacher.add(this.add.text(0,-50,'Ms. ReadyPH',{fontSize:'12px',backgroundColor:'#000',color:'#22c55e'}).setOrigin(0.5));

  this.classItems=[];
  let bgBoard=this.add.rectangle(400,50,540,70,0x1e3a2f).setStrokeStyle(4,0x000).setVisible(false); bgBoard.setDepth(1);
  let txt=this.add.text(400,50,'ENGLISH / IELTS - READYPH',{color:'#fff',fontSize:'16px',fontStyle:'bold'}).setOrigin(0.5).setVisible(false); txt.setDepth(2);
  let subTxt=this.add.text(400,70,'Press A near teacher for quiz',{color:'#ffeb3b',fontSize:'11px'}).setOrigin(0.5).setVisible(false); subTxt.setDepth(2);
  this.classItems.push(bgBoard,txt,subTxt);
  for(let r=0;r<3;r++){for(let c=0;c<4;c++){let x=140+c*170, y=200+r*120; let d=this.add.rectangle(x,y,60,35,0x8d6e63).setStrokeStyle(2,0x3e2723).setVisible(false); d.setDepth(1); this.classItems.push(d);}}
  this.exitArea = this.add.rectangle(400,580,800,40,0xef4444,0.5).setVisible(false); this.classItems.push(this.exitArea);
  this.exitLabel = this.add.text(400,580,'🚪 EXIT HERE - Baba dito para lumabas',{color:'#fff',fontSize:'14px',backgroundColor:'#ef4444'}).setOrigin(0.5).setVisible(false); this.classItems.push(this.exitLabel);

  this.cameras.main.setBounds(0,0,2500,2500); this.cameras.main.startFollow(this.player,true,0.12,0.12);
  this.keys=this.input.keyboard.addKeys('W,A,S,D,SHIFT');
  this.isIndoor=false; isIndoor=false; updateHUD();
 }

 update(time,delta){
  if(document.getElementById('quiz').style.display==='block'||document.getElementById('dialog').style.display==='block') return;
  let speed = 5; if(this.keys.SHIFT.isDown || document.getElementById('btnB').matches(':active')) speed=8;
  let mx=0,my=0;
  if(this.keys.A.isDown) mx=-1; else if(this.keys.D.isDown) mx=1; else mx=joy.x;
  if(this.keys.W.isDown) my=-1; else if(this.keys.S.isDown) my=1; else my=joy.y;
  if(Math.abs(mx) < 0.25) mx=0; if(Math.abs(my) < 0.25) my=0;
  if(mx!=0 || my!=0){ this.player.x+=mx*speed; this.player.y+=my*speed; energy=Math.max(0,energy-0.03); updateHUD(); }
  if(!this.isIndoor){
   this.player.x=Phaser.Math.Clamp(this.player.x,20,2480); this.player.y=Phaser.Math.Clamp(this.player.y,20,2480);
   // NPC WANDER
   this.npcs.forEach(npc=>{
    npc.dir+= (Math.random()-0.5)*0.05;
    npc.x+=Math.cos(npc.dir)*0.6; npc.y+=Math.sin(npc.dir)*0.6;
    if(Phaser.Math.Distance.Between(npc.x,npc.y,npc.origX,npc.origY)>180) npc.dir+=3.14;
   });
  } else {
   this.player.x=Phaser.Math.Clamp(this.player.x,60,740); this.player.y=Phaser.Math.Clamp(this.player.y,80,590);
   if(this.player.y>500) document.getElementById('exitBtn').style.display='block'; else document.getElementById('exitBtn').style.display='none';
  }
  let dMain=Phaser.Math.Distance.Between(this.player.x,this.player.y,1250,800);
  if(dMain<280 && !this.isIndoor){document.getElementById('hudRight').innerText='PRESS A!';} else if(!this.isIndoor){document.getElementById('hudRight').innerText='Campus V6';}
 }
}

const game=new Phaser.Game({width:innerWidth,height:innerHeight,backgroundColor:'#5a8f3e',scene:Game});

function startQuiz(){
 let q=qBank[qIdx%qBank.length];
 document.getElementById('qProg').innerText=`Q ${qIdx+1}/${qBank.length}`;
 document.getElementById('qText').innerText=q.q;
 let box=document.getElementById('qOpts'); box.innerHTML='';
 q.opts.forEach((o,i)=>{
  let b=document.createElement('button'); b.style='width:100%;padding:12px;margin:6px 0;border-radius:10px;border:2px solid #000;background:#fff;font-weight:bold;text-align:left'; b.innerText=String.fromCharCode(65+i)+'. '+o;
  b.onclick=()=>{if(i===q.ans){score+=50; energy=Math.min(100,energy+10); showDialog('✅ CORRECT!','+50!');}else{showDialog('❌ Mali','Tama: '+q.opts[q.ans]);} qIdx=(qIdx+1)%qBank.length; save(); updateHUD(); document.getElementById('quiz').style.display='none';};
  box.appendChild(b);
 });
 document.getElementById('quiz').style.display='block';
}

function doInteract(){
 let sc=game.scene.getScene('Game'); if(!sc) return;
 if(!sc.isIndoor){
  let dMain=Phaser.Math.Distance.Between(sc.player.x,sc.player.y,1250,800);
  if(dMain<300){
   sc.isIndoor=true; isIndoor=true;
   sc.buildings.forEach(b=>{b.rect.setVisible(false); b.label.setVisible(false);});
   sc.classItems.forEach(o=>o.setVisible(true)); sc.teacher.setVisible(true);
   sc.npcs.forEach(n=>n.setVisible(false));
   sc.cameras.main.setBounds(0,0,800,600); sc.cameras.main.setBackgroundColor(0xfaf6e8);
   showDialog('Ms. ReadyPH','Welcome to V6! New campus outside! Lapit sakin para mag quiz!');
   return;
  }
  // Check NPCs
  for(let npc of sc.npcs){ if(Phaser.Math.Distance.Between(sc.player.x,sc.player.y,npc.x,npc.y)<90){ showDialog(npc.name,npc.msg); return; } }
  // Check buildings
  for(let b of sc.buildings){
   if(Phaser.Math.Distance.Between(sc.player.x,sc.player.y,b.x,b.y)<150){
    if(b.name==='CANTEEN'){energy=100; updateHUD(); showDialog('Canteen 🍛','Busog! Energy 100!');}
    else if(b.name==='DORM'){day++; energy=100; save(); updateHUD(); showDialog('Dorm 🛏️',`Day ${day} na!`); sc.player.x=1250; sc.player.y=1350;}
    else if(b.name==='LIBRARY'){score+=20; save(); updateHUD(); showDialog('Library 📚','Nag review ka! +20 Score!');}
    else if(b.name==='GYM'){energy=100; updateHUD(); showDialog('Gym 🏀','Workout! Energy full + lakas!');}
    else if(b.name==='OFFICE'){showDialog('Office 🏢','Scholarship info: Need 500 score for certificate!');}
    return;
   }
  }
 } else {
  let dT=Phaser.Math.Distance.Between(sc.player.x,sc.player.y,400,220);
  if(dT<150){startQuiz();} else if(sc.player.y>520){exitClassroom();}
 }
}

let mgr=nipplejs.create({zone:document.getElementById('joy'), mode:'static', position:{left:'65px',top:'65px'}, color:'white', size:90});
mgr.on('move',(e,d)=>{if(d&&d.vector){joy.x=d.vector.x; joy.y=-d.vector.y;}});
mgr.on('end',()=>{joy.x=0; joy.y=0;});
window.addEventListener('touchend',()=>{ setTimeout(()=>{joy.x=0; joy.y=0;},50);});
document.getElementById('btnA').onclick=doInteract;
document.getElementById('exitBtn').onclick=exitClassroom;
document.getElementById('dialog').onclick=hideDialog;
document.addEventListener('keydown',e=>{if(e.key.toLowerCase()==='e') doInteract();});
</script>
</body>
</html>
