<!DOCTYPE html><html><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>V60 OWNED TAB + STATS</title>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
<style>
html,body{margin:0;padding:0;background:#0f0f0f;overflow:hidden;height:100%;touch-action:none;font-family:Arial}
#game{position:fixed;inset:0}
#top{position:fixed;top:0;left:0;right:0;background:rgba(0,0,0,.9);color:#fff;padding:7px 10px;font-size:10px;font-weight:900;z-index:40;display:flex;justify-content:space-between}
#toggle{position:fixed;bottom:15px;left:50%;transform:translateX(-50%);background:#4ade80;color:#000;border:none;border-radius:22px;padding:12px 26px;font-weight:900;font-size:14px;z-index:80}
#shopWrap{position:fixed;bottom:0;left:0;right:0;height:160px;background:#0a0a0a;border-top:3px solid #333;z-index:60;transition:transform.3s}
#shopWrap.closed{transform:translateY(100%)}
#shop{height:100%;display:flex;gap:10px;padding:10px;overflow-x:auto}
.card{width:84px;min-width:84px;height:138px;background:#222;border:2px solid #444;border-radius:12px;display:flex;flex-direction:column;align-items:center;padding:6px;flex-shrink:0}
.card img{width:48px;height:48px;object-fit:contain;background:#1a1a1a;border-radius:8px}
.card b{font-size:8px;color:#fff;margin:4px 0;text-align:center;height:18px;display:flex;align-items:center}
.card button{background:#4ade80;color:#000;border:none;border-radius:8px;padding:5px;font-size:9px;font-weight:900;width:100%}

/* LEFT TAB - OWNED LIST */
#ownedTab{position:fixed;top:40px;left:0;bottom:170px;width:54px;background:rgba(0,0,0,.85);border-right:2px solid #333;z-index:55;display:flex;flex-direction:column;align-items:center;padding:6px 0}
#ownedTab b{color:#4ade80;font-size:8px;margin-bottom:6px}
#ownedList{flex:1;width:100%;overflow-y:auto;display:flex;flex-direction:column;gap:6px;padding:0 4px}
.ownedItem{width:44px;height:44px;background:#222;border:2px solid #555;border-radius:10px;display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative;flex-shrink:0}
.ownedItem img{width:32px;height:32px;object-fit:contain}
.ownedItem.highlight{border-color:#facc15;box-shadow:0 0 10px #facc15;animation:pulse.8s infinite}
.ownedItem.lvl{position:absolute;bottom:-4px;right:-4px;background:#4ade80;color:#000;font-size:7px;font-weight:900;padding:1px 4px;border-radius:8px}
@keyframes pulse{0%{transform:scale(1)}50%{transform:scale(1.1)}100%{transform:scale(1)}}
#ownedCount{color:#fff;font-size:9px;margin-top:4px;font-weight:800}

/* STATS WINDOW */
#statWin{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) scale(0);background:#1e1e1e;border:3px solid #4ade80;border-radius:16px;padding:14px;width:260px;z-index:90;transition:transform.2s;box-shadow:0 10px 30px rgba(0,0,0,.8)}
#statWin.open{transform:translate(-50%,-50%) scale(1)}
#statWin.head{display:flex;gap:10px;align-items:center;margin-bottom:10px}
#statWin.head img{width:52px;height:52px;background:#111;border-radius:10px;object-fit:contain}
#statWin h3{margin:0;color:#fff;font-size:14px}
#statWin.sub{color:#aaa;font-size:10px}
.statRow{display:flex;justify-content:space-between;background:#2a2a2a;margin:3px 0;padding:5px 8px;border-radius:6px;font-size:10px;color:#ddd}
.statRow b{color:#4ade80}
#statWin button{width:100%;margin-top:10px;padding:8px;border:none;border-radius:8px;font-weight:900;cursor:pointer}
.btnClose{background:#333;color:#fff}
.btnFollow{background:#facc15;color:#000;margin-top:6px!important}
#tip{position:fixed;bottom:70px;left:62px;background:rgba(0,0,0,.7);color:#fff;padding:5px 10px;border-radius:12px;font-size:9px;z-index:50}
</style>
</head><body>
<div id="game"></div>
<div id="top"><span>🏝️ V60 - OWNED + STATS</span><span>🪙 <span id="coins">500</span> | <span id="cnt">0</span> | 40% FIXED</span></div>

<div id="ownedTab">
<b>OWNED</b>
<div id="ownedList"></div>
<div id="ownedCount">0</div>
</div>

<div id="tip">🖐️ Drag map | Left tab = click to find</div>

<div id="statWin">
<div class="head"><img id="sImg"><div><h3 id="sName">Name</h3><div class="sub" id="sType">type</div></div></div>
<div id="sStats"></div>
<button class="btnFollow" onclick="followSelected()">📍 GO TO LOCATION</button>
<button class="btnClose" onclick="closeStat()">❌ CLOSE</button>
</div>

<div id="shopWrap" class="closed"><div id="shop"></div></div>
<button id="toggle">🛒 SHOP</button>

<script>
const ANIMALS=['beaver','bee','bunny','cat','caterpillar','chick','cow','crab','deer','dog','elephant','fox','giraffe','hog','koala','lion','monkey','panda','parrot','penguin','pig','polar','tiger'];
const HUMANS=['female-a','female-b','female-c','female-d','female-e','female-f','male-a','male-b','male-c','male-d','male-e','male-f'];
const FIRST_NAMES=['Juan','Maria','Pedro','Ana','Luna','Bata','Milo','Kiko','Bebe','Tigre','Lio','Momo','Chuchu','Browny','Putol','Kulit','Bilog','Ampon','Liit','Brave','Lakas','Ganda','Talon','Bilis'];
const LAST_NAMES=['de la Cruz','Santos','Reyes','Mabait','Malakas','Makulit','Matapang','Mabagal','Mabilis','Tahimik','Maingay','Matalino','Bibo','Tamad','Sipag'];
const JOBS=['Farmer','Hunter','Builder','Idle','Wanderer','Guard','Gatherer','Explorer','Sleepy','Hungry'];
const MOODS=['😊 Happy','😋 Hungry','😴 Sleepy','😡 Angry','🤩 Excited','😢 Sad','😎 Cool','🤔 Curious'];

let coins=500, selected=null, isShopOpen=false, selectedEnt=null;
let NAMES_USED=[];

function randName(){
 let f=FIRST_NAMES[Math.floor(Math.random()*FIRST_NAMES.length)];
 let l=LAST_NAMES[Math.floor(Math.random()*LAST_NAMES.length)];
 return f+' '+l;
}

class WorldV60 extends Phaser.Scene{
 constructor(){super('WorldV60'); this.ents=[]}
 preload(){
  this.load.image('map','new/map-triangle-4k.png');
  this.load.image('map2','assets/maps/map-triangle-4k.png');
  this.load.image('map3','clean/map-triangle-4k.png');
  ANIMALS.forEach(n=>{this.load.image('a-'+n,'new/animal-'+n+'.png'); this.load.image('a2-'+n,'assets/animals/animal-'+n+'.png'); this.load.image('a3-'+n,'clean/animal-'+n+'.png');});
  HUMANS.forEach(n=>{this.load.image('h-'+n,'new/character-'+n+'.png'); this.load.image('h2-'+n,'assets/characters/character-'+n+'.png'); this.load.image('h3-'+n,'clean/character-'+n+'.png');});
 }
 create(){
  const W=3500,H=3500;
  this.add.rectangle(W/2,H/2,W,H,0x1a2a1a).setDepth(0);
  let mapKey=this.textures.exists('map')?'map':this.textures.exists('map2')?'map2':'map3';
  if(this.textures.exists(mapKey)){
   let tex=this.textures.get(mapKey).getSourceImage();
   this.island=this.add.image(W/2,H/2,mapKey).setDepth(1);
   let r=Math.min(2400/tex.width,2400/tex.height);
   this.island.setDisplaySize(tex.width*r, tex.height*r);
   this.bounds={x:W/2-1200,y:H/2-1200,w:2400,h:2400};
  }else this.bounds={x:300,y:300,w:2900,h:2900};

  this.cameras.main.setBounds(0,0,W,H);
  this.cameras.main.centerOn(W/2,H/2);
  this.cameras.main.setZoom(0.40);

  this.isDragging=false; this.dragStart=null;
  this.input.on('pointerdown', p=>{
   if(isShopOpen && p.y<window.innerHeight-160 && selected){
    let wp=this.cameras.main.getWorldPoint(p.x,p.y);
    this.spawn(wp.x,wp.y,selected); selected=null; return;
   }
   if(p.x<54 && p.y>40 && p.y<window.innerHeight-170) return; // left tab area
   if(document.getElementById('statWin').classList.contains('open')) return;
   if(!isShopOpen){ this.isDragging=true; this.dragStart={x:p.x,y:p.y,sx:this.cameras.main.scrollX,sy:this.cameras.main.scrollY}; }
  });
  this.input.on('pointermove', p=>{
   if(this.isDragging && this.dragStart &&!isShopOpen){
    this.cameras.main.scrollX=this.dragStart.sx - (p.x-this.dragStart.x)/0.40;
    this.cameras.main.scrollY=this.dragStart.sy - (p.y-this.dragStart.y)/0.40;
   }
  });
  this.input.on('pointerup', ()=>{this.isDragging=false;});

  this.buildShop();
  document.getElementById('toggle').onclick=()=>{
   isShopOpen=!isShopOpen;
   document.getElementById('shopWrap').className=isShopOpen?'':'closed';
   document.getElementById('toggle').innerHTML=isShopOpen?'❌ CLOSE':'🛒 SHOP';
  };
 }
 buildShop(){
  const shop=document.getElementById('shop');
  [...HUMANS.map(n=>({id:'h-'+n,name:n,price:20,t:'human'})),...ANIMALS.map(n=>({id:'a-'+n,name:n,price:10,t:'animal'}))].forEach(it=>{
   let real=it.id;
   if(!this.textures.exists(real)){ if(this.textures.exists('h2-'+it.name)||this.textures.exists('a2-'+it.name)) real=it.t=='human'?'h2-'+it.name:'a2-'+it.name; else if(this.textures.exists('h3-'+it.name)||this.textures.exists('a3-'+it.name)) real=it.t=='human'?'h3-'+it.name:'a3-'+it.name; }
   let path=`new/${it.t=='human'?'character':'animal'}-${it.name}.png`;
   let c=document.createElement('div'); c.className='card';
   c.innerHTML=`<img src="${path}" onerror="this.src='assets/${it.t=='human'?'characters/character':'animals/animal'}-${it.name}.png'"><b>${it.name.toUpperCase()}</b><button>🪙${it.price}</button>`;
   c.querySelector('button').onclick=()=>{
    if(coins<it.price) return; coins-=it.price; document.getElementById('coins').innerText=coins;
    selected=real; document.querySelectorAll('.card').forEach(x=>x.style.borderColor='#444'); c.style.borderColor='#4ade80';
   };
   shop.appendChild(c);
  });
 }
 spawn(x,y,id){
  if(!this.textures.exists(id)) return;
  let isHuman=id.includes('female')||id.includes('male');
  let w=isHuman?110: id.includes('elephant')||id.includes('giraffe')?120: id.includes('bee')||id.includes('crab')?70:90;
  let h=isHuman?140:w;
  let spr=this.add.image(x,y,id).setDepth(10).setInteractive();
  spr.setDisplaySize(w,h);
  // STATS!
  spr.stats={
   id: 'ID-'+Math.random().toString(36).substr(2,5).toUpperCase(),
   name: randName(),
   type: id.replace('a-','').replace('h-','').replace('a2-','').replace('h2-','').replace('a3-','').replace('h3-','').toUpperCase(),
   isHuman: isHuman,
   lvl: Math.floor(Math.random()*10)+1,
   age: Math.floor(Math.random()*30)+1 + (isHuman?' years':' months'),
   health: Math.floor(Math.random()*40)+60,
   hunger: Math.floor(Math.random()*100),
   energy: Math.floor(Math.random()*100),
   speed: (Math.random()*2+0.5).toFixed(1),
   job: JOBS[Math.floor(Math.random()*JOBS.length)],
   mood: MOODS[Math.floor(Math.random()*MOODS.length)],
   kills: Math.floor(Math.random()*5),
   born: new Date().toLocaleTimeString()
  };
  spr.vx=(Math.random()-0.5)*1.2; spr.vy=(Math.random()-0.5)*1.2;
  spr.on('pointerdown', ()=>{ this.showStats(spr); });
  this.ents.push(spr);
  document.getElementById('cnt').innerText=this.ents.length;
  this.addToOwnedTab(spr);
 }

 addToOwnedTab(spr){
  const list=document.getElementById('ownedList');
  let div=document.createElement('div'); div.className='ownedItem';
  div.innerHTML=`<img src="${spr.texture.key=='map'?'':''}" style="display:none"><img src="${spr.frame.texture.source[0].image.currentSrc || ''}" onerror="this.src='new/${spr.stats.isHuman?'character':'animal'}-${spr.stats.type.toLowerCase()}.png'"><span class="lvl">${spr.stats.lvl}</span>`;
  // fix img
  let img=div.querySelectorAll('img')[1];
  img.src=`new/${spr.stats.isHuman?'character':'animal'}-${spr.stats.type.toLowerCase()}.png`;
  img.onerror=()=>{ img.src=`clean/${spr.stats.isHuman?'character':'animal'}-${spr.stats.type.toLowerCase()}.png`; };

  div.onclick=()=>{
   selectedEnt=spr;
   this.focusOn(spr);
   this.showStats(spr);
  };
  div._spr=spr;
  spr._tabEl=div;
  list.appendChild(div);
  document.getElementById('ownedCount').innerText=this.ents.length;
 }

 focusOn(spr){
  // center camera
  this.cameras.main.pan(spr.x, spr.y, 400, 'Power2');
  // highlight
  document.querySelectorAll('.ownedItem').forEach(e=>e.classList.remove('highlight'));
  if(spr._tabEl) spr._tabEl.classList.add('highlight');
  // glow effect on map
  this.tweens.add({targets:spr, scaleX:spr.scaleX*1.4, scaleY:spr.scaleY*1.4, yoyo:true, duration:200, repeat:2});
  setTimeout(()=>{ if(spr._tabEl) spr._tabEl.classList.remove('highlight'); }, 2000);
 }

 showStats(spr){
  selectedEnt=spr;
  document.getElementById('sImg').src=spr.frame.texture.source[0].image.currentSrc || `new/${spr.stats.isHuman?'character':'animal'}-${spr.stats.type.toLowerCase()}.png`;
  document.getElementById('sName').innerText=spr.stats.name;
  document.getElementById('sType').innerText=spr.stats.type+' • '+spr.stats.id;
  document.getElementById('sStats').innerHTML=`
   <div class="statRow"><span>📶 LEVEL</span><b>${spr.stats.lvl}</b></div>
   <div class="statRow"><span>🎂 AGE</span><b>${spr.stats.age}</b></div>
   <div class="statRow"><span>❤️ HEALTH</span><b>${spr.stats.health}%</b></div>
   <div class="statRow"><span>🍖 HUNGER</span><b>${spr.stats.hunger}%</b></div>
   <div class="statRow"><span>⚡ ENERGY</span><b>${spr.stats.energy}%</b></div>
   <div class="statRow"><span>💨 SPEED</span><b>${spr.stats.speed}</b></div>
   <div class="statRow"><span>💼 JOB</span><b>${spr.stats.job}</b></div>
   <div class="statRow"><span>💭 MOOD</span><b>${spr.stats.mood}</b></div>
   <div class="statRow"><span>☠️ KILLS</span><b>${spr.stats.kills}</b></div>
   <div class="statRow"><span>📍 POS</span><b>${Math.round(spr.x)},${Math.round(spr.y)}</b></div>
   <div class="statRow"><span>🕒 BORN</span><b>${spr.stats.born}</b></div>
  `;
  document.getElementById('statWin').classList.add('open');
 }

 update(){
  if(isShopOpen) return;
  this.ents.forEach(e=>{ e.x+=e.vx; e.y+=e.vy; if(e.x<this.bounds.x||e.x>this.bounds.x+this.bounds.w) e.vx*=-1; if(e.y<this.bounds.y||e.y>this.bounds.y+this.bounds.h) e.vy*=-1; if(Math.random()<0.03){e.vx+=(Math.random()-0.5)*0.4; e.vy+=(Math.random()-0.5)*0.4;} });
 }
}

function closeStat(){ document.getElementById('statWin').classList.remove('open'); }
function followSelected(){ if(selectedEnt){ window.game.scene.scenes[0].focusOn(selectedEnt); } }

let game=new Phaser.Game({type:Phaser.AUTO, parent:'game', width:innerWidth, height:innerHeight, backgroundColor:'#0f0f0f', scene:WorldV60, scale:{mode:Phaser.Scale.RESIZE}});
window.game=game;
</script></body></html>
