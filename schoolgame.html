<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>READYPH School</title>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/nipplejs@0.9.0/dist/nipplejs.min.js"></script>
<style>
 body{margin:0;background:#2d5a27;overflow:hidden;touch-action:none}
 #joystick{position:fixed;left:10px;bottom:10px;width:120px;height:120px;z-index:10}
 #btnA{position:fixed;right:20px;bottom:80px;width:80px;height:80px;background:#4caf50;border-radius:50%;border:4px solid white;color:white;font-weight:bold;font-size:22px;z-index:10}
 #btnB{position:fixed;right:110px;bottom:20px;width:60px;height:60px;background:#ff9800;border-radius:50%;border:3px solid white;color:white;z-index:10}
 #hud{position:fixed;top:10px;left:10px;color:white;font-family:Arial;background:rgba(0,0,0,0.6);padding:8px 12px;border-radius:8px;z-index:10;font-size:14px}
</style>
</head>
<body>
<div id="hud">Day 1 | 7:00 AM | Energy: 100</div>
<div id="joystick"></div>
<button id="btnA">A</button>
<button id="btnB">RUN</button>
<script>
let player, buildings=[], npcs=[];
let joyData={x:0,y:0};

const config = {
  type: Phaser.AUTO,
  width: window.innerWidth,
  height: window.innerHeight,
  backgroundColor: '#6aa86f',
  physics:{default:'arcade'},
  scene:{
    create: function(){
      // MAP - simple
      this.add.rectangle(1250,1250,2500,2500,0x6aa86f);
      this.add.rectangle(1250,1250,200,2500,0xc2b280);
      this.add.rectangle(1250,1250,2500,200,0xc2b280);

      let main = this.add.rectangle(1250,800,300,200,0x8d6e63).setStrokeStyle(4,0x000000);
      this.add.text(1250,800,'MAIN BUILDING',{color:'#fff',fontSize:'16px'}).setOrigin(0.5);
      main.name='Main'; buildings.push(main);

      let canteen = this.add.rectangle(800,1250,200,200,0xffcc80).setStrokeStyle(4,0x000000);
      this.add.text(800,1250,'CANTEEN',{color:'#000',fontSize:'14px'}).setOrigin(0.5);
      canteen.name='Canteen'; buildings.push(canteen);

      let dorm = this.add.rectangle(1250,1700,250,180,0x90caf9).setStrokeStyle(4,0x000000);
      this.add.text(1250,1700,'DORM',{color:'#000',fontSize:'14px'}).setOrigin(0.5);
      dorm.name='Dorm'; buildings.push(dorm);

      let garden = this.add.rectangle(1700,1250,200,200,0x81c784).setStrokeStyle(4,0x000000);
      this.add.text(1700,1250,'GARDEN',{color:'#000',fontSize:'14px'}).setOrigin(0.5);
      garden.name='Garden'; buildings.push(garden);

      player = this.add.rectangle(1250,1300,24,24,0x1a237e).setStrokeStyle(3,0xffffff);
      this.physics.add.existing(player);
      player.body.setCollideWorldBounds(true);

      let guard = this.add.rectangle(1250,2100,22,22,0xff0000);
      this.add.text(1250,2140,'Manong Guard',{fontSize:'12px',color:'#fff'}).setOrigin(0.5);
      guard.dialog='Welcome sa READYPH!'; npcs.push(guard);

      this.cameras.main.startFollow(player,true,0.1,0.1);
      this.cameras.main.setBounds(0,0,2500,2500);
      this.physics.world.setBounds(0,0,2500,2500);

      this.input.keyboard.on('keydown-E',()=>{ interact() });

      let joy = nipplejs.create({zone:document.getElementById('joystick'),mode:'static',position:{left:'60px',top:'60px'},color:'white'});
      joy.on('move',(e,d)=>{joyData.x=d.vector.x; joyData.y=d.vector.y;});
      joy.on('end',()=>{joyData.x=0; joyData.y=0;});
      document.getElementById('btnA').onclick=()=>{interact();};
    },
    update: function(){
      if(!player) return;
      let speed=200;
      if(document.getElementById('btnB').matches(':active') || this.input.keyboard.addKey('SHIFT').isDown) speed=350;
      let cursors = this.input.keyboard.createCursorKeys();
      let vx = (cursors.left.isDown?-1:cursors.right.isDown?1:joyData.x)*speed;
      let vy = (cursors.up.isDown?-1:cursors.down.isDown?1:joyData.y)*-speed;
      player.body.setVelocity(vx,vy);
    }
  }
};

function interact(){
  for(let b of buildings){
    if(Phaser.Math.Distance.Between(player.x,player.y,b.x,b.y)<180){
      if(b.name==='Dorm'){alert('Zzz... Tulog ka. Day 2 na!');}
      else{alert('Pumasok ka sa '+b.name+'!');}
      return;
    }
  }
  for(let n of npcs){
    if(Phaser.Math.Distance.Between(player.x,player.y,n.x,n.y)<120){alert(n.dialog); return;}
  }
  alert('Hanap ka ng building na malapit!');
}

new Phaser.Game(config);
</script>
</body>
</html>
