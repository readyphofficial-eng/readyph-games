<!DOCTYPE html><html><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>READYPH OPEN WORLD V43</title>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/nipplejs@0.9.0/dist/nipplejs.min.js"></script>
<style>
html,body{margin:0;padding:0;background:#8abf6a;overflow:hidden;height:100%;touch-action:none;font-family:Arial}
#game{position:fixed;inset:0}
#joy{position:fixed;left:12px;bottom:18px;width:120px;height:120px;background:rgba(255,255,255,.4);border-radius:50%;border:2px solid #fff;z-index:50}
#hud{position:fixed;top:0;left:0;right:0;background:rgba(0,0,0,.85);color:#fff;padding:8px 12px;display:flex;justify-content:space-between;z-index:40;font-size:11px;font-weight:800}
#mini{position:fixed;right:8px;top:45px;width:90px;height:90px;background:rgba(0,0,0,.6);border:2px solid #fff;border-radius:8px;z-index:40}
</style>
</head><body>
<div id="game"></div>
<div id="hud"><span>OPEN WORLD V43 - REAL CITY</span><span id="info">Loading...</span></div>
<div id="joy"></div>
<canvas id="mini"></canvas>
<script>
let joy={x:0,y:0}, game;

const BUILDINGS=["low-detail-building-a","low-detail-building-b","low-detail-building-c","low-detail-building-d","low-detail-building-e","low-detail-building-f","low-detail-building-g","low-detail-building-h","low-detail-building-i","low-detail-building-j","low-detail-building-k","low-detail-building-l","low-detail-building-m","low-detail-building-n","low-detail-building-wide-a","low-detail-building-wide-b"];
const TREES=["tree-small","tree-small","tree","tree","tree-large"];

class OpenWorld extends Phaser.Scene{
 constructor(){super('OpenWorld')}
 preload(){
  let b='clean/';
  BUILDINGS.forEach(k=>this.load.image(k,b+k+'.png'));
  TREES.forEach((k,i)=>{ if(i<3) this.load.image(k,b+k+'.png'); });
  this.load.image('ground',b+'ground.png');
  this.load.image('road',b+'road.png');
  this.load.image('road-corner',b+'road-corner.png');
  this.load.image('fence',b+'fence.png');
 }

 create(){
  const W=7000,H=7000, BLOCK=640, ROAD_W=100;

  // Ground
  this.add.rectangle(W/2,H/2,W,H,0x8abf6a).setDepth(0);
  if(this.textures.exists('ground')){
   for(let y=0;y<H;y+=256){ for(let x=0;x<W;x+=256){ this.add.image(x,y,'ground').setDepth(0).setScale(0.9).setAlpha(0.35); } }
  }

  // Realistic roads - grid ng city blocks
  let roads=[];
  for(let x=0;x<=W;x+=BLOCK+ROAD_W){
   this.add.rectangle(x, H/2, ROAD_W, H, 0x5a5a5a).setDepth(1);
   if(this.textures.exists('road')){
    for(let y=0;y<H;y+=128){ this.add.image(x,y,'road').setDepth(2).setScale(1.2,1).setAlpha(0.95); }
   }
  }
  for(let y=0;y<=H;y+=BLOCK+ROAD_W){
   this.add.rectangle(W/2, y, W, ROAD_W, 0x5a5a5a).setDepth(1);
   if(this.textures.exists('road')){
    for(let x=0;x<W;x+=128){ this.add.image(x,y,'road').setDepth(2).setScale(1.2,1).setAngle(90).setAlpha(0.95); }
   }
  }

  // Buildings - REAL CITY LAYOUT, hindi random!
  // Bawat block, 2-4 buildings na naka-align sa loob, hindi sa kalsada
  let bCount=0;
  let blockX=0, blockY=0;
  for(let by=ROAD_W+50; by<H-BLOCK; by+=BLOCK+ROAD_W){
   for(let bx=ROAD_W+50; bx<W-BLOCK; bx+=BLOCK+ROAD_W){
    // Bawat block - gumawa ng 3-4 buildings sa loob
    let numB=Phaser.Math.Between(2,4);
    let usedInBlock=[];
    for(let n=0;n<numB;n++){
     let key=BUILDINGS[Phaser.Math.Between(0,BUILDINGS.length-1)];
     if(!this.textures.exists(key)) continue;
     // Position sa loob ng block, may margin sa road
     let margin=110;
     let x=bx + margin + Phaser.Math.Between(0, BLOCK-margin*2-120);
     let y=by + margin + Phaser.Math.Between(0, BLOCK-margin*2-120);
     // Iwas dikit dikit
     let tooClose=false;
     for(let u of usedInBlock){ if(Phaser.Math.Distance.Between(x,y,u[0],u[1])<140) tooClose=true; }
     if(tooClose) continue;

     let img=this.add.image(x,y,key).setDepth(5);
     // REALISTIC SIZE FIX - yung low-detail buildings mo mga 200-300px original, gawin 110-150px lang sa screen!
     let targetH=Phaser.Math.Between(110,150); // realistic height
     let sc=targetH / img.height;
     // wide buildings mas malapad
     if(key.includes('wide')) sc*=0.9;
     img.setScale(sc);
     img.setOrigin(0.5,0.85); // para nasa lupa yung paa, hindi lumulutang
     usedInBlock.push([x,y]);
     bCount++;
    }
    // Dagdag puno sa block - sa gilid
    if(this.textures.exists('tree-small')){
     for(let t=0;t<2;t++){
      let tx=bx + Phaser.Math.Between(30, BLOCK-30);
      let ty=by + BLOCK - Phaser.Math.Between(20,60);
      let tree=this.add.image(tx,ty,'tree-small').setDepth(6);
      tree.setScale(0.45); // realistic tree size - maliit lang vs building!
      tree.setOrigin(0.5,0.9);
     }
    }
   }
  }

  // Camera - start sa gitna ng city
  this.cameras.main.setBounds(0,0,W,H);
  this.cameras.main.centerOn(W/2,H/2);
  this.cameras.main.setZoom(0.85);

  this.keys=this.input.keyboard.addKeys('W,A,S,D');
  this.W=W; this.H=H;
  document.getElementById('info').innerText=bCount+' buildings | City Blocks: '+Math.floor(W/(BLOCK+ROAD_W))+'x'+Math.floor(H/(BLOCK+ROAD_W))+' | Real sizes';

  // Drag pan
  this.input.on('pointermove', (p)=>{
   if(p.isDown && p.prevPosition){
    this.cameras.main.scrollX -= (p.x - p.prevPosition.x) / this.cameras.main.zoom;
    this.cameras.main.scrollY -= (p.y - p.prevPosition.y) / this.cameras.main.zoom;
   }
  });
  this.zoom=0.85;
 }

 update(){
  let sp=22, mx=joy.x, my=joy.y;
  if(this.keys.A.isDown) mx=-1; if(this.keys.D.isDown) mx=1;
  if(this.keys.W.isDown) my=-1; if(this.keys.S.isDown) my=1;
  if(Math.abs(mx)<0.1) mx=0; if(Math.abs(my)<0.1) my=0;
  if(mx||my){
   this.cameras.main.scrollX += mx*sp;
   this.cameras.main.scrollY += my*sp;
  }
  // Clamp
  this.cameras.main.scrollX=Phaser.Math.Clamp(this.cameras.main.scrollX,0,this.W-innerWidth/this.zoom);
  this.cameras.main.scrollY=Phaser.Math.Clamp(this.cameras.main.scrollY,0,this.H-innerHeight/this.zoom);
 }
}
game=new Phaser.Game({type:Phaser.AUTO,parent:'game',width:innerWidth,height:innerHeight,backgroundColor:'#8abf6a',scene:OpenWorld,scale:{mode:Phaser.Scale.RESIZE}});
let stick=nipplejs.create({zone:document.getElementById('joy'),mode:'static',position:{left:'60px',top:'60px'},color:'white',size:90});
stick.on('move',(e,d)=>{if(d&&d.vector){joy.x=d.vector.x; joy.y=-d.vector.y;}});
stick.on('end',()=>{joy.x=0;joy.y=0;});
</script></body></html>
