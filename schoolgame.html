<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>READYPH V4.4 ULTRA FIX</title>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/nipplejs@0.9.0/dist/nipplejs.min.js"></script>
<style>
 body{margin:0;background:#000;overflow:hidden;font-family:Arial;touch-action:none}
 #joy{position:fixed;left:10px;bottom:10px;width:130px;height:130px;z-index:99;background:rgba(255,255,255,0.15);border-radius:50%;border:2px solid #fff}
 #btnA{position:fixed;right:20px;bottom:90px;width:80px;height:80px;background:#22c55e;border-radius:50%;border:3px solid #fff;color:#fff;font-weight:900;font-size:22px;z-index:99}
 #hud{position:fixed;top:0;left:0;right:0;background:#000;color:#fff;padding:10px;display:flex;justify-content:space-between;z-index:99;font-size:13px}
 #dialog{position:fixed;bottom:0;left:0;right:0;background:#111;border-top:4px solid #22c55e;padding:16px;color:#fff;display:none;z-index:99}
 #quiz{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:#fff;padding:20px;border-radius:16px;width:88%;max-width:360px;display:none;z-index:100;color:#000}
</style>
</head>
<body>
<div id="hud"><span id="score">Score:0</span><span id="pos">X:0 Y:0</span><span id="joyD">JOY:0,0</span></div>
<div id="joy"></div><button id="btnA">A</button>
<div id="dialog"><b id="dName"></b><p id="dText"></p></div>
<div id="quiz"><b id="qProg"></b><h3 id="qText"></h3><div id="qOpts"></div></div>

<script>
let joy={x:0,y:0}, score=0, day=1, energy=100, currentScene='out';
let saved=JSON.parse(localStorage.getItem('readyph_v4')||'{"score":0}'); score=saved.score||0;

const qBank=[
 {q:"She ___ to school every day.", opts:["go","goes","going"], ans:1},{q:"I have ___ finished.", opts:["already","yet","ever"], ans:0},{q:"Could you ___ me?", opts:["help","helps","helped"], ans:0},{q:"Synonym of happy?", opts:["sad","joyful","angry"], ans:1},{q:"Plural of child?", opts:["childs","children","childes"], ans:1}
];

class Game extends Phaser.Scene{
 constructor(){super('Game')}
 create(){
  // MAP
  this.add.rectangle(1250,1250,2500,2500,0x6dbf5a);
  this.add.rectangle(1250,1250,2500,160,0xe8dcc3);
  this.add.rectangle(1250,1250,160,2500,0xe8dcc3);
  
  // BUILDINGS - SIMPLE
  this.main = this.add.rectangle(1250,800,340,240,0x9c7c62).setStrokeStyle(5,0xffff00);
  this.add.text(1250,770,'MAIN BUILDING - PRESS A',{color:'#fff',fontSize:'16px'}).setOrigin(0.5);
  this.add.text(1250,800,'TO ENTER',{color:'#ff0',fontSize:'14px'}).setOrigin(0.5);

  this.canteen = this.add.rectangle(750,1250,200,200,0xffd99a).setStrokeStyle(4,0x000);
  this.add.text(750,1250,'CANTEEN').setOrigin(0.5);

  // PLAYER - SIMPLE CIRCLE LANG MUNA, WALANG PHYSICS
  this.player = this.add.circle(1250,1150,18,0x1e3a8a).setStrokeStyle(3,0xffffff);
  this.player.setDepth(10);
  
  // CAMERA FOLLOW MANUAL
  this.cameras.main.setBounds(0,0,2500,2500);
  this.cameras.main.startFollow(this.player,true,0.1,0.1);

  this.keys = this.input.keyboard.addKeys('W,A,S,D');

  // TEACHER SA LOOB
  this.teacher = this.add.rectangle(400,400,30,40,0x00ff00).setVisible(false);
  this.add.text(400,400,'TEACHER').setOrigin(0.5).setVisible(false);

  this.isIndoor = false;
  document.getElementById('score').innerText = `Score:${score}`;
 }

 update(){
  if(document.getElementById('dialog').style.display==='block'||document.getElementById('quiz').style.display==='block') return;

  let speed = 6;
  let mx = 0, my = 0;

  // KEYBOARD
  if(this.keys.A.isDown) mx = -1;
  else if(this.keys.D.isDown) mx = 1;
  else mx = joy.x;

  if(this.keys.W.isDown) my = -1;
  else if(this.keys.S.isDown) my = 1;
  else my = joy.y;

  // DIRECT MOVE - WALANG PHYSICS, DIRETSO X/Y
  if(Math.abs(mx) > 0.05 || Math.abs(my) > 0.05){
   this.player.x += mx * speed;
   this.player.y += my * speed;
  }

  // BOUNDARY
  this.player.x = Phaser.Math.Clamp(this.player.x, 0, 2500);
  this.player.y = Phaser.Math.Clamp(this.player.y, 0, 2500);

  // UPDATE HUD
  document.getElementById('pos').innerText = `X:${Math.floor(this.player.x)} Y:${Math.floor(this.player.y)}`;
  document.getElementById('joyD').innerText = `JOY:${joy.x.toFixed(1)},${joy.y.toFixed(1)}`;

  // CHECK DISTANCE TO BUILDINGS
  let dMain = Phaser.Math.Distance.Between(this.player.x,this.player.y,1250,800);
  if(dMain < 200 && !this.isIndoor){
   this.main.setStrokeStyle(6,0x00ff00);
  } else {
   this.main.setStrokeStyle(5,0xffff00);
  }
 }
}

const game = new Phaser.Game({width:innerWidth,height:innerHeight,backgroundColor:'#6dbf5a',scene:Game});

function doInteract(){
 let sc = game.scene.getScene('Game');
 let dMain = Phaser.Math.Distance.Between(sc.player.x, sc.player.y, 1250,800);
 let dCan = Phaser.Math.Distance.Between(sc.player.x, sc.player.y, 750,1250);

 if(dMain < 250){
  if(!sc.isIndoor){
   // PUMASOK SA LOOB
   sc.isIndoor = true;
   sc.player.x = 400; sc.player.y = 500;
   sc.main.setVisible(false);
   sc.canteen.setVisible(false);
   // Gawing classroom background
   sc.cameras.main.setBackgroundColor('#f5f5dc');
   document.getElementById('dialog').style.display='block';
   document.getElementById('dName').innerText='Ms. ReadyPH';
   document.getElementById('dText').innerText='Welcome! Press A ulit para mag quiz! 20 questions, +50 per correct!';
  } else {
   // QUIZ
   startQuiz();
  }
 } else if(dCan < 150){
  energy=100; document.getElementById('dialog').style.display='block'; document.getElementById('dName').innerText='Canteen'; document.getElementById('dText').innerText='Busog! Energy full!';
 } else {
  // LABAS NG CLASSROOM
  if(sc.isIndoor){
   sc.isIndoor=false;
   sc.player.x=1250; sc.player.y=1150;
   sc.main.setVisible(true); sc.canteen.setVisible(true);
   sc.cameras.main.setBackgroundColor('#6dbf5a');
   document.getElementById('dialog').style.display='none';
  }
 }
}

function startQuiz(){
 let q = qBank[Math.floor(Math.random()*qBank.length)];
 document.getElementById('qProg').innerText=`Score:${score}`;
 document.getElementById('qText').innerText=q.q;
 let box=document.getElementById('qOpts'); box.innerHTML='';
 q.opts.forEach((o,i)=>{
  let b=document.createElement('button'); b.style='width:100%;padding:12px;margin:5px 0;border-radius:8px;border:2px solid #000;background:#fff;font-weight:bold'; b.innerText=o;
  b.onclick=()=>{ if(i===q.ans){score+=50; alert('CORRECT +50!');} else {alert('MALI, tama: '+q.opts[q.ans]);} localStorage.setItem('readyph_v4',JSON.stringify({score})); document.getElementById('score').innerText=`Score:${score}`; document.getElementById('quiz').style.display='none'; };
  box.appendChild(b);
 });
 document.getElementById('quiz').style.display='block';
}

// JOYSTICK - SIMPLEST POSSIBLE
let mgr = nipplejs.create({zone:document.getElementById('joy'), mode:'static', position:{left:'65px',top:'65px'}, color:'white', size:90});
mgr.on('move', (e,d)=>{ if(d&&d.vector){ joy.x=d.vector.x; joy.y=-d.vector.y; }});
mgr.on('end', ()=>{ joy.x=0; joy.y=0; });

document.getElementById('btnA').onclick=doInteract;
document.getElementById('dialog').onclick=()=>{document.getElementById('dialog').style.display='none';};
</script>
</body>
</html>
