<!DOCTYPE html><html><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>V33 FIXED - MEGA CITY</title>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/nipplejs@0.9.0/dist/nipplejs.min.js"></script>
<style>html,body{margin:0;background:#6ebf6b;overflow:hidden;height:100%;touch-action:none}#game{position:fixed;inset:0}#joy{position:fixed;left:12px;bottom:18px;width:120px;height:120px;background:rgba(255,255,255,.35);border-radius:50%;border:2px solid #fff;z-index:50}#btnA{position:fixed;right:14px;bottom:22px;width:86px;height:86px;background:#22c55e;border-radius:50%;border:3px solid #fff;color:#fff;font-weight:900;z-index:50}#hud{position:fixed;top:0;left:0;right:0;background:#000c;color:#fff;padding:8px 12px;display:flex;justify-content:space-between;z-index:40;font-size:11px;font-weight:800}#dialog{position:fixed;bottom:0;left:0;right:0;background:#0f172aee;border-top:4px solid #22c55e;padding:12px;color:#fff;display:none;z-index:60}</style>
</head><body>
<div id="game"></div>
<div id="hud"><span>V33 FIXED MEGA CITY</span><span id="info">Loading...</span></div>
<div id="joy"></div><button id="btnA">ENTER</button>
<div id="dialog"><b id="dN" style="color:#4ade80"></b><p id="dT"></p><div id="dBtns"></div></div>
<script>
let joy={x:0,y:0};
class Main extends Phaser.Scene{
 constructor(){super('Main')}
 preload(){
  // EXACT file names mo - case sensitive!
  this.load.image('map','MAP.png');
  this.load.image('player','player.png');
  this.load.image('new1','new1.png');
  this.load.image('new2','new2.png');
  this.load.image('new3','new3.png');
 }
 create(){
  const W=3200,H=3200;
  // MAP - lagay agad, walang resize masyado para magaan
  let bg=this.add.image(W/2,H/2,'map').setDepth(0);
  bg.setDisplaySize(W,H);
  if(!this.textures.exists('map')){ this.add.rectangle(W/2,H/2,W,H,0x7ab86f); }

  this.builds=[]; this.npcs=[];

  // GAMIT setCrop - MAS MAGAAN, WALANG GREEN BLOCKS!
  const addBuilding=(sheet,cols,rows,col,row,wx,wy)=>{
   let tex=this.textures.get(sheet).getSourceImage();
   let fw=tex.width/cols, fh=tex.height/rows;
   // hindi na createCanvas, crop lang!
   let img=this.add.image(wx,wy,sheet).setDepth(3);
   img.setCrop(col*fw,row*fh,fw,fh);
   // size adjust - base sa MAP 3200
   let target=92+Math.random()*16;
   let sc=target/Math.max(fw,fh)*1.4;
   img.setScale(sc);
   // invisible wall
   this.builds.push({x:wx,y:wy,radius:46*sc+20});
   return img;
  };
  const addPerson=(sheet,cols,rows,col,row,wx,wy)=>{
   let tex=this.textures.get(sheet).getSourceImage();
   let fw=tex.width/cols, fh=tex.height/rows;
   let img=this.add.image(wx,wy,sheet).setDepth(5);
   img.setCrop(col*fw,row*fh,fw,fh);
   let sc=36/Math.max(fw,fh);
   img.setScale(sc);
   img.dirX=(Math.random()-0.5); img.dirY=(Math.random()-0.5);
   img.speed=0.5+Math.random()*0.6; img.t=Math.random()*2000;
   this.npcs.push(img);
   return img;
  };

  // VACANT LOTS - brown fence sa MAP mo
  let lots=[
   [560,620],[820,620],[1080,740],[1330,860],[1580,860],
   [560,880],[820,880],[1080,880],[1340,1040],[1580,1040],
   [560,1140],[820,1140],[1080,1140],[2000,860],[2240,860],
   [560,1400],[820,1400],[1080,1400],[2000,1020],[2240,1020],
   [560,1540],[820,1540],[2000,1160],[2240,1160],[2640,860],
   [1100,1680],[1350,1680],[2000,1440],[2240,1440],[2640,1020],
   [1100,1940],[1350,1940],[1600,1940],[2000,1680],[2240,1680],
   [2640,1160],[1100,2200],[1350,2200],[2000,1940],[2240,1940],
   [560,2600],[820,2600],[1080,2600],[2000,2200],[2240,2200]
  ];

  let idx=0;
  for(let r=0;r<5;r++) for(let c=0;c<5;c++){ if(idx>=lots.length) break; let p=lots[idx++]; addBuilding('new1',5,7,c,r,p[0],p[1]); }
  for(let r=0;r<5;r++) for(let c=0;c<5;c++){ if(idx>=lots.length) break; let p=lots[idx++]; addBuilding('new2',5,9,c,r,p[0],p[1]); }
  for(let r=0;r<5;r++) for(let c=0;c<5;c++){ if(idx>=lots.length) break; let p=lots[idx++]; addBuilding('new3',5,7,c,r,p[0],p[1]); }

  let spots=[[600,500],[900,500],[1200,500],[1500,500],[1800,500],[2100,500],[2600,500],[600,2000],[900,2000],[1200,2000],[1500,2000],[2000,2800],[2400,2800],[500,1200],[1000,1200],[1600,1200],[2200,1200],[500,1600],[1000,1600],[2000,1600],[500,2400],[1000,2400],[1600,2400],[2200,2400],[2800,2400]];
  let pi=0;
  // skip yung boy na ginawang player (new3 r5 c1)
  for(let r=5;r<7;r++) for(let c=0;c<5;c++){ if(pi>=spots.length) break; if(r==5&&c==1) continue; let p=spots[pi++]; addPerson('new3',5,7,c,r,p[0],p[1]); }
  for(let r=5;r<7;r++) for(let c=0;c<5;c++){ if(pi>=spots.length) break; let p=spots[pi++]; addPerson('new1',5,7,c,r,p[0],p[1]); }
  for(let r=5;r<9;r++) for(let c=0;c<5;c++){ if(pi>=spots.length) break; let p=spots[pi++]; addPerson('new2',5,9,c,r,p[0],p[1]); }

  // PLAYER - player.png mo!
  this.player=this.add.image(1600,1350,'player').setDepth(20).setScale(0.9);
  this.player.setOrigin(0.5,0.85);

  this.cameras.main.setBounds(0,0,W,H);
  this.cameras.main.startFollow(this.player,true,0.12,0.12);
  this.keys=this.input.keyboard.addKeys('W,A,S,D');
  document.getElementById('info').innerText='Buildings:'+this.builds.length+' | Tao:'+this.npcs.length+' | FIXED';
 }
 isBlocked(x,y){ for(let b of this.builds){ if(Phaser.Math.Distance.Between(x,y,b.x,b.y)<b.radius) return true; } return false; }
 update(t,dt){
  if(document.getElementById('dialog').style.display==='block') return;
  let sp=4.7,mx=joy.x,my=joy.y;
  if(this.keys.A.isDown) mx=-1; if(this.keys.D.isDown) mx=1; if(this.keys.W.isDown) my=-1; if(this.keys.S.isDown) my=1;
  if(Math.abs(mx)<0.15) mx=0; if(Math.abs(my)<0.15) my=0;
  if(mx||my){
   let nx=this.player.x+mx*sp, ny=this.player.y+my*sp;
   if(!this.isBlocked(nx,ny)&&nx>30&&nx<3170&&ny>30&&ny<3170){
    this.player.x=nx; this.player.y=ny;
    if(mx!==0) this.player.setFlipX(mx<0);
   }
  }
  this.npcs.forEach(n=>{
   n.t+=dt;
   if(n.t>2000){ n.dirX=(Math.random()-0.5); n.dirY=(Math.random()-0.5); n.t=0; }
   let nx=n.x+n.dirX*n.speed, ny=n.y+n.dirY*n.speed;
   if(this.isBlocked(nx,ny)||nx<20||nx>3180||ny<20||ny>3180){ n.dirX*=-1; n.dirY*=-1; return; }
   n.x=nx; n.y=ny;
  });
 }
}
new Phaser.Game({type:Phaser.AUTO,parent:'game',width:innerWidth,height:innerHeight,backgroundColor:'#7ab86f',scene:Main,scale:{mode:Phaser.Scale.RESIZE}});
let stick=nipplejs.create({zone:document.getElementById('joy'),mode:'static',position:{left:'60px',top:'60px'},color:'white',size:84});
stick.on('move',(e,d)=>{if(d&&d.vector){joy.x=d.vector.x;joy.y=-d.vector.y;}});
stick.on('end',()=>{joy.x=0;joy.y=0;});
document.getElementById('btnA').onclick=()=>{
 let sc=game.scene.scenes[0]; let dlg=document.getElementById('dialog');
 document.getElementById('dN').innerText='V33 Fixed!';
 document.getElementById('dT').innerText='Na-fix na!\n• MAP.png dapat 3200x3200 - kita na dapat\n• No more green blocks - setCrop gamit hindi canvas\n• player.png = boy backpack from new3\n• Buildings nasa vacant lots + invisible wall';
 document.getElementById('dBtns').innerHTML='<button onclick="document.getElementById(\'dialog\').style.display=\'none\'" style="padding:10px 18px;background:#22c55e;color:#fff;border-radius:10px;border:2px solid #fff">OK</button>';
 dlg.style.display='block';
};
let game;
setTimeout(()=>{ game=game||new Phaser.Game({type:Phaser.AUTO,parent:'game',width:innerWidth,height:innerHeight,backgroundColor:'#7ab86f',scene:Main,scale:{mode:Phaser.Scale.RESIZE}}); },100);
</script></body></html>
