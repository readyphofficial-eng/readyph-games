<!DOCTYPE html><html><head>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ReadyPH V13 WALK + INTERIOR</title>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/nipplejs@0.9.0/dist/nipplejs.min.js"></script>
<style>html,body{margin:0;padding:0;background:#6dbf67;overflow:hidden;height:100%;font-family:Arial;touch-action:none}
#game{position:fixed;top:0;left:0;width:100%;height:100%;z-index:1}
#joy{position:fixed;left:12px;bottom:18px;width:125px;height:125px;z-index:50;background:rgba(255,255,255,.28);border-radius:50%;border:2px solid #fff}
#btnA{position:fixed;right:16px;bottom:28px;width:88px;height:88px;background:#22c55e;border-radius:50%;border:3px solid #fff;color:#fff;font-weight:900;font-size:20px;z-index:50}
#btnB{position:fixed;right:16px;bottom:125px;width:68px;height:68px;background:#ef4444;border-radius:50%;border:3px solid #fff;color:#fff;font-weight:900;font-size:14px;z-index:50;display:none}
#hud{position:fixed;top:0;left:0;right:0;background:#000000cc;color:#fff;padding:10px 12px;display:flex;justify-content:space-between;z-index:40;font-size:11px;font-weight:800}
#dialog{position:fixed;bottom:0;left:0;right:0;background:#0f172a;border-top:4px solid #22c55e;padding:18px;color:#fff;display:none;z-index:60}
#interior{position:fixed;top:0;left:0;right:0;bottom:0;background:#000;z-index:100;display:none;justify-content:center;align-items:center;flex-direction:column}
#interior img{max-width:92%;max-height:72%;border:4px solid #fff;border-radius:12px}
#interiorTxt{color:#fff;margin-top:12px;font-weight:800;text-align:center;padding:0 20px}</style>
</head><body>
<div id="game"></div>
<div id="hud"><span>V13 WALK+INTERIOR</span><span id="score">Score:0 | Inside: OUTSIDE</span></div>
<div id="joy"></div><button id="btnA">ENTER</button><button id="btnB">EXIT</button>
<div id="dialog"><b id="dN" style="color:#4ade80"></b><p id="dT" style="white-space:pre-line"></p></div>
<div id="interior"><img id="intImg"><div id="interiorTxt"></div><button onclick="exitInterior()" style="margin-top:15px;padding:12px 28px;background:#ef4444;color:#fff;border:3px solid #fff;border-radius:30px;font-weight:900">EXIT BUILDING [B]</button></div>
<script>
let joy={x:0,y:0},score=0,game,inside=null;
function clean(cv){let c=cv.getContext('2d'),d=c.getImageData(0,0,cv.width,cv.height);for(let i=0;i<d.data.length;i+=4){let r=d.data[i],g=d.data[i+1],b=d.data[i+2];if((r>230&&g>230&&b>230)||(r>185&&g>185&&b>185&&Math.abs(r-g)<12))d.data[i+3]=0;}c.putImageData(d,0,0);}
class Main extends Phaser.Scene{
 constructor(){super('Game')}
 preload(){
  this.load.image('buildings','assets/kenney/MEGA_CLEAN.png');
  this.load.image('ground','assets/kenney/GRASS_ROAD.png');
  this.load.image('chars','assets/kenney/CHARS.png');
  this.load.image('interiors','assets/kenney/INTERIORS.png');
 }
 create(){
  let gImg=this.textures.get('ground').getSourceImage(); let gw=gImg.width/4,gh=gImg.height/2,inset=5;
  let mk=(k,c,r)=>{let cv=document.createElement('canvas');cv.width=gw-inset*2;cv.height=gh-inset*2;cv.getContext('2d').drawImage(gImg,c*gw+inset,r*gh+inset,gw-inset*2,gh-inset*2,0,0,gw-inset*2,gh-inset*2);if(this.textures.exists(k))this.textures.remove(k);this.textures.addCanvas(k,cv);};
  mk('g1',0,0); mk('g2',1,0); mk('r_h',0,1); mk('r_v',1,1); mk('r_x',2,1);
  for(let x=0;x<3000;x+=64) for(let y=0;y<3000;y+=64) this.add.image(x+32,y+32,Math.random()<0.8?'g1':'g2').setDisplaySize(64,64).setDepth(0);
  for(let x=0;x<3000;x+=64) this.add.image(x+32,1250,'r_h').setDisplaySize(64,64).setDepth(1);
  for(let y=0;y<3000;y+=64) this.add.image(1250,y+32,'r_v').setDisplaySize(64,64).setDepth(1);
  this.add.image(1250,1250,'r_x').setDisplaySize(64,64).setDepth(2);

  let bImg=this.textures.get('buildings').getSourceImage(),bw=bImg.width/4,bh=bImg.height/2;
  let mkB=(k,c,r)=>{let cv=document.createElement('canvas');cv.width=bw;cv.height=bh;cv.getContext('2d').drawImage(bImg,c*bw,r*bh,bw,bh,0,0,bw,bh);clean(cv);if(this.textures.exists(k))this.textures.remove(k);this.textures.addCanvas(k,cv);};
  mkB('school',0,0); mkB('office',1,0); mkB('canteen',2,0); mkB('library',3,0); mkB('gym',0,1); mkB('dorm',1,1); mkB('hospital',2,1); mkB('shop',3,1);
  this.builds=[]; let place=(x,y,k,n,intIdx)=>{this.add.ellipse(x,y+48,80,22,0x000000).setAlpha(0.18).setDepth(1);this.add.image(x,y,k).setDisplaySize(96,96).setDepth(3);this.add.text(x,y+60,n,{fontSize:'9px',backgroundColor:'#000c',color:'#fff',padding:{x:5,y:2}}).setOrigin(0.5).setDepth(4);this.builds.push({x,y,name:n,intIdx});};
  place(1450,900,'school','SCHOOL',0); place(1750,900,'office','OFFICE',1); place(900,1450,'canteen','CANTEEN',2); place(1750,1450,'library','LIBRARY',3); place(900,900,'gym','GYM',0); place(1450,1900,'dorm','DORM',1); place(2000,1750,'hospital','HOSPITAL',2); place(600,1750,'shop','SHOP',3);

  // NPCs WALKING
  let cImg=this.textures.get('chars').getSourceImage(),charW=cImg.width/6,charH=cImg.height;
  let mkC=(k,i)=>{let cv=document.createElement('canvas');cv.width=charW;cv.height=charH;cv.getContext('2d').drawImage(cImg,i*charW,0,charW,charH,0,0,charW,charH);clean(cv);if(this.textures.exists(k))this.textures.remove(k);this.textures.addCanvas(k,cv);};
  mkC('player',0); mkC('girl',1); mkC('teacher',2); mkC('chef',3); mkC('janitor',4); mkC('nurse',5);
  this.npcs=[];
  let roles=[{k:'teacher',name:'Teacher',speed:0.7},{k:'chef',name:'Chef',speed:0.6},{k:'girl',name:'Student',speed:1.2},{k:'nurse',name:'Nurse',speed:0.8},{k:'janitor',name:'Janitor',speed:0.5}];
  roles.forEach((r,i)=>{
   let x=900+Math.random()*1100, y=900+Math.random()*900;
   let sp=this.add.image(x,y,r.k).setDisplaySize(34,34).setDepth(4);
   sp.role=r.name; sp.speed=r.speed; sp.dirX=(Math.random()-0.5)*2; sp.dirY=(Math.random()-0.5)*2; sp.walkTime=0;
   this.npcs.push(sp);
  });

  // Interiors textures
  let intImg=this.textures.get('interiors').getSourceImage(); let iw=intImg.width/2, ih=intImg.height/2;
  ['int_school','int_office','int_canteen','int_library'].forEach((k,idx)=>{
   let c=idx%2, r=Math.floor(idx/2);
   let cv=document.createElement('canvas'); cv.width=iw; cv.height=ih;
   cv.getContext('2d').drawImage(intImg,c*iw,r*ih,iw,ih,0,0,iw,ih);
   if(this.textures.exists(k)) this.textures.remove(k); this.textures.addCanvas(k,cv);
  });

  this.player=this.add.image(1500,1080,'player').setDisplaySize(38,38).setDepth(10);
  this.cameras.main.setBounds(0,0,3000,3000); this.cameras.main.startFollow(this.player,true,0.14,0.14);
  this.keys=this.input.keyboard.addKeys('W,A,S,D,ENTER,ESC,B');
 }
 update(time,delta){
  if(inside) return;
  if(document.getElementById('dialog').style.display==='block') return;
  let sp=5,mx=joy.x,my=joy.y;
  if(this.keys.A.isDown) mx=-1; if(this.keys.D.isDown) mx=1; if(this.keys.W.isDown) my=-1; if(this.keys.S.isDown) my=1;
  if(Math.abs(mx)<0.2) mx=0; if(Math.abs(my)<0.2) my=0;
  if(mx||my){ this.player.x+=mx*sp; this.player.y+=my*sp; }
  this.player.x=Phaser.Math.Clamp(this.player.x,30,2970); this.player.y=Phaser.Math.Clamp(this.player.y,30,2970);

  // NPC WALKING LOGIC
  this.npcs.forEach(npc=>{
   npc.walkTime+=delta;
   if(npc.walkTime>2000+Math.random()*3000){ npc.dirX=(Math.random()-0.5)*2; npc.dirY=(Math.random()-0.5)*2; npc.walkTime=0; }
   npc.x+=npc.dirX*npc.speed; npc.y+=npc.dirY*npc.speed;
   // bounce sa buildings at walls
   if(this.builds.some(b=>Phaser.Math.Distance.Between(npc.x,npc.y,b.x,b.y)<90)){ npc.dirX*=-1; npc.dirY*=-1; }
   if(npc.x<100||npc.x>2900) npc.dirX*=-1; if(npc.y<100||npc.y>2900) npc.dirY*=-1;
  });
 }
}
game=new Phaser.Game({type:Phaser.AUTO,parent:'game',width:innerWidth,height:innerHeight,backgroundColor:'#6dbf67',scene:Main,scale:{mode:Phaser.Scale.RESIZE}});
let stick=nipplejs.create({zone:document.getElementById('joy'),mode:'static',position:{left:'62px',top:'62px'},color:'white',size:85});
stick.on('move',(e,d)=>{ if(d&&d.vector){ joy.x=d.vector.x; joy.y=-d.vector.y; } }); stick.on('end',()=>{ joy.x=0; joy.y=0; });
function enterInterior(building){
 inside=building;
 let sc=game.scene.getScene('Game');
 let keys=['int_school','int_office','int_canteen','int_library'];
 let tex=sc.textures.get(keys[building.intIdx]).getSourceImage();
 document.getElementById('intImg').src=tex.src || keys[building.intIdx];
 // Use canvas to dataURL
 let c=document.createElement('canvas'); c.width=tex.width; c.height=tex.height; c.getContext('2d').drawImage(tex,0,0);
 document.getElementById('intImg').src=c.toDataURL();
 document.getElementById('interiorTxt').innerText='You are inside '+building.name+'! Explore the interior! Press EXIT to go outside.';
 document.getElementById('interior').style.display='flex';
 document.getElementById('btnB').style.display='block';
 document.getElementById('score').innerText='Score:'+score+' | Inside: '+building.name;
}
function exitInterior(){
 inside=null; document.getElementById('interior').style.display='none'; document.getElementById('btnB').style.display='none';
 document.getElementById('score').innerText='Score:'+score+' | Inside: OUTSIDE';
}
document.getElementById('btnA').onclick=()=>{
 if(inside){ exitInterior(); return; }
 let sc=game.scene.getScene('Game'); let near=null,npcNear=null;
 for(let n of sc.npcs){ if(Phaser.Math.Distance.Between(sc.player.x,sc.player.y,n.x,n.y)<70){ npcNear=n; break; } }
 if(npcNear){ document.getElementById('dN').innerText=npcNear.role+' (Walking)'; document.getElementById('dT').innerText='Hi! Naglalakad ako sa school! May pasok ako sa '+sc.builds[Math.floor(Math.random()*sc.builds.length)].name+'!'; document.getElementById('dialog').style.display='block'; return; }
 for(let b of sc.builds){ if(Phaser.Math.Distance.Between(sc.player.x,sc.player.y,b.x,b.y)<110){ near=b; break; } }
 if(!near){ document.getElementById('dN').innerText='Explore!'; document.getElementById('dT').innerText='Lapit ka sa building at pindot ENTER para pumasok sa loob!\nMay naglalakad na NPCs din!'; document.getElementById('dialog').style.display='block'; return; }
 enterInterior(near); score+=100; document.getElementById('score').innerText='Score:'+score+' | Inside: '+near.name;
};
document.getElementById('btnB').onclick=exitInterior;
document.getElementById('dialog').onclick=()=>document.getElementById('dialog').style.display='none';
window.exitInterior=exitInterior;
</script></body></html>
