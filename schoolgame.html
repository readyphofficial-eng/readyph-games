<!DOCTYPE html><html><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>V53 WORLDBOX - NO PLAYER</title>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/nipplejs@0.9.0/dist/nipplejs.min.js"></script>
<style>
html,body{margin:0;padding:0;background:#2e2e2e;overflow:hidden;height:100%;touch-action:none}
#game{position:fixed;inset:0;image-rendering:-webkit-optimize-contrast;image-rendering:crisp-edges}
#joy{position:fixed;left:12px;bottom:18px;width:110px;height:110px;background:rgba(255,255,255,.2);border-radius:50%;border:2px solid #fff;z-index:50}
#hud{position:fixed;top:0;left:0;right:0;background:rgba(0,0,0,.75);color:#fff;padding:6px 10px;font-size:10px;font-weight:800;z-index:40;display:flex;justify-content:space-between}
</style>
</head><body>
<div id="game"></div>
<div id="hud"><span>WORLDBOX TRIANGLE - NO PLAYER - PURE MAP</span><span id="info">Drag to pan | Pinch/Wheel to zoom | Joystick</span></div>
<div id="joy"></div>
<script>
let joy={x:0,y:0};

class WorldBox extends Phaser.Scene{
 constructor(){super('WorldBox')}
 preload(){
  // 4K map mo - upload mo yung image as map-triangle-4k.png
  this.load.image('island4k', 'clean/map-triangle-4k.png');
  // fallback old
  this.load.image('island', 'clean/map-triangle.png');
 }
 create(){
  const W=3000,H=3000;
  this.W=W; this.H=H;
  
  this.add.rectangle(W/2,H/2,W,H,0x2e2e2e).setDepth(0);

  let mapKey=null;
  if(this.textures.exists('island4k')) mapKey='island4k';
  else if(this.textures.exists('island')) mapKey='island';
  
  if(mapKey){
   let island=this.add.image(W/2,H/2,mapKey).setDepth(1);
   // HINDI NA ISTRETCH NG SOBRA - exact size para hindi blurry!
   // Kunin natural size, wag palakihan ng 2x
   let tex=this.textures.get(mapKey).getSourceImage();
   let nw=tex.width, nh=tex.height;
   // Max 2800 lang para hindi mag pixelate
   let maxW=2800;
   if(nw>maxW){
    let ratio=maxW/nw;
    island.setDisplaySize(nw*ratio, nh*ratio);
   }else{
    island.setDisplaySize(nw, nh);
   }
   island.setOrigin(0.5,0.5);
   // Crisp - no blur filter
   island.setPipeline('TextureTintPipeline');
  }else{
   this.add.text(W/2,H/2,'UPLOAD map-triangle-4k.png to clean/', {font:'bold 24px Arial',color:'#ff4444',backgroundColor:'#000'}).setDepth(10).setOrigin(0.5);
  }

  // WORLDBOX - WALANG PLAYER! Camera lang gagalaw
  this.cameras.main.setBounds(0,0,W,H);
  this.cameras.main.centerOn(W/2,H/2);
  this.cameras.main.setZoom(0.9); // 0.9 lang simula para buo kita at malinaw

  this.keys=this.input.keyboard.addKeys('W,A,S,D');

  // SMOOTH DRAG PAN - parang WorldBox
  this.input.on('pointermove', p=>{
   if(p.isDown){
    this.cameras.main.scrollX-=(p.x-p.prevPosition.x)/this.cameras.main.zoom;
    this.cameras.main.scrollY-=(p.y-p.prevPosition.y)/this.cameras.main.zoom;
   }
  });

  // WHEEL ZOOM - limit para hindi blurry
  this.input.on('wheel',(p,dx,dy,dz)=>{
   let cam=this.cameras.main;
   // 0.5 to 2.0 lang max zoom para hindi mag blur
   let nz=Phaser.Math.Clamp(cam.zoom - dy*0.001, 0.5, 2.0);
   cam.setZoom(nz);
  });

  // Pinch zoom mobile
  let lastDist=0;
  this.input.addPointer(1);
  this.input.on('pointermove', (p)=>{
   if(this.input.pointer1.isDown && this.input.pointer2.isDown){
    let dist=Phaser.Math.Distance.Between(this.input.pointer1.x,this.input.pointer1.y,this.input.pointer2.x,this.input.pointer2.y);
    if(lastDist>0){
     let diff=dist-lastDist;
     let cam=this.cameras.main;
     let nz=Phaser.Math.Clamp(cam.zoom + diff*0.002, 0.5, 2.0);
     cam.setZoom(nz);
    }
    lastDist=dist;
   }else{
    lastDist=0;
   }
  });
 }
 update(){
  let sp=12, mx=joy.x, my=joy.y;
  if(this.keys.A.isDown) mx=-1;
  if(this.keys.D.isDown) mx=1;
  if(this.keys.W.isDown) my=-1;
  if(this.keys.S.isDown) my=1;
  if(Math.abs(mx)<0.15) mx=0;
  if(Math.abs(my)<0.15) my=0;
  if(mx||my){
   this.cameras.main.scrollX+=mx*sp/this.cameras.main.zoom;
   this.cameras.main.scrollY+=my*sp/this.cameras.main.zoom;
  }
 }
}

new Phaser.Game({
 type:Phaser.AUTO,
 parent:'game',
 width:innerWidth,
 height:innerHeight,
 backgroundColor:'#2e2e2e',
 scene:WorldBox,
 scale:{mode:Phaser.Scale.RESIZE},
 render:{antialias:true, pixelArt:false, roundPixels:false} // crisp, hindi pixelated blurry
});

let s=nipplejs.create({zone:document.getElementById('joy'),mode:'static',position:{left:'60px',top:'60px'},color:'white',size:90});
s.on('move',(e,d)=>{if(d&&d.vector){joy.x=d.vector.x; joy.y=-d.vector.y;}});
s.on('end',()=>{joy.x=0;joy.y=0;});
</script></body></html>
