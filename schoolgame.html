<!DOCTYPE html><html><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>V59 FIXED 40% ZOOM</title>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
<style>
html,body{margin:0;padding:0;background:#0f0f0f;overflow:hidden;height:100%;touch-action:none;font-family:Arial}
#game{position:fixed;inset:0}
#top{position:fixed;top:0;left:0;right:0;background:rgba(0,0,0,.85);color:#fff;padding:7px 12px;font-size:11px;font-weight:900;z-index:40;display:flex;justify-content:space-between}
#toggle{position:fixed;bottom:15px;left:50%;transform:translateX(-50%);background:#4ade80;color:#000;border:none;border-radius:22px;padding:12px 26px;font-weight:900;font-size:14px;z-index:70;box-shadow:0 4px 15px rgba(0,0,0,.6)}
#shopWrap{position:fixed;bottom:0;left:0;right:0;height:160px;background:#0a0a0a;border-top:3px solid #333;z-index:60;transition:transform .3s}
#shopWrap.closed{transform:translateY(100%)}
#shop{height:100%;display:flex;gap:10px;padding:10px;overflow-x:auto}
.card{width:84px;min-width:84px;height:138px;background:#222;border:2px solid #444;border-radius:12px;display:flex;flex-direction:column;align-items:center;padding:6px;flex-shrink:0}
.card img{width:48px;height:48px;object-fit:contain;background:#1a1a1a;border-radius:8px;border:1px solid #333}
.card b{font-size:8px;color:#fff;margin:4px 0;text-align:center;height:18px;display:flex;align-items:center}
.card button{background:#4ade80;color:#000;border:none;border-radius:8px;padding:5px;font-size:9px;font-weight:900;width:100%;cursor:pointer}
#tip{position:fixed;bottom:70px;left:10px;background:rgba(0,0,0,.7);color:#fff;padding:6px 12px;border-radius:14px;font-size:10px;font-weight:700;z-index:50}
</style>
</head><body>
<div id="game"></div>
<div id="top"><span>🏝️ TRIANGLE 40% FIXED - V59</span><span>🪙 <span id="coins">500</span> | <span id="cnt">0</span> | FIXED 40%</span></div>
<div id="tip">🖐️ Drag map to move | Shop = stop | Tap map to place</div>
<div id="shopWrap" class="closed"><div id="shop"></div></div>
<button id="toggle">🛒 OPEN SHOP</button>
<script>
const ANIMALS=['beaver','bee','bunny','cat','caterpillar','chick','cow','crab','deer','dog','elephant','fox','giraffe','hog','koala','lion','monkey','panda','parrot','penguin','pig','polar','tiger'];
const HUMANS=['female-a','female-b','female-c','female-d','female-e','female-f','male-a','male-b','male-c','male-d','male-e','male-f'];
let coins=500, selected=null, isShopOpen=false;

class Fixed40World extends Phaser.Scene{
 constructor(){super('Fixed40World'); this.ents=[]}
 preload(){
  // PRIORITY: new/ folder muna!
  this.load.image('map','new/map-triangle-4k.png');
  this.load.image('map2','assets/maps/map-triangle-4k.png');
  this.load.image('map3','clean/map-triangle-4k.png');
  ANIMALS.forEach(n=>{
   this.load.image('a-'+n,'new/animal-'+n+'.png');
   this.load.image('a2-'+n,'assets/animals/animal-'+n+'.png');
   this.load.image('a3-'+n,'clean/animal-'+n+'.png');
  });
  HUMANS.forEach(n=>{
   this.load.image('h-'+n,'new/character-'+n+'.png');
   this.load.image('h2-'+n,'assets/characters/character-'+n+'.png');
   this.load.image('h3-'+n,'clean/character-'+n+'.png');
  });
 }
 create(){
  const W=3500,H=3500; this.W=W; this.H=H;
  this.add.rectangle(W/2,H/2,W,H,0x1a2a1a).setDepth(0);

  let mapKey=null;
  if(this.textures.exists('map')) mapKey='map';
  else if(this.textures.exists('map2')) mapKey='map2';
  else if(this.textures.exists('map3')) mapKey='map3';

  if(mapKey){
   let tex=this.textures.get(mapKey).getSourceImage();
   this.island=this.add.image(W/2,H/2,mapKey).setDepth(1);
   let ratio=Math.min(2400/tex.width, 2400/tex.height);
   this.island.setDisplaySize(tex.width*ratio, tex.height*ratio);
   this.bounds={x:W/2-1200,y:H/2-1200,w:2400,h:2400};
  }else{
   this.bounds={x:300,y:300,w:2900,h:2900};
   this.add.text(W/2,H/2,'WALANG MAP sa new/ folder!\nUpload mo new/map-triangle-4k.png',{font:'bold 22px Arial',color:'#ff4444',align:'center'}).setOrigin(0.5).setDepth(20);
  }

  // FIXED 40% ZOOM LANG!
  this.cameras.main.setBounds(0,0,W,H);
  this.cameras.main.centerOn(W/2,H/2);
  this.cameras.main.setZoom(0.40); // FIXED!

  // CAMERA DRAG LANG - WALANG ZOOM
  this.isDragging=false; this.dragStart=null;
  this.input.on('pointerdown', p=>{
   if(isShopOpen && p.y < window.innerHeight-160 && selected){
    let wp=this.cameras.main.getWorldPoint(p.x,p.y);
    this.spawn(wp.x,wp.y,selected);
    selected=null;
    return;
   }
   if(!isShopOpen){
    this.isDragging=true;
    this.dragStart={x:p.x, y:p.y, sx:this.cameras.main.scrollX, sy:this.cameras.main.scrollY};
   }
  });
  this.input.on('pointermove', p=>{
   if(this.isDragging && this.dragStart && !isShopOpen){
    let dx=(p.x-this.dragStart.x)/0.40;
    let dy=(p.y-this.dragStart.y)/0.40;
    this.cameras.main.scrollX=this.dragStart.sx - dx;
    this.cameras.main.scrollY=this.dragStart.sy - dy;
   }
  });
  this.input.on('pointerup', ()=>{ this.isDragging=false; this.dragStart=null; });

  this.buildShop();
  document.getElementById('toggle').onclick=()=>{
   isShopOpen=!isShopOpen;
   document.getElementById('shopWrap').className=isShopOpen?'':'closed';
   document.getElementById('toggle').innerHTML=isShopOpen?'❌ CLOSE SHOP':'🛒 OPEN SHOP';
   this.isDragging=false;
  };
 }

 buildShop(){
  const shop=document.getElementById('shop');
  let items=[
   ...HUMANS.map(n=>({id:'h-'+n,name:n,price:20,type:'human'})),
   ...ANIMALS.map(n=>({id:'a-'+n,name:n,price:10,type:'animal'}))
  ];
  items.forEach(it=>{
   let realId=it.id;
   if(!this.textures.exists(realId)){
    if(this.textures.exists('h2-'+it.name)||this.textures.exists('a2-'+it.name)) realId=it.type=='human'?'h2-'+it.name:'a2-'+it.name;
    else if(this.textures.exists('h3-'+it.name)||this.textures.exists('a3-'+it.name)) realId=it.type=='human'?'h3-'+it.name:'a3-'+it.name;
   }
   // IMAGE PATH - try new/ first
   let imgPath=`new/${it.type=='human'?'character':'animal'}-${it.name}.png`;
   
   let c=document.createElement('div'); c.className='card';
   c.innerHTML=`<img src="${imgPath}" onerror="this.onerror=null; this.src='assets/${it.type=='human'?'characters/character':'animals/animal'}-${it.name}.png'; this.onerror=function(){this.src='clean/${it.type=='human'?'character':'animal'}-${it.name}.png'}"><b>${it.name.toUpperCase()}</b><button>🪙${it.price}</button>`;
   c.querySelector('button').onclick=()=>{
    if(coins<it.price) return;
    coins-=it.price; document.getElementById('coins').innerText=coins;
    selected=realId;
    document.querySelectorAll('.card').forEach(x=>x.style.borderColor='#444');
    c.style.borderColor='#4ade80';
   };
   shop.appendChild(c);
  });
 }

 spawn(x,y,id){
  if(!this.textures.exists(id)) return;
  let isHuman=id.includes('female')||id.includes('male');
  // MALAKI NA SIZE PARA KITA SA 40% ZOOM!
  // Tao: dati 32x42 ngayon 110x140 - 3.5x bigger!
  // Hayop small: 80x80, big: 120x120
  let w,h;
  if(isHuman){ w=110; h=140; }
  else{
   if(id.includes('elephant')||id.includes('giraffe')||id.includes('cow')||id.includes('polar')||id.includes('lion')){ w=120; h=120; }
   else if(id.includes('bee')||id.includes('crab')||id.includes('chick')||id.includes('caterpillar')){ w=70; h=70; }
   else { w=90; h=90; }
  }
  let spr=this.add.image(x,y,id).setDepth(10).setInteractive({draggable:true});
  spr.setDisplaySize(w,h);
  spr.vx=(Math.random()-0.5)*1.2; spr.vy=(Math.random()-0.5)*1.2;
  this.ents.push(spr);
  document.getElementById('cnt').innerText=this.ents.length;
  spr.on('drag', (p,dx,dy)=>{
   if(!isShopOpen) return;
   spr.x+=dx/0.40; spr.y+=dy/0.40;
  });
 }

 update(){
  if(isShopOpen) return;
  this.ents.forEach(e=>{
   e.x+=e.vx; e.y+=e.vy;
   if(e.x<this.bounds.x || e.x>this.bounds.x+this.bounds.w) e.vx*=-1;
   if(e.y<this.bounds.y || e.y>this.bounds.y+this.bounds.h) e.vy*=-1;
   if(Math.random()<0.03){ e.vx+=(Math.random()-0.5)*0.4; e.vy+=(Math.random()-0.5)*0.4; }
   // clamp speed
   e.vx=Phaser.Math.Clamp(e.vx,-1.5,1.5); e.vy=Phaser.Math.Clamp(e.vy,-1.5,1.5);
  });
 }
}
new Phaser.Game({type:Phaser.AUTO, parent:'game', width:innerWidth, height:innerHeight, backgroundColor:'#0f0f0f', scene:Fixed40World, scale:{mode:Phaser.Scale.RESIZE}, render:{antialias:true}});
</script></body></html>
